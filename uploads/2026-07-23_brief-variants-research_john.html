  WHAT THIS FILE IS
  ─────────────────
  Canonical alpha MVP reference prototype for v3xp. All downstream
  "fork" files branch from this one. The clinical scenario data objects
  (SCENARIO_A, SCENARIO_B, SCENARIO_C) are the authoritative source of
  patient clinical content across the entire v3xp prototype ecosystem —
  when other prototypes need clinical data, port from here rather than
  inventing new patient data independently.

  The file is a compiled self-contained React bundle (no build step).
  Full visit surface: Schedule → Briefing → In-Visit Agenda →
  Scribe → Review/Sign.

  Most recent change: 2026-07-23 — Lisa Xu's fork UX changes ported
  into this canonical file; July 22 + 23 Lisa forks archived.

  FILE LINEAGE
  ────────────
  oneprototypetorulethemall.html        ← v1, original
  one-prototype-to-rule-them-all-2.html ← v2, this file (canonical)
  Active responsive-design forks:
    2026-07-16_assessment-flow-adaptive-split-drawer_bryan.html
    2026-07-17_assessment-flow-context-rail-evidence-dock_bryan.html
    2026-07-17_assessment-workbench-stable-shell_bryan.html
    2026-07-21_patient-forward-desktop_bryan.html
  Also in this folder: briefing fork, nav island (mobile/desktop),
  schedule fork, design system reference.

  CLINICAL SCENARIOS
  ──────────────────
  Toggle via URL param: ?scenario=a | ?scenario=b (default) | ?scenario=c

  Scenario A — Complex patient (ESRD on HD + 2 hospitalizations +
    4 active specialists + new-onset AFib + COPD GOLD III)
    HFrEF EF 30-35%, ESRD on HD 3x/wk, COPD, T2DM.
    Bucket coverage: Brief WITH assessments AND Brief-only items
    (hospitalization seeding agenda without a direct CA task).

  Scenario B — Post-discharge, moderate complexity [DEFAULT]
    Patient: Ms. Reyes / Willow Jean Humphrey
    Profile: HFrEF (EF 35%), CKD Stage 3→4 (eGFR 29), T2DM, HTN
    Context: 2 weeks post-HF decompensation discharge.
    Why this is the default: Represents the "Brief WITH Assessments"
    connected pattern — Bucket 2 of the 3-bucket framework. Brief items
    directly seed assessment content (hospitalization → HF assessment).

  Scenario C — Stable chronic, routine visit (light brief, assessment-only)
    HFrEF, T2DM, HTN — all stable. No hospitalization or specialist
    encounters. Covers Bucket 3: assessments without brief items.

  WHY THIS PRODUCT EXISTS
  ───────────────────────
  PCPs seeing 40+ patients/day face portal fatigue — rigid, nested tools
  that don't match how they think or move. Today's CA is an end-of-visit
  administrative checklist. v3xp reframes CA as a unified clinical
  assistant: surfaces the right insight at the right moment so providers
  engage during the visit rather than after. MVP shipped June 9, 2026
  (enriched agenda, scribe integration, visit completion flow).
  This prototype is the design surface for the Alpha cohort: Dr. Nelson,
  Dr. Vitale, Dr. Lee, Dr. Durant, Dr. Roque, Dr. Lane.
  PRD author: Jenny Korban.

  KEY DESIGN DECISIONS BAKED IN
  ──────────────────────────────
  (Source: decisions-log.md — see there for full rationale + aligned-by)

  #1  Surface data without editorializing — "like the most humble med
      student." Trust is easily lost when the system makes clinical
      interpretations. Earn it incrementally. (Working Group, 2026-06-22)

  #9  3-bucket design framework — designs must solve all three:
        Bucket 1: Brief items WITHOUT assessments (hospitalization with
                  no CA task — the item is an implicit agenda topic)
        Bucket 2: Brief items WITH assessments (e.g., CKD progression
                  seeding a required task) ← Scenario B default
        Bucket 3: Assessments WITHOUT brief items (e.g., care gaps:
                  diabetic eye exam, mammogram, colorectal screening)
      (Kevin Holub, 2026-06-26)

  #10 Scenario-driven methodology, not exploration-driven. Define
      content scenarios first, then let those drive which interaction
      patterns win. Don't pick the prototype that "looks best" in
      isolation. (Kevin, 2026-06-26)

  #11 Non-assessment topics (patient-raised, e.g. knee pain) appear
      in "Now Discussing" first, then drop to the agenda as a chapter
      header when done — they do NOT instantly populate the agenda.
      (Kevin, David Tsay, Dina Grossman, 2026-06-26)

  #12 Collapsed chapter headers as default state in the visit list.
      First tap explores; second tap gets full detail. (Kevin, Molly,
      2026-06-26)

  #13 Brief items are implicit agenda items even without a Plex task.
      A hospitalization should surface pre-built content when discussed.
      (Kevin, 2026-06-26)

  #15 One experience, three data profiles — same UX pattern, different
      data density. Clinical framings: New/Complex Patient, Routine
      Follow-up, Stable Annual Visit. (Kevin, David, Molly, 2026-06-30)

  #17 Active work stays in Visit. Review = sign-off, not a working
      surface. Incomplete tasks are completable in Review, but the
      primary working space is the visit. (Dina, Kevin, Bryan, 2026-06-30)

  #18 Review absorbs the checkout flow. Sign-and-submit is a transition
      within the same screen, not a separate room. (Bryan, Kevin, David,
      2026-06-30)

  #19 3 tiers of clinical alerting:
        Tier 1: Must interrupt — patient safety, requires conversation
        Tier 2: Should see, don't block — awareness
        Tier 3: Before you go — low urgency, order on the way out
      (Kevin, David, 2026-06-30)

  #20 Don't gate the SOAP note on completing CA tasks. Provider must
      access the visit note in Review even if CA tasks are incomplete.
      (Kevin, 2026-06-30)

  #22 Ask (patient-record lookup) is OUT OF SCOPE for Alpha. Sequenced
      into post-Alpha MVP fast-follow. Jenny exploring minimal affordance
      for parity. (Kevin, Jenny, Mujtaba, 2026-07-13 Leadership Review)

  #23 Fold Anu & Lisa's autofill-confirm "peek" interaction into the
      merged prototype before Alpha ships. Keeps Alpha/MVP cohesive
      with in-flight pod work. (Molly, Kevin, 2026-07-13)

  #24 Alpha ships with the merged prototype's new interaction patterns,
      not today's V2 production UI. Workflow differences matter more
      than visual polish for a small curated cohort. (Kevin, 2026-07-13)

  BRIEFING FEEDBACK (David Tsay + Michael Kelley, 2026-06-22)
  ────────────────────────────────────────────────────────────
  - Surface data; let the practitioner make the call — don't editorialize
  - Hospitalizations lead the briefing when present (both clinicians named
    this independently; it anchors the whole briefing)
  - Keep it tight and recent: 90 days or last visit window
  - Discharge medication lists are critical (duplicate-med risk)
  - Shift from reporting specific lab values to surfacing new/unexpected labs
  - Surface actual consult notes, not just ICD-10 translations
  - Filter for net-new information relative to what the practitioner already knows
  - Vision is right; execution must earn trust incrementally

  OPEN QUESTIONS (as of 2026-07-23)
  ───────────────────────────────────
  - "Now Discussing" placement: concept endorsed, but prominence and
    position still debated (card at top, peek from bottom, chapter header
    in list). Kevin hesitant on prominence; David and Dina see value.
    Kevin's async note (2026-07-15): leans toward Now Discussing sitting
    LEFT of This Visit — talking about it + seeing insights, connected
    to what's on the right. But sitting above the briefing feels odd.
  - Show our work vs. quiet: visible ambient activity (Dina: demonstrates
    value) vs. reduced noise (Kevin: less distraction). Possible phasing:
    more visible initially, quieter over time as trust builds.
  - Click target multiplicity: when scribing, the same topic appears in
    the Now Discussing bar, agenda list, AND expanded card — what does
    each tap do?
  - Dynamic agenda architecture: David's vision of starting from a blank
    agenda and building through conversation. How does this coexist with
    the pre-populated agenda?
  - Naming: "Scribe" too narrow (→ assistant/agent); "Agenda" awkward
    (→ Visit, Encounter). All names still open.
  - Manual mode parity: how similar should manual-click-through flow be
    to the scribe flow? Eng already treats them differently; design needs
    to catch up.
  - Desktop modal pattern for assessments: Kevin flagged (2026-07-15)
    that modal feels off vs. an expandable task. If modal stays, is the
    patient-data viewer a bottom drawer or a right drawer?

  LEADERSHIP FEEDBACK (Responsive Sizing Working Session, 2026-07-13)
  ────────────────────────────────────────────────────────────────────
  Attendees: Bryan, Kevin, Danny Vu, Molly, David Tsay, Dina, John B-S,
  April Cassan. Full transcript: meetings/2026-07-13_responsive-sizing-
  working-session.md

  Directional decisions from this session:
  - Schedule = navigation tool to pass through, not a state to stay in.
    Once in a focus state, the UI should keep the user heavily focused.
  - Problem is less about white space, more about data prioritization —
    busy not because of layout but because of what data/chrome is shown
    at once. Fix by being more selective with data, not just rearranging.
  - Patient record should shift from "pull" (side panel that gets
    forgotten) toward "push" — the assessment experience should actively
    guide patient-record usage in the flow (Dina, Molly, Danny).
  - L1/L2/L3 should all deep-link to the same source of truth —
    recommenders/evidence bundles and patient record should not diverge
    into two separate data paths. (Danny)
  - Primary surface must be unambiguous — equal-sized, equal-shaded
    panels make it impossible to tell what's primary. (David Tsay)
  - Don't force the small-screen brief/visit separation onto desktop
    purely out of habit — when there's room, let them live together.
    (Bryan, in response to Danny)

  Reference products discussed: Dovetail (layered peek-and-pin panels,
  forward/back nav), Linear (focused single-task state, progressive depth
  of linked data), Gong, Steno, DepoCopilot (ambient capture + review
  queue from sales/legal), Codex (breadcrumb trail back to where you
  were — Dina: great model for navigating into a fetched MRI result
  without disruption), Granola, Glean.

  OFFICE HOURS — Assessment Flow Responsive (2026-07-15)
  ───────────────────────────────────────────────────────
  Attendees: Bryan, Christina, Lisa, Amanda, Molly, Darla; Kevin async.
  Notes: meetings/2026-07-15_assessment-flow-responsive-office-hours.md

  - Christina: how can a user see patient record and view task at once?
    Can "Now Discussing" highlight items from the patient record?
  - Lisa: Now Discussing is about real-time clinical synthesis; patient
    record is for deeper digging. Conflating them feels odd but could
    be a pathway.
  - Amanda: what's the right data hierarchy at each level — tagline /
    one key thing / supporting detail / everything?
  - Molly: lost the mobile model of "how to start, work, and end a
    visit." Desktop needs its own equivalent.
  - Darla: users want to view brief and work the task simultaneously.
  - Kevin (async): likes the wireframe simplification. 1/3–2/3 split
    interesting if it can shift by visit phase (brief-heavy before
    scribing, visit-heavy once scribing starts). Likes 1/2–1/2 fixed
    split as its own answer.

  OFFICE HOURS — Desktop Views (2026-07-20)
  ───────────────────────────────────────────
  Attendees: Bryan, Christina, Mikail, Molly.
  Notes: meetings/2026-07-20_desktop-views-office-hours.md

  - Christina: drawers feel odd on desktop. "Now Discussing" feels
    better aligned with assessments than above the brief.
  - Mikail: how does a drawer transition to a panel at desktop scale?
    Is it still a drawer, or does it need to become a different construct?
  - Molly: feels visit-focused rather than patient-focused. Should the
    visit be an artifact on the patient's overview/record? Liked
    Stephanie's patient-left / visit-right layout — visit felt "small
    and achievable." Desktop = the place users are most apt to look at
    documents; could they view the visit + a document simultaneously?
  - Bryan: at XL breakpoint, could the screen split into canvas-style
    architecture?

  SCRIBE PM NOTES (Anu, captured 2026-07-20)
  ────────────────────────────────────────────
  - Scribe is taking over patient instructions from Horizons this quarter
  - Practitioner follow-up being built at the visit level first;
    longer-term goal: expose at a non-visit level
  - All visits will get a skeleton note regardless of scribe usage,
    to ease the workflow and pre-do work for the user

function makeSparkEl(hlData,sW,sH,fluid){
  if(!hlData||!hlData.spark||hlData.spark.length<2)return null;
  var vals=hlData.spark;
  var pad=6;
  var minV=Math.min.apply(null,vals),maxV=Math.max.apply(null,vals),rng=maxV-minV||1;
  var pts=vals.map(function(v,i){
    var x=(i/(vals.length-1))*(sW-pad)+pad/2;
    var y=sH-12-((v-minV)/rng)*(sH-pad*2-12)-pad;
    return{x:parseFloat(x.toFixed(1)),y:parseFloat(y.toFixed(1))};
  });
  var linePoints=pts.map(function(p){return p.x+","+p.y}).join(" ");
  var lastPt=pts[pts.length-1];
  var firstPt=pts[0];
  var areaBase=sH-12;
  var areaPath="M "+firstPt.x+","+areaBase+" "+pts.map(function(p){return"L "+p.x+","+p.y}).join(" ")+" L "+lastPt.x+","+areaBase+" Z";
  var sColor=hlData.trend==="up"?"#ef4444":hlData.trend==="down"?"#22c55e":"#6366f1";
  var sColorLight=hlData.trend==="up"?"rgba(239,68,68,0.10)":hlData.trend==="down"?"rgba(34,197,94,0.10)":"rgba(99,102,241,0.10)";
  // fluid=true: SVG fills its container via viewBox + 100% dimensions (used in V2 drawer)
  var svgProps=fluid
    ?{viewBox:"0 0 "+sW+" "+sH,preserveAspectRatio:"none",style:{width:"100%",height:"100%",display:"block",overflow:"visible"}}
    :{width:sW,height:sH,style:{overflow:"visible"}};
  var wrapStyle=fluid
    ?{width:"100%",height:"100%",display:"flex"}
    :{flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center"};
  return React.createElement("div",{style:wrapStyle},
    React.createElement("svg",svgProps,
      React.createElement("path",{d:areaPath,fill:sColorLight,stroke:"none"}),
      React.createElement("line",{x1:String(firstPt.x),y1:String(areaBase),x2:String(lastPt.x),y2:String(areaBase),stroke:"#ebebeb",strokeWidth:"1"}),
      React.createElement("polyline",{points:linePoints,fill:"none",stroke:sColor,strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"}),
      React.createElement("circle",{cx:lastPt.x,cy:lastPt.y,r:3.5,fill:sColor}),
      React.createElement("text",{x:firstPt.x,y:firstPt.y-6,fontSize:8,fill:"#bbb",textAnchor:"start"},String(vals[0])),
      React.createElement("text",{x:lastPt.x,y:lastPt.y-6,fontSize:8,fill:sColor,textAnchor:"end",fontWeight:700},String(vals[vals.length-1]))));
}

// Render a narrative string with <strong> terms as tappable links
function NarrativeWithLinks({html,onCondClick,ACC}){
  var parts=[];
  var remaining=html;
  var re=/<strong>(.*?)<\/strong>/g;
  var m;var last=0;
  while((m=re.exec(html))!==null){
    if(m.index>last)parts.push({type:"text",text:html.slice(last,m.index)});
    parts.push({type:"bold",text:m[1]});
    last=m.index+m[0].length;
  }
  if(last<html.length)parts.push({type:"text",text:html.slice(last)});
  return React.createElement("span",null,
    parts.map(function(p,i){
      if(p.type==="text")return React.createElement("span",{key:i},p.text);
      var key=COND_LINK_MAP[p.text];

    })
  );
}

function AnnotationOverlay({annotations,frameH,panel,phaseView,annotationsOn,scribeStarted,children}){
  var ACCENT="#444AD3",PANEL_W=220,PHONE_W=390,BOX_W=200,BOX_PAD=10;

    ?annotations.filter(function(a){
        if(!a.panels||a.panels.indexOf(panel)<0)return false;
        if(a.requires&&a.requires.indexOf("scribeStarted")>=0&&!scribeStarted)return false;
        if(a.notWhen&&a.notWhen.indexOf("scribeStarted")>=0&&scribeStarted)return false;
        return true;})
    :[];
  var visLeft=visAnnot.filter(function(a){return a.side==="left";});
  var visRight=visAnnot.filter(function(a){return a.side==="right";});
  var hasAnnot=visAnnot.length>0;
  if(!hasAnnot){
    return React.createElement("div",{style:{flexShrink:0}},children);
  }
  return React.createElement("div",{style:{display:"flex",alignItems:"flex-start",flexShrink:0,position:"relative"}},
    // Left annotation column
    React.createElement("div",{style:{width:PANEL_W,height:frameH,position:"relative",flexShrink:0}},
      visLeft.map(function(a){
        return React.createElement("div",{key:a.id+"box",style:{
          position:"absolute",top:a.top,left:BOX_PAD,width:BOX_W,
          background:"#fff",border:"1px solid #E2E1EE",borderLeft:"3px solid "+ACCENT,

        }},
          React.createElement("div",{style:{fontSize:9,fontWeight:700,color:ACCENT,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}},a.title),
          React.createElement("div",{style:{fontSize:10.5,color:"#555",lineHeight:1.5}},a.desc)
        );
      })
    ),
    // Center: phone frame (children)
    React.createElement("div",{style:{flexShrink:0}},children),
    // Right annotation column
    React.createElement("div",{style:{width:PANEL_W,height:frameH,position:"relative",flexShrink:0}},
      visRight.map(function(a){
        return React.createElement("div",{key:a.id+"box",style:{
          position:"absolute",top:a.top,left:BOX_PAD,width:BOX_W,
          background:"#fff",border:"1px solid #E2E1EE",borderRight:"3px solid "+ACCENT,
          borderRadius:6,padding:"9px 11px",boxShadow:"0 2px 8px rgba(68,74,211,0.1)"
        }},

          React.createElement("div",{style:{fontSize:10.5,color:"#555",lineHeight:1.5}},a.desc)

    // SVG overlay — spans full 830px for bezier connector lines
    React.createElement("svg",{style:{position:"absolute",top:0,left:0,pointerEvents:"none"},width:TOTAL_W,height:frameH},
      visAnnot.map(function(a){
        var isLeft=a.side==="left";
        var byCY=a.top+44;
        // start x: right edge of left box, or left edge of right box
        var sx=isLeft?BOX_PAD+BOX_W:PANEL_W+PHONE_W+BOX_PAD;
        var sy=byCY;
        // end x: actual position within phone (PANEL_W offsets into SVG space)
        var ex=PANEL_W+a.tx;
        var ey=a.ty;
        var mid=(sx+ex)/2;

          React.createElement("path",{d:"M"+sx+","+sy+" C"+mid+","+sy+" "+mid+","+ey+" "+ex+","+ey,
            stroke:"#C4C2D6",strokeWidth:1.5,fill:"none",strokeDasharray:"4,3"}),
          React.createElement("circle",{cx:ex,cy:ey,r:3.5,fill:ACCENT,opacity:0.7})
        );
      })
    )
  );

// ─── Ask suggestions helper ─────────────────────────────
function getAskSuggestions(briefItems,items,scenario){
  var prompts=[];
  // Pull from brief items
  (briefItems||[]).forEach(function(b){
    if(b.type==="hospitalization"){
      if(b.diagnoses&&b.diagnoses.length)prompts.push("Post-"+b.label.replace(/\(.*\)/,"").trim()+" watch-outs");
      var meds=(b.content&&b.content.dischargeMeds)||[];
      if(meds.length>=2){
        // check for interaction-worthy pairs
        var hasLoop=meds.some(function(m){return /furosemide|lasix/i.test(m)});
        var hasSGLT2=meds.some(function(m){return /jardiance|sglt2|empagliflozin|dapagliflozin/i.test(m)});
        var hasBeta=meds.some(function(m){return /carvedilol|metoprolol|atenolol|bisoprolol/i.test(m)});
        var hasInsulin=meds.some(function(m){return /insulin|glargine|lispro/i.test(m)});
        if(hasLoop&&hasSGLT2)prompts.push("Furosemide + Jardiance interaction");
        if(hasBeta&&hasInsulin)prompts.push("Beta-blocker + insulin hypoglycemia masking");
      }
    }
    if(b.type==="encounter"&&b.specialty){
      prompts.push(b.specialty+" follow-up priorities");
    }
    if(b.type==="med_change"){
      if(b.changeType==="new")prompts.push(b.medication+" — new med counseling points");
      if(b.changeType==="discontinued")prompts.push("Why was "+b.medication+" stopped?");
    }
    if(b.type==="labs"){
      var abnLab=(b.labs||[]).reduce(function(found,g){
        if(found)return found;
        return (g.items||[]).find(function(i){return i.flag==="high"||i.flag==="low";});
      },null);
      if(abnLab)prompts.push(abnLab.name+" trend — "+abnLab.value);
    }
  });
  // Pull from visit agenda items
  (items||[]).forEach(function(item){
    if(item.source==="gap")prompts.push(item.label+" — evidence and counseling");
    if(item.id==="hfref")prompts.push("Post-CHF watch-outs");
    if(item.id==="ckd"){var sub=item.subDetail||"";prompts.push("CKD staging"+(sub?" — "+sub.replace("eGFR","eGFR "):""));}
    if(item.id==="dm"){var sub2=item.subDetail||"";prompts.push("Basal insulin decision"+(sub2?" ("+sub2+")":""));}
    if(item.id==="htn")prompts.push("HTN treatment options given current meds");
  });
  // Deduplicate and cap at 5
  var seen={};
  var unique=prompts.filter(function(p){if(seen[p])return false;seen[p]=true;return true;});
  return unique.slice(0,5);
}

// ─── Ask response generator ──────────────────────────────
function getAskResponse(query,briefItems,items,scenario){
  var q=(query||"").toLowerCase();
  var sections=[];

  // Helper: find meds from brief
  var allMeds=(briefItems||[]).filter(function(b){return b.type==="med_change";});
  var allHosps=(briefItems||[]).filter(function(b){return b.type==="hospitalization";});
  var allEncs=(briefItems||[]).filter(function(b){return b.type==="encounter";});
  var allLabs=(briefItems||[]).filter(function(b){return b.type==="labs";});
  var agendaItems=(items||[]);

  // ── Drug interactions ──
  if(/interact|furosemide|lasix|jardiance|sglt2/i.test(query)){
    sections.push({type:"answer",label:"Drug Interaction",body:"Furosemide (loop diuretic) and empagliflozin/SGLT2 inhibitors have additive diuretic effects. Combined use increases risk of volume depletion, hypotension, and AKI — particularly relevant in patients with HFrEF or CKD."});
    sections.push({type:"bullets",label:"Watch for",items:["Orthostatic hypotension or dizziness","Creatinine rise (>0.3 mg/dL from baseline)","Weight drop >2 lb/day suggesting over-diuresis","Electrolyte depletion (K+, Na+, Mg2+)"]});
    sections.push({type:"bullets",label:"Clinical action",items:["Check electrolytes and renal function if both active","Reduce Furosemide dose if eGFR dropping","Hold SGLT2i if acute illness or planned contrast"]});
  }

  // ── Beta-blocker + insulin masking ──
  else if(/beta.block|carvedilol|metoprolol|insulin.*mask|mask.*hypo/i.test(query)){
    sections.push({type:"answer",label:"Beta-Blockade & Hypoglycemia",body:"Beta-blockers blunt the tachycardic response to hypoglycemia, masking a key warning sign. Non-selective beta-blockers (e.g. carvedilol) also impair glycogenolysis, potentially prolonging hypoglycemic episodes."});
    sections.push({type:"bullets",label:"Symptoms that still occur despite beta-blockade",items:["Diaphoresis (sweating) — preserved adrenergic response","Tremor and pallor","Hunger and confusion"]});
    sections.push({type:"bullets",label:"Counseling points for this patient",items:["Review non-adrenergic hypoglycemia symptoms","Keep glucose tabs or fast-acting carbs accessible","Frequency of fasting glucose checks while on both agents","Target glucose range and when to call"]});
  }

  // ── Post-CHF / post-hospitalization watch-outs ──
  else if(/post.chf|post.hosp|watch.out|chf|decompens|re.admiss/i.test(query)){
    var hosp=allHosps[0]||null;
    var bnpNow=hosp?(((hosp.content||{}).labs||[]).find(function(l){return /bnp/i.test(l.name)&&/discharge/i.test(l.name);})||((hosp.content||{}).labs||[]).find(function(l){return /bnp/i.test(l.name);})):null;
    sections.push({type:"answer",label:"Post-Discharge Red Flags",body:"Patients discharged after HF decompensation are at highest readmission risk in the first 2 weeks. Early decompensation can be subtle."+(bnpNow?" BNP at discharge was "+bnpNow.value+".":" ")});
    sections.push({type:"bullets",label:"Warn patient to call if",items:["Weight gain >3 lb in 2 days or >5 lb in a week","Increasing leg swelling, SOB lying flat, or waking at night with breathlessness","New or worsening cough","Dizziness or near-syncope (volume depletion vs. over-diuresis)"]});
    sections.push({type:"bullets",label:"Today — confirm before they leave",items:["Daily weight log in place (scale at home?)","Sodium restriction <2g/day understood","Follow-up appointments scheduled: PCP + cardiology","Medication changes from discharge understood"]});
  }

  // ── HbA1c / A1c trend ──
  else if(/hba1c|a1c|glycat|hemoglobin.*a1/i.test(query)){
    var a1cItem=null;
    (allLabs).forEach(function(l){(l.labs||[]).forEach(function(g){(g.items||[]).forEach(function(i){if(/a1c|hba1c/i.test(i.name)&&!a1cItem)a1cItem=i;});});});
    var a1cVal=a1cItem?a1cItem.value:"not recently measured";
    var note=a1cItem&&a1cItem.note?a1cItem.note:"";
    sections.push({type:"answer",label:"HbA1c Context",body:"Current HbA1c: "+a1cVal+(note?" ("+note+")":"")+"."});
    sections.push({type:"bullets",label:"Interpret in context",items:["Standard T2DM target: <7.0% (ADA), or <8.0% in older/complex patients","ESRD patients: HbA1c may be falsely low due to shortened RBC survival — fructosamine more reliable","Rapid normalization in high-risk cardiac patients increases hypoglycemia risk"]});
    sections.push({type:"bullets",label:"Next steps to consider",items:["Fasting glucose log review at this visit","Confirm insulin titration plan if on glargine","Retinal exam referral if not done in 12 months","Renal-safe medication options: insulin, DPP-4i (dose-adjusted); avoid SGLT2i if eGFR <30, metformin if CKD4+"]});
  }

  // ── CKD staging ──
  else if(/ckd|egfr|creatinine|renal|kidney|staging/i.test(query)){
    var ckdItem=agendaItems.find(function(i){return i.id==="ckd";});
    var sub=ckdItem?(ckdItem.subDetail||ckdItem.detail||""):"";
    sections.push({type:"answer",label:"CKD Staging",body:"CKD is staged by eGFR and albuminuria. "+(sub?"Current data: "+sub+". ":"")+"Stage 3a=45–59, 3b=30–44, Stage 4=15–29, Stage 5=<15 mL/min/1.73m²."});
    sections.push({type:"bullets",label:"Stage 4 implications (eGFR 15–29)",items:["Nephrology co-management — essential","Prepare for renal replacement therapy (HD, PD, transplant referral)","Avoid NSAIDs, nephrotoxic contrast unless essential","Medication dose adjustments: metformin hold at eGFR <30, many antibiotics need dose reduction","Potassium and phosphorus restrictions"]});
    sections.push({type:"bullets",label:"Monitor at each visit",items:["BMP: creatinine, BUN, K+, HCO3","BP target <130/80 mmHg","Urine ACR (if not recent)","Anemia: Hgb, iron studies","Referral to nephrology if not yet established"]});
  }

  // ── Basal insulin ──
  else if(/basal|insulin|glargine|titrat|diabetes.*insulin|dm.*insulin/i.test(query)){
    var dmItem=agendaItems.find(function(i){return i.id==="dm";});
    var a1cRef=dmItem?(dmItem.subDetail||""):"";
    sections.push({type:"answer",label:"Basal Insulin Decision",body:"Basal insulin (glargine, detemir, degludec) is the preferred add-on when A1c remains above target on oral agents, or when oral agents are contraindicated."+(a1cRef?" Current: "+a1cRef+".":"")});
    sections.push({type:"bullets",label:"Starting dose guidance",items:["Start: 10 units qHS (or 0.1–0.2 u/kg/day)","Titrate: +2 units every 3 days if fasting BG >130 mg/dL","Target fasting BG: 80–130 mg/dL","Hold or reduce if fasting BG <80 on 2+ occasions"]});
    sections.push({type:"bullets",label:"Special considerations for this patient",items:["ESRD: insulin clearance reduced — lower starting dose, closer monitoring","Beta-blockade masks tachycardia; counsel on sweating/tremor as hypo signs","Hypoglycemia on hemodialysis days is higher risk","Document home glucose monitoring frequency at this visit"]});
  }

  // ── HTN treatment ──
  else if(/htn|hypertens|blood.*press|bp.*target|uptitrat/i.test(query)){
    sections.push({type:"answer",label:"Hypertension in HFrEF / CKD",body:"BP target for this patient is <130/80 mmHg (AHA/ACC for HFrEF + CKD). Current medications may already have synergistic BP-lowering effects."});
    sections.push({type:"bullets",label:"Preferred agents in HFrEF + CKD",items:["ACE inhibitor or ARB — first-line, renoprotective; monitor K+ and Cr","Beta-blocker (carvedilol, metoprolol succinate) — mortality benefit in HFrEF","Loop diuretic (Furosemide) — volume-mediated BP reduction","Spironolactone/eplerenone — add-on for resistant HTN; monitor K+ carefully in CKD"]});
    sections.push({type:"bullets",label:"Avoid or use with caution",items:["Dihydropyridine CCBs (amlodipine) — may worsen edema in HF","NSAIDs — raise BP and blunt diuretic effect","Combination ACE+ARB — increased AKI and hyperkalemia risk"]});
  }

  // ── Eye exam / diabetic retinopathy ──
  else if(/eye|retina|retinop|ophthal|vision|diabetic.*eye/i.test(query)){
    sections.push({type:"answer",label:"Diabetic Eye Exam",body:"Annual dilated fundus exam is recommended for all patients with diabetes. With A1c above goal, the risk of diabetic retinopathy and macular edema is elevated."});
    sections.push({type:"bullets",label:"Why this matters now",items:["Diabetic retinopathy is the leading cause of preventable blindness in working-age adults","Early detection allows laser or anti-VEGF treatment before vision loss","A1c >8% substantially increases annual progression risk"]});
    sections.push({type:"bullets",label:"Referral pathway",items:["Order dilated fundus exam with ophthalmology or optometry","Specify 'diabetic eye exam' on referral — not routine vision check","Document last exam date in chart","Return sooner if any visual changes in the interim"]});
  }

  // ── Mammogram / colorectal screening ──
  else if(/mammogram|breast.*screen|colorectal|colonoscopy|fit.*test|stool/i.test(query)){
    var isMammo=/mammogram|breast/i.test(query);
    if(isMammo){
      sections.push({type:"answer",label:"Mammogram Screening",body:"USPSTF recommends biennial mammography for average-risk women ages 40–74. ACR and ACOG recommend annual screening starting at 40. Check when last screening was documented."});
      sections.push({type:"bullets",label:"At this visit",items:["Confirm last mammogram date in chart","Order bilateral screening mammogram if overdue","Note: dense breast tissue on prior reports warrants supplemental imaging discussion","Referral to breast center if any palpable abnormality"]});
    } else {
      sections.push({type:"answer",label:"Colorectal Cancer Screening",body:"USPSTF recommends colorectal cancer screening for adults ages 45–75. Options include colonoscopy (every 10 years), annual FIT, or Cologuard (every 3 years)."});
      sections.push({type:"bullets",label:"Choose the right modality",items:["Colonoscopy: preferred if family history or prior polyps; requires bowel prep","FIT (annual stool test): good adherence, non-invasive — must be done each year","Cologuard: stool DNA + occult blood; positive result requires colonoscopy follow-up","Flexible sigmoidoscopy: rarely used now"]});
    }
  }

  // ── Specialist follow-up ──
  else if(/cardiology.*follow|follow.*cardiol/i.test(query)){
    var cardEnc=allEncs.find(function(e){return /cardiology/i.test(e.specialty||"");});
    sections.push({type:"answer",label:"Cardiology Follow-Up",body:cardEnc?"Last cardiology visit: "+cardEnc.date+" ("+cardEnc.provider+"). "+cardEnc.summary:"Cardiology follow-up timing should be based on current HF stability — typically 2–4 weeks post-discharge for acute decompensation."});
    sections.push({type:"bullets",label:"Key questions for cardiology",items:["Echocardiogram interval (EF reassessment)","Uptitration of GDMT (ACE/ARB, beta-blocker, MRA, SGLT2i if eGFR allows)","Device evaluation if EF ≤35% (CRT-D candidacy)","BNP trend — target downtrending from admission value"]});
  }

  // ── Fallback generic ──
