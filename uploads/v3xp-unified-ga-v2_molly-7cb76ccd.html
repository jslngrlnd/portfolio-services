     V14 COMPOSITION:

     SOURCE BASE:

       2026-08-14_v3xp-unified-responsive-canvas_bryan.html

     through goToCanvasPosition() + scrollToSection() so anchor-lock, phase

     The left nav holds a persistent phase spine plus phase-specific context; right canvas is a

     V13 CHANGES (from v11): Contextual position control replaced with Codex-style
     tick minimap (.cpn-rail / .cpn-tick / .cpn-preview). canvasPositionOpen and

<style>

/* ── Design tokens ── */
:root {
  --fg:   #1c1b1f;          /* neutral very dark, not purple-tinted */
  --fg-2: #3c3a44;          /* neutral dark gray for body copy */
  --fg-3: #66646f;          /* readable secondary — less lavender */
  --fg-4: #98959f;          /* quiet tertiary — neutral, not lavender */
  --border: #e4e4e7;        /* neutral border */
  --border-soft: rgba(0,0,0,.06);
  --accent: #2563eb;
  --accent-soft: rgba(37,99,235,.08);
  --accent-mid: rgba(37,99,235,.14);
  --btn-bg: #2563eb;
  --btn-bg-h: #1d4ed8;
  --nav-bg: #31337c;
  --page: #ffffff;
  --surface: #ffffff;
  --surface-2: #f4f4f6;     /* neutral inset — outline, tinted panels */
  --ok: #059669;
  --ok-bg: #ecfdf5;
  --warn: #d97706;
  --warn-bg: rgba(245,158,11,.12);
  --danger: #dc2626;
  --danger-soft: rgba(220,38,38,.075);
  --ease: cubic-bezier(.22,1,.36,1);
  --radius: 14px;
  --workspace-max: 1320px;
  --combined-max: 1800px;
  --record-sheet-width: 400px;
  --agenda-width: 50vw;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html {

}

}

button { font-family: inherit; cursor: pointer; }
.hidden { display: none !important; }
:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent); border-radius: 4px; }

/* ── Demo bar (outside app) ── */

}
.demo-btn:hover { background: rgba(255,255,255,.1); color: #fff; }

/* ── App shell ── */

/* ── Global nav ── */

}

.ctx-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 650; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.record-filter-copy { flex:1;min-width:0; }

}
.ctx-resizer::after {
  content:"";position:absolute;top:50%;left:5px;width:4px;height:52px;
  transform:translateY(-50%);border-radius:4px;background:#d6d7e2;
  box-shadow:0 0 0 1px rgba(255,255,255,.7);transition:background .12s,transform .12s;
}
.ctx-resizer:hover::after,
.ctx-resizer:focus-visible::after,
.ctx-resizer.dragging::after { background:var(--accent);transform:translateY(-50%) scaleX(1.2); }

/* ── Disambiguation bar (when selected assessment ≠ live scribe topic) ── */
.dis-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 24px; border-bottom: 1px solid var(--border-soft);
  background: var(--surface); flex-shrink: 0;
}
.dis-title-block { flex: 1; min-width: 0; }
.dis-title { font-size: 18px; font-weight: 600; color: var(--fg); letter-spacing: -.02em; }
.dis-sub { font-size: 13px; color: var(--fg-3); margin-top: 2px; }

/* ── Workbench wrapper — legacy class, kept for fallback ── */
.workbench-wrapper {
  display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
  border-radius: var(--radius);
  box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 4px 6px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.07);
}

/* ── Schedule ── */
.sched-wrap { max-width: 640px; margin: 0 auto; padding: 28px 24px 60px; overflow-y: auto; flex: 1; min-height: 0; width: 100%; }
.sched-wrap h1 { font-size: 21px; font-weight: 800; margin-bottom: 2px; }
.sched-sub { font-size: 12px; color: var(--fg-3); margin-bottom: 18px; }
.sched-row {
  display: flex; align-items: center; gap: 14px; padding: 11px 13px;
  background: var(--surface); border-radius: 10px; margin-bottom: 7px;
  opacity: .6; box-shadow: 0 1px 3px rgba(20,18,28,.07);
}
.sched-row.go { cursor: pointer; opacity: 1; }
.sched-row.go:hover { box-shadow: 0 2px 6px rgba(20,18,28,.12); }
.sched-t { font-size: 11.5px; font-weight: 600; color: var(--fg-3); width: 60px; flex-shrink: 0; }
.sched-n { font-size: 13px; font-weight: 600; }
.sched-m { font-size: 11.5px; color: var(--fg-3); }

/* ════════════════════════════════════════════════════════════
   VISIT SURFACE
   ════════════════════════════════════════════════════════════ */

/* Patient + appointment header — persistent across all workspace modes (≥1280px) */
.ph {
  flex-shrink: 0; background: var(--surface);
  padding: 0 20px;
  border-bottom: 1px solid var(--border-soft);
}
.ph-inner {
  width: 100%; max-width: var(--combined-max); min-height: 58px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.ph-identity { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; }
/* Scribe controls slot — right side of patient header */
.ph-scribe { flex-shrink: 0; display: flex; align-items: center; }

.ph-back {
  display: inline-flex; align-items: center; gap: 4px;
  border: none; background: none; color: var(--accent);
  font-size: 12.5px; font-weight: 500; cursor: pointer; padding: 6px 0; font-family: inherit;
}
.ph-back:hover { text-decoration: underline; }
.ph-patient { min-width: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ph-name { font-size: 17px; font-weight: 650; letter-spacing: -.02em; color: var(--fg); line-height: 1.2; white-space: nowrap; }
.ph-meta { font-size: 12px; color: var(--fg-3); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.ph-dot { color: var(--border); }
.ph-record-trigger {
  height: 36px; display: inline-flex; align-items: center; gap: 7px;
  padding: 0 12px; border: 1px solid var(--border); border-radius: 9px;
  background: var(--surface); color: var(--fg-2); font-size: 12px; font-weight: 600; white-space: nowrap;
}
.ph-record-trigger:hover,
.ph-record-trigger.open { color: var(--accent); background: var(--accent-soft); border-color: rgba(37,99,235,.25); }
.ph-record-trigger svg { width: 15px; height: 15px; }
.ph-scribe-ask-group { display:flex; align-items:center; gap:6px; flex-shrink:0; }

/* ── Two-surface outer layout: workspace | resizer | patient record ── */
.outer {
  flex: 1; min-height: 0;
  display: flex;
  padding: 14px 16px;
  overflow: hidden; background: var(--page);
  gap: 0;
  justify-content: center; position: relative;
}
.outer .visit-workspace {
  flex: 0 0 50%; max-width: 50%; min-width: 0;
}
/* Ask open without canvas: workspace fills remaining ~67%, ask anchors right at 33% */
.outer.record-open .visit-workspace {
  flex: 1 1 auto;
  max-width: none;
}
.ctx-sheet.is-closed,
.ctx-resizer.is-closed { display: none; }

/* ════════════════════════════════════════════════════
   LEFT RAIL — frameless, floats on page canvas
   ════════════════════════════════════════════════════ */
.rail-l { overflow-y: auto; padding: 16px 18px 20px; }
.rl-group { padding-bottom: 18px; }
.rl-group:not(:first-child) { padding-top: 14px; border-top: 1px solid var(--border-soft); }

/* Section headings: sentence-case, stronger contrast, modest weight */
.rl-label {
  font-size: 12.5px; font-weight: 600;
  color: var(--fg-2); margin-bottom: 7px;
  /* removed uppercase + heavy letter-spacing */
}

/* Narrative copy: readable size, good contrast */
.rl-narrative { font-size: 13.5px; line-height: 1.5; color: var(--fg-2); }
.rl-narrative a { color: #0069a8; cursor: pointer; text-decoration: none; }
.rl-narrative a:hover { text-decoration: underline; }

/* Needs attention */
.attn-list { display: flex; flex-direction: column; gap: 7px; }
.attn-item { display: flex; align-items: flex-start; gap: 7px; }
.attn-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
.attn-dot.c { background: var(--danger); }
.attn-dot.w { background: var(--warn); }
.attn-dot.n { background: var(--fg-4); }
.attn-n { font-size: 13.5px; font-weight: 600; color: var(--fg); line-height: 1.35; }
.attn-d { font-size: 12.5px; color: var(--fg-3); margin-top: 2px; }

/* Relevant now */
.rel-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; color: var(--accent);
  background: var(--accent-soft); border-radius: 999px;
  padding: 2px 9px; margin-bottom: 8px;
}
.rel-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; }
.rel-k { font-size: 12px; color: var(--fg-3); white-space: nowrap; padding: 2px 0; }
.rel-v { font-size: 13.5px; font-weight: 600; color: var(--fg); }
.rel-v.ok { color: var(--ok); }
.rel-v.w { color: var(--danger); }
.rel-note { font-size: 11.5px; color: var(--fg-3); grid-column: 2; margin-top: -1px; }

/* Open full record */
.rl-open {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 8px 0; border: none; background: transparent;
  color: var(--accent); font-size: 13px; font-weight: 500;
  cursor: pointer; text-align: left; font-family: inherit;
}
.rl-open:hover { text-decoration: underline; }

/* Visit brief — expandable from "Since last visit" */
.rl-brief-event {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border-soft);
}
.rl-brief-meta { font-size: 11px; color: var(--fg-3); margin-bottom: 2px; display: flex; align-items: center; gap: 5px; }
.rl-brief-badge { font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; text-transform: uppercase; }
.rl-brief-badge.hosp { color: var(--danger); background: var(--danger-soft); }
.rl-brief-badge.enc  { color: var(--accent); background: var(--accent-soft); }
.rl-brief-badge.rx   { color: var(--ok);     background: var(--ok-bg); }
.rl-brief-heading { font-size: 13px; font-weight: 600; color: var(--fg); margin-bottom: 2px; }
.rl-brief-detail  { font-size: 12px; color: var(--fg-3); line-height: 1.5; }
.rl-brief-med-row { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; padding: 3px 0; }
.rl-brief-med-name { font-weight: 600; color: var(--fg); }
.rl-brief-med-note { color: var(--fg-3); }
/* Show more / less toggle */
.rl-toggle {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 10px; border: none; background: none;
  color: var(--accent); font-size: 12px; font-weight: 600;
  cursor: pointer; padding: 0; font-family: inherit;
}
.rl-toggle:hover { text-decoration: underline; }

/* ════════════════════════════════════════════════════
   WORKBENCH — flex row. canvas-col (flex:1) + optional record panel (400px).
   Shadow and border-radius live on .workbench-wrapper above.
   ════════════════════════════════════════════════════ */
.workbench {
  display: flex; flex-direction: row;
  background: var(--surface);
  flex: 1; min-height: 0; overflow: hidden;
}

/* Session header: inside canvas-col flex column — does not affect outline position */
.ssh {
  flex-shrink: 0;
  padding: 12px 24px 13px;
  border-bottom: 1px solid var(--border-soft);
  background: var(--surface);
  min-height: 64px;
  display: flex; align-items: stretch;
}
.ssh.live-scribe-header {
  min-height: 86px; padding: 14px 22px;
  background: #fbfdff;
}
.ssh-inner { width: 100%; display: flex; align-items: center; gap: 20px; }
.ssh-state-info { flex: 1; min-width: 0; }
.ssh-kicker { font-size: 11.5px; font-weight: 600; color: var(--fg-3); margin-bottom: 2px; letter-spacing: 0; }
.ssh-state-title { font-size: 20px; font-weight: 600; color: var(--fg); letter-spacing: -.02em; line-height: 1.2; }
.ssh-state-sub { font-size: 13px; color: var(--fg-3); margin-top: 1px; }
/* "Now discussing" eyebrow: small but readable, not aggressively tracked */
.ssh-nd-eyebrow { font-size: 11.5px; font-weight: 600; color: var(--fg-3); margin-bottom: 3px; }

/* Localized Scribe activity — expanded at rest, compact when another item is open. */
.scribe-local {
  margin-left: auto; flex: 0 0 auto; width: min(420px, 44%);
  border: 1px solid #dbe5ee; border-radius: 11px; background: #fbfdff;
  padding: 10px 11px; color: var(--fg);
}
.scribe-local.compact {
  width: auto; min-width: 310px; padding: 7px 8px 7px 10px;
  display: flex; align-items: center; gap: 9px; background: #fff;
}
.scribe-local-top { display: flex; align-items: center; gap: 7px; }
.scribe-local-status { display: inline-flex; align-items: center; gap: 6px; color: var(--danger); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .035em; }
.scribe-local-status::before { content:""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.scribe-local-status.paused { color: var(--fg-3); }
.scribe-local-status.paused::before { animation: none; }
.scribe-local-time { margin-left: auto; font-size: 10.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.scribe-local-title { margin-top: 4px; font-size: 14px; font-weight: 650; color: var(--fg); line-height: 1.3; }
.scribe-local-summary { margin-top: 3px; color: var(--fg-3); font-size: 11.5px; line-height: 1.4; }
.scribe-local-controls { display: flex; align-items: center; gap: 3px; margin-left: 8px; }
.scribe-local-btn {
  height: 28px; padding: 0 8px; border: none; border-radius: 7px; background: transparent;
  display: inline-flex; align-items: center; gap: 4px; color: var(--fg-3); font-size: 10.5px; font-weight: 650;
}
.scribe-local-btn:hover { color: var(--accent); background: var(--accent-soft); }
.scribe-live-return { color: var(--accent); padding-left: 9px; padding-right: 9px; }
.scribe-local.compact .scribe-local-status { white-space: nowrap; }
.scribe-local.compact .scribe-local-title { margin: 0; max-width: 145px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.scribe-local.compact .scribe-local-summary { display: none; }
.scribe-local.compact .scribe-local-time { margin-left: 0; }
.scribe-local.expanded-pinned { width: min(420px, 44%); }
.ssh-start-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.scribe-local.full {
  width: 100%; margin: 0; padding: 0; border: none; border-radius: 0; background: transparent;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.scribe-live-copy { min-width: 0; }
.scribe-local.full .scribe-local-status { font-size: 10.5px; }
.scribe-local.full .scribe-local-status::before { animation: scribeHeartbeat 2.8s ease-in-out infinite; }
.scribe-local.full .scribe-local-title { margin-top: 5px; font-size: 18px; letter-spacing: -.015em; }
.scribe-live-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.scribe-recording-state {
  display: inline-flex; align-items: center; gap: 7px; margin-right: 4px;
  color: var(--danger); font-size: 12px; font-weight: 650; white-space: nowrap;
}
.scribe-recording-state::before { content:""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.scribe-recording-state.paused { color: var(--fg-3); }
.scribe-live-action {
  height: 36px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--border);
  background: #fff; display: inline-flex; align-items: center; gap: 6px;
  color: var(--fg-2); font-size: 12px; font-weight: 650;
}
.scribe-live-action:hover { color: var(--accent); border-color: rgba(37,99,235,.28); background: var(--accent-soft); }
.scribe-live-action.stop:hover { color: var(--danger); border-color: rgba(220,38,38,.24); background: var(--danger-soft); }
@keyframes scribeHeartbeat {
  0%, 64%, 100% { opacity: 1; transform: scale(1); }
  72% { opacity: .28; transform: scale(.78); }
  80% { opacity: 1; transform: scale(1); }
}

/* Scribe controls — island container groups all states into one visual unit */
.ssh-scribe {
  display: flex; align-items: center; flex-shrink: 0; flex-wrap: nowrap; white-space: nowrap;
  border: 1.5px solid var(--border); border-radius: 999px;
  overflow: hidden; background: var(--surface);
}
/* Idle state: pill-shaped Start Scribe button fills the island */
.ssh-scribe.idle { border: none; background: transparent; }
.rec-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); animation: rPulse 1.3s ease-in-out infinite; flex-shrink: 0; }
@keyframes rPulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
.rec-status-label { font-size: 11.5px; font-weight: 600; color: var(--danger); white-space: nowrap; }
.rec-timer { font-size: 11.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.ssh-scribe-sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; flex-shrink: 0; }
.ssh-sign-icon { width: 20px; height: 20px; border-radius: 50%; background: var(--ok-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* action-dock removed — progression CTAs moved into .ol-actions */

/* Patient record — now a side panel (.record-panel) defined above near canvas-col */
/* Persistent record toolbar — Back to visit is the first and leftmost control */
.rp-head {
  flex-shrink: 0; display: flex; align-items: center; gap: 12px;
  padding: 9px 24px; border-bottom: 1px solid var(--border-soft);
  background: var(--surface);
  /* stays at top of flex column — no scroll needed to reach it */
}
/* ← Back to visit — leftmost, most prominent, keyboard accessible */
.rp-back {
  display: inline-flex; align-items: center; gap: 6px;
  border: none; background: none; color: var(--accent);
  font-size: 13px; font-weight: 600; cursor: pointer; padding: 0;
  font-family: inherit; flex-shrink: 0;
}
.rp-back:hover { text-decoration: underline; }
:focus-visible.rp-back { box-shadow: var(--focus-ring); border-radius: 4px; }
.rp-title { font-size: 13px; font-weight: 600; color: var(--fg-3); flex: 1; }
.rp-scribe-chip { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--danger); background: var(--danger-soft); border-radius: 999px; padding: 3px 10px 3px 8px; white-space: nowrap; }
.rp-body { flex: 1; overflow-y: auto; padding: 20px 28px 64px; max-width: 940px; }
.rp-sec { margin-bottom: 26px; }
.rp-sec-label { font-size: 12.5px; font-weight: 600; color: var(--fg-2); margin-bottom: 10px; }
/* Condition cards — 2-col grid (Stephanie's stat-card pattern) */
.rp-cond-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rp-cond-card { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; }
.rp-cond-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
.rp-cond-name { font-size: 13.5px; font-weight: 600; color: var(--fg); }
.rp-cond-badge { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; white-space: nowrap; }
.rp-cond-badge.warn { color: var(--danger); background: var(--danger-soft); }
.rp-cond-badge.ok { color: var(--ok); background: var(--ok-bg); }
.rp-cond-badge.caution { color: var(--warn); background: var(--warn-bg); }
.rp-cond-badge.neutral { color: var(--fg-3); background: rgba(0,0,0,.05); }
.rp-cond-icd { font-size: 11.5px; color: var(--fg-3); margin-bottom: 10px; }
/* Stat tiles */
.rp-stats { display: flex; gap: 6px; margin-bottom: 10px; }
.rp-stat { flex: 1; background: var(--surface); border-radius: 7px; padding: 8px 10px; }
.rp-stat-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--fg-3); margin-bottom: 3px; }
.rp-stat-val { font-size: 17px; font-weight: 700; color: var(--fg); line-height: 1.1; }
.rp-stat-val.high { color: var(--danger); }
.rp-stat-val.ok { color: var(--ok); }
.rp-stat-sub { font-size: 11px; color: var(--fg-3); margin-top: 2px; }
/* Condition alerts */
.rp-alerts { margin-bottom: 9px; }
.rp-alert { display: flex; align-items: flex-start; gap: 7px; padding: 4px 0; }
.rp-alert:not(:last-child) { border-bottom: 1px solid rgba(0,0,0,.04); }
.rp-adot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.rp-adot.p { background: var(--danger); }
.rp-adot.a { background: var(--warn); }
.rp-atext { font-size: 13px; color: var(--fg-2); line-height: 1.45; }
/* Encounter mini-history on condition card */
.rp-cond-encs { padding-top: 9px; border-top: 1px solid var(--border-soft); margin-top: 9px; display: flex; flex-direction: column; gap: 4px; }
.rp-cenc { display: flex; align-items: baseline; gap: 8px; }
.rp-cenc-date { font-size: 11px; color: var(--fg-3); white-space: nowrap; min-width: 52px; flex-shrink: 0; }
.rp-cenc-text { font-size: 12.5px; color: var(--fg-2); line-height: 1.45; }
/* Open-in-visit action */
.rp-cond-foot { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--border-soft); }
.rp-ov-btn { border: none; background: none; color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer; padding: 0; font-family: inherit; }
.rp-ov-btn:hover { text-decoration: underline; }
/* Medications */
.rp-med { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.rp-med:not(:last-child) { border-bottom: 1px solid rgba(0,0,0,.04); }
.rp-med-name { font-size: 13.5px; font-weight: 600; color: var(--fg); flex: 1; }
.rp-med-dose { font-size: 12.5px; color: var(--fg-3); white-space: nowrap; }
.rp-med-for { font-size: 11px; color: var(--fg-4); }
/* ── Medications table (Ask panel meds tab) ── */
.med-tbl { display: flex; flex-direction: column; }
.med-tbl-search-area { display: flex; flex-direction: column; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #D6D6E1; }
.med-tbl-search { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; background: #FAF9FC; box-sizing: border-box; }
.med-tbl-search input { border: none; background: transparent; font-size: 14px; color: #726D83; outline: none; flex: 1; font-family: inherit; }
.med-tbl-search input::placeholder { color: #726D83; }
.med-tbl-filter-row { display: flex; align-items: center; justify-content: space-between; }
.med-tbl-seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #FAF9FC; border: 1px solid #444AD3; }
.med-tbl-seg-btn { padding: 8px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-size: 14px; font-weight: 600; line-height: 20px; font-family: inherit; color: #726D83; background: none; }
.med-tbl-seg-btn.on { background: #fff; border-color: #444AD3; color: #444AD3; box-shadow: 0px 1px 4px rgba(0,0,0,0.13), 0px 0.1px 0.5px rgba(0,0,0,0.06); }
.pd-lab-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #EAEBEF; cursor:pointer; }
.pd-lab-row:hover { background:#FAFAFA; margin:0 -14px; padding-left:14px; padding-right:14px; }
.pd-lab-detail-row { display:flex; align-items:center; gap:6px; padding:10px 16px; cursor:pointer; }
.pd-lab-detail-row:hover { background:#F9FAFB; }
.pd-enc-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #EAEBEF; cursor:pointer; }
.pd-enc-row:hover { background:#FAFAFA; }
.med-tbl-sort { display: flex; align-items: center; gap: 4px; padding: 6px; border: none; background: none; cursor: pointer; }
.med-tbl-sort-label { font-size: 12px; font-weight: 600; color: #3F45C4; font-family: inherit; }
.med-tbl-col-hdr { display: flex; align-items: center; gap: 12px; padding: 6px 0; background: #FAF9FC; border-bottom: 1px solid #D6D6E1; }
.med-tbl-col-name { flex: 1; font-size: 11px; font-weight: 500; color: #726D83; line-height: 14px; }
.med-tbl-col-dosage { width: 116px; flex-shrink: 0; font-size: 11px; font-weight: 500; color: #726D83; line-height: 14px; }
.med-tbl-col-date { width: 72px; flex-shrink: 0; font-size: 11px; font-weight: 500; color: #726D83; line-height: 14px; }
.med-tbl-col-spacer { width: 16px; flex-shrink: 0; }
.med-tbl-sec-hdr { padding: 10px 16px; background: #FAF9FC; font-size: 11px; font-weight: 600; color: #2B2933; line-height: 16px; text-transform: uppercase; letter-spacing: 0.04em; }
.med-tbl-subsec { padding: 6px 0; }
.med-tbl-subsec + .med-tbl-subsec { border-top: 1px solid #D6D6E1; }
.med-tbl-subsec-label-row { display: flex; align-items: center; gap: 6px; margin-left: 0; padding: 6px 0 4px; }
.med-tbl-subsec-bar { width: 3px; height: 16px; border-radius: 1.5px; flex-shrink: 0; }
.med-tbl-subsec-text { font-size: 11px; font-weight: 600; line-height: 16px; text-transform: uppercase; letter-spacing: 0.04em; }
.med-tbl-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #D6D6E1; }
.med-tbl-row:last-child { border-bottom: none; }
.med-tbl-row-name { flex: 1; font-size: 13px; font-weight: 500; color: #2B2933; line-height: 16px; }
.med-tbl-row-dosage { width: 116px; flex-shrink: 0; font-size: 13px; color: #726D83; line-height: 18px; }
.med-tbl-row-date { width: 72px; flex-shrink: 0; font-size: 13px; color: #726D83; line-height: 18px; }
.med-tbl-active-sec { padding: 0; }
#askQueryInput::placeholder { color: #C4C9D4; }
.med-f-pill { padding: 4px 10px; border-radius: 20px; border: 1px solid #D6D6E1; background: #fff; cursor: pointer; font-size: 11px; font-weight: 600; color: #726D83; white-space: nowrap; font-family: inherit; line-height: 16px; }
.med-f-pill.on { border-color: #444AD3; color: #444AD3; background: #fff; box-shadow: 0 1px 3px rgba(68,74,211,0.12); }
/* Labs */
.rp-labs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rp-lab { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.rp-lab-name { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--fg-3); margin-bottom: 3px; }
.rp-lab-val { font-size: 18px; font-weight: 700; color: var(--fg); line-height: 1.1; }
.rp-lab-val.flag { color: var(--danger); }
.rp-lab-unit { font-size: 11.5px; color: var(--fg-3); font-weight: 500; }
.rp-lab-note { font-size: 11.5px; color: var(--fg-3); margin-top: 2px; }
/* Events */
.rp-event { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; }
.rp-event:not(:last-child) { border-bottom: 1px solid rgba(0,0,0,.04); }
.rp-edot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; background: var(--fg-4); }
.rp-edot.hosp { background: var(--danger); }
.rp-edot.enc { background: var(--accent); }
.rp-edot.lab { background: var(--ok); }
.rp-edate { font-size: 11.5px; color: var(--fg-3); white-space: nowrap; min-width: 76px; flex-shrink: 0; margin-top: 2px; }
.rp-ebody { flex: 1; min-width: 0; }
.rp-etitle { font-size: 13.5px; font-weight: 600; color: var(--fg); }
.rp-edetail { font-size: 12.5px; color: var(--fg-3); margin-top: 2px; line-height: 1.5; }
/* Care gaps */
.rp-gap { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.rp-gap:not(:last-child) { border-bottom: 1px solid rgba(0,0,0,.04); }
.rp-gdot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
.rp-gname { font-size: 13.5px; font-weight: 600; color: var(--fg); flex: 1; }
.rp-gnote { font-size: 12.5px; color: var(--fg-3); }
.rp-addv { border: 1px solid var(--border); background: var(--surface); color: var(--fg-2); font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 9px; cursor: pointer; font-family: inherit; white-space: nowrap; }
.rp-addv:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }

/* Canvas column — flex: 1, fills workbench. position: relative for nd-badge. */
.canvas-col {
  flex: 1; min-width: 0; min-height: 0;
  display: flex; flex-direction: column;
  overflow: hidden; position: relative;background:#f7f7fb;
  container-type: inline-size;
}
.outer.canvas-open:not(.canvas-sheet) .canvas-col { }
/* Scrollable area below the SSH — contains signal panel + canvas content */
.canvas-scroll {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position:relative;z-index:1;contain:paint;overscroll-behavior:contain;
}
#signalPanel { flex-shrink: 0; }
#canvas { flex: 1; min-height: 0; }
#canvas.task-mode { overflow: hidden; }
.canvas-scroll:has(#canvas.task-mode) { overflow: hidden; }

/* ── Agenda strip — horizontal pill bar above workbench card ── */
.agenda-strip {
  flex-shrink: 0; background: var(--surface);
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px 0 18px; min-height: 50px; overflow: hidden;
}
.as-phase {
  font-size: 10.5px; font-weight: 700; color: var(--fg-3);
  text-transform: uppercase; letter-spacing: .05em;
  flex-shrink: 0; white-space: nowrap;
}
.as-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; margin: 0 2px; }
.as-scroll {
  flex: 1; min-width: 0; overflow-x: auto;
  display: flex; align-items: center; padding: 6px 0;
  scrollbar-width: none;
}
.as-scroll::-webkit-scrollbar { display: none; }
.as-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--surface); cursor: pointer; white-space: nowrap; flex-shrink: 0;
  font-family: inherit; transition: background .1s, border-color .1s;
}
.as-pill + .as-pill { margin-left: 3px; }
.as-pill:hover { background: var(--accent-soft); border-color: rgba(37,99,235,.3); }
.as-pill.ap-live { border-color: rgba(217,9,28,.5); background: var(--danger-soft); }
.as-pill.ap-cur  { border-color: var(--accent); background: var(--accent-soft); }
.as-pill.ap-done { border-color: rgba(0,127,97,.3); background: var(--ok-bg); }
.as-pill.ap-warn { border-color: rgba(245,158,11,.45); background: var(--warn-bg); }
.ap-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.ap-dot.live { background: var(--danger); animation: rPulse 1.3s ease-in-out infinite; }
.ap-dot.done { background: var(--ok); }
.ap-dot.warn { background: var(--warn); }
.ap-dot.sel  { background: var(--accent); }
.ap-dot.q    { background: var(--fg-4); opacity: .5; }
.ap-dot.part { background: var(--fg-4); }
.ap-dot.defer { background: var(--fg-4); opacity: .3; }
.ap-name { font-size: 12px; font-weight: 600; color: var(--fg); }
.ap-name.muted { color: var(--fg-3); font-weight: 400; }
.ap-note-sm { font-size: 10.5px; color: var(--fg-3); }
.as-actions { flex-shrink: 0; display: flex; align-items: center; gap: 6px; }

/* ── Now-discussing badge — corner pill shown when scribe topic ≠ selected assessment ── */
.nd-badge {
  position: absolute; top: 12px; right: 14px; z-index: 10;
  display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1.5px solid rgba(217,9,28,.5);
  border-radius: 999px; padding: 5px 10px 5px 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.1); white-space: nowrap;
}
.ndb-label { font-size: 12px; font-weight: 600; color: var(--fg-2); }
.ndb-back {
  font-size: 11.5px; font-weight: 600; color: var(--accent);
  border: none; background: none; cursor: pointer;
  padding: 0 0 0 4px; font-family: inherit;
}
.ndb-back:hover { text-decoration: underline; }

/* ── Record panel — 400px side panel alongside canvas ── */
.record-panel {
  width: 400px; flex-shrink: 0;
  border-left: 1px solid var(--border-soft);
  background: var(--surface);
  display: flex; flex-direction: column; overflow: hidden;
}
.record-panel.rp-hidden { display: none; }

/* Canvas sections */
.cs { padding: 22px 32px; }
.cs + .cs { padding-top: 0; }
.cs-gap { padding-top: 18px; }
/* Section labels: 12px, 600, readable — no aggressive uppercase tracking */
.cs-label {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em;
  color: var(--fg-3); margin-bottom: 8px;
}
.cs-label.ok { color: var(--ok); }
.cs-label.warn { color: var(--warn); }

/* Synthesis paragraph */
.synth { font-size: 14px; line-height: 1.65; color: var(--fg-2); max-width: 62ch; }

/* Two-column section (captured + from record) */
.two-col { padding: 18px 32px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.tc-col {}

/* Captured items */
.cap-list { display: flex; flex-direction: column; gap: 6px; }
.cap-item { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; color: var(--fg-2); line-height: 1.45; }
.cap-icon { flex-shrink: 0; width: 15px; height: 15px; border-radius: 50%; background: var(--ok-bg); display: flex; align-items: center; justify-content: center; margin-top: 1px; }

/* Record evidence */
.ev-list { display: flex; flex-direction: column; gap: 6px; }
.ev-item { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; color: var(--fg-2); line-height: 1.45; }
.ev-icon { flex-shrink: 0; width: 15px; height: 15px; border-radius: 4px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent); margin-top: 1px; }

/* Drafting now — tinted block */
.draft-block { background: var(--surface-2); padding: 16px 32px 18px; margin-top: 18px; }
.draft-caveat { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--warn); margin-bottom: 8px; }
.draft-list { display: flex; flex-direction: column; gap: 5px; }
.draft-item { font-size: 13.5px; color: var(--fg-3); padding-left: 16px; position: relative; line-height: 1.5; }
.draft-item::before { content: '→'; position: absolute; left: 0; color: var(--fg-4); }

/* Transcript link */
.xscript-link { padding: 0 32px 22px; display: block; }
.xscript-btn { border: none; background: none; color: var(--accent); font-size: 12.5px; font-weight: 500; cursor: pointer; padding: 0; font-family: inherit; }
.xscript-btn:hover { text-decoration: underline; }

/* Ready-state center */
.cs-ready-kicker { font-size: 14px; color: var(--fg-2); line-height: 1.6; max-width: 54ch; margin-bottom: 22px; }
.cs-rec-card {
  background: var(--surface-2); border-radius: 10px; padding: 16px 18px;
  margin-bottom: 12px; cursor: pointer;
}
.cs-rec-card:hover { background: var(--accent-soft); }
.cs-rec-card-label { font-size: 11px; font-weight: 600; color: var(--fg-3); margin-bottom: 4px; }
.cs-rec-card-title { font-size: 15px; font-weight: 600; color: var(--fg); margin-bottom: 3px; }
.cs-rec-card-note { font-size: 13px; color: var(--fg-2); }
.cs-flag-card {
  background: var(--warn-bg); border-radius: 10px; padding: 14px 16px;
  display: flex; align-items: flex-start; gap: 9px;
}
.cs-flag-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--warn); flex-shrink: 0; margin-top: 5px; }
.cs-flag-text { font-size: 13.5px; color: var(--warn); line-height: 1.5; }

/* Draft-ready center */
.dr-intro { font-size: 14px; color: var(--fg-2); line-height: 1.65; max-width: 58ch; margin-bottom: 18px; }
.dr-flag-list { display: flex; flex-direction: column; gap: 8px; }
.dr-flag-item {
  background: var(--warn-bg); border-radius: 10px; padding: 12px 14px;
  display: flex; align-items: flex-start; gap: 9px;
}
.dr-flag-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--warn); flex-shrink: 0; margin-top: 6px; }
.dr-flag-body { font-size: 13.5px; color: var(--warn); line-height: 1.5; }
.dr-queue { font-size: 13.5px; color: var(--fg-3); margin-top: 14px; line-height: 1.6; }

/* Review-state center */
.rv-synth { font-size: 14px; line-height: 1.65; color: var(--fg-2); max-width: 62ch; }
.rv-section { padding: 18px 32px 0; }
.rv-sec-label { font-size: 12px; font-weight: 600; color: var(--fg-3); margin-bottom: 5px; }
.rv-draft-flag { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--warn); margin-bottom: 6px; }
.rv-text { font-size: 14px; line-height: 1.65; color: var(--fg-2); font-style: italic; max-width: 60ch; }
.rv-plan-item { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0; }
.rv-plan-item:not(:last-child) { border-bottom: 1px solid rgba(0,0,0,.05); }
.rv-num { width: 18px; height: 18px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 700; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.rv-plan-text { font-size: 14px; color: var(--fg-2); line-height: 1.5; }
.rv-ev-row { font-size: 13.5px; color: var(--fg-2); padding: 5px 0; }
.rv-ev-row:not(:last-child) { border-bottom: 1px solid rgba(0,0,0,.04); }

/* Sign-state center */
.sg-intro { font-size: 14px; color: var(--fg-2); line-height: 1.65; max-width: 56ch; margin-bottom: 18px; }
.sg-meta-row { display: flex; gap: 0; margin-bottom: 18px; }
.sg-stat { flex: 1; text-align: center; padding: 12px 0; }
.sg-stat:not(:last-child) { border-right: 1px solid var(--border-soft); }
.sg-stat-n { font-size: 22px; font-weight: 700; color: var(--ok); }
.sg-stat-l { font-size: 11.5px; font-weight: 500; color: var(--fg-3); margin-top: 3px; }
.sg-note-card { background: var(--surface-2); border-radius: 10px; padding: 14px 16px; }
.sg-note-label { font-size: 11px; font-weight: 600; color: var(--fg-3); margin-bottom: 6px; }
.sg-note-desc { font-size: 13.5px; color: var(--fg-2); line-height: 1.6; margin-bottom: 10px; }
.sg-view-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--fg-2); font-size: 13px; font-weight: 500;
  padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: inherit;
}
.sg-view-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }

/* ── Agenda panel — visit navigation inside nav slice ── */
.agenda-l {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-height: 0;
  background: #f8fafc;
}
.al-head { padding: 14px 14px 8px; }
.al-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-3); }
.al-sub { font-size: 12px; color: var(--fg-3); margin-top: 2px; line-height: 1.4; }
.al-group-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-4); padding: 8px 14px 3px; }
.al-row { display: flex; align-items: flex-start; gap: 8px; padding: 7px 14px; cursor: pointer; transition: background .12s; }
.al-row:hover { background: rgba(37,99,235,.045); }
.al-row.cur { background: #eaf2ff; }
.al-icon { width: 16px; height: 16px; border-radius: 0; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; color: var(--fg-4); }
.al-icon svg { width: 16px; height: 16px; }
.al-icon.q { border: none; opacity: .75; }
.al-icon.curr { color: var(--accent); }
.al-icon.done { color: var(--ok); background: transparent; }
.al-icon.rev { color: var(--accent); background: transparent; }
.al-icon.warn { color: var(--warn); background: transparent; }
.al-icon.part { border: 1.5px solid var(--fg-4); background: rgba(0,0,0,.06); }
.al-icon.live { color: var(--danger); background: transparent; border: none; }
.al-icon.sel  { color: var(--accent); background: transparent; }
.al-icon.defer { border: 1.5px solid var(--fg-4); opacity: .4; }
.al-row.cur .al-icon { color: var(--accent); }
.al-body { flex: 1; min-width: 0; }
.al-name { font-size: 13px; font-weight: 500; color: var(--fg); line-height: 1.3; }
.al-name.muted { color: var(--fg-3); font-weight: 400; }
.al-note { font-size: 11.5px; margin-top: 1px; }
.al-note.ok { color: var(--ok); }
.al-note.warn { color: var(--warn); }
.al-note.m { color: var(--fg-3); }
.al-row.blocking { border-left: 2px solid var(--danger); padding-left: 12px; background: var(--danger-soft); }
.al-row.ambient { margin: 4px 8px; padding: 8px; border-radius: 8px; background: var(--accent-soft); }
.al-row.hosp-followup { background: #fffbf5; }
.al-row.hosp-followup:hover { background: #fef3c7; }
.al-row.hosp-followup.cur { background: #fef3c7; }
.al-row.hosp-followup .al-name { color: #92400e; font-weight: 600; }
.al-row.hosp-followup .al-note { color: #b45309; }
.al-row.hosp-followup .al-icon { color: #b45309; }
.al-tag { margin-left: auto; flex-shrink: 0; font-size: 9.5px; line-height: 16px; padding: 0 6px; border-radius: 999px; color: var(--fg-3); background: var(--surface-2); }
.al-tag.req { color: var(--danger); background: var(--danger-soft); }
.al-tag.optional { color: var(--fg-3); background: rgba(0,0,0,.045); }
.al-tag.adhoc { color: var(--accent); background: var(--accent-soft); }
.al-list { flex: 1; min-height: 0; overflow-y: auto; }
.al-actions { flex-shrink: 0; padding: 10px 14px 12px; border-top: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 6px; }
.al-live-card {
  margin: 0 14px 8px; padding: 2px 0 12px; border-radius: 0;
  background: transparent; border: none; border-bottom: 1px solid var(--border-soft); cursor: pointer;
}
.al-live-card:hover .al-live-title { color: var(--accent); }
.al-live-top { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
.al-live-label { font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--fg-3); text-transform: uppercase; }
.al-live-timer { margin-left: auto; font-size: 10.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.al-live-title { font-size: 14px; font-weight: 650; line-height: 1.3; color: var(--fg); }
.al-live-summary { margin-top: 5px; font-size: 11.5px; line-height: 1.45; color: var(--fg-3); }
.al-live-evidence { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.al-live-chip { font-size: 9.5px; color: #475569; background: #fff; border: 1px solid #e2e8f0; border-radius: 999px; padding: 2px 6px; }
.al-live-return { margin-top: 8px; font-size: 10.5px; font-weight: 650; color: var(--accent); }
.btn-rs { width: 100%; height: 36px; border-radius: 8px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: center; transition: background .12s; }
.btn-rs:hover { background: var(--accent-soft); }
.btn-rs:disabled { cursor:default;color:var(--fg-4);border-color:var(--border);background:transparent; }

/* ── Right brief panel — patient context, right of canvas ── */
.brief-r { overflow-y: auto; padding: 16px 16px 20px; }

/* ── Topic signal module ── */
.tsm {
  flex-shrink: 0;
  padding: 12px 32px;
  border-bottom: 1px solid var(--border-soft);
  background: var(--surface);
  display: grid;
  gap: 10px 28px;
}
.tsm-2col { grid-template-columns: 1fr 1fr; }
.tsm-1col { grid-template-columns: 1fr; }
.tsm-metric { display: flex; align-items: flex-start; gap: 14px; }
.tsm-val { flex-shrink: 0; }
.tsm-key { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-3); margin-bottom: 3px; }
.tsm-number { font-size: 22px; font-weight: 700; letter-spacing: -.025em; line-height: 1; }
.tsm-number.ok { color: var(--ok); }
.tsm-number.warn { color: var(--danger); }
.tsm-unit { font-size: 12px; color: var(--fg-3); font-weight: 500; margin-top: 3px; }
.tsm-trend-arrow { font-weight: 600; font-size: 12px; }
.tsm-trend-arrow.ok { color: var(--ok); }
.tsm-trend-arrow.warn { color: var(--danger); }
.tsm-chart { flex: 1; min-width: 80px; display: flex; align-items: flex-end; }
.tsm-footer { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tsm-interp { font-size: 13px; color: var(--fg-2); line-height: 1.5; }
.tsm-range { font-size: 11.5px; color: var(--fg-4); white-space: nowrap; flex-shrink: 0; }
.tsm-gap-label { font-size: 11px; font-weight: 600; color: var(--fg-3); margin-bottom: 4px; }
.tsm-gap-status { font-size: 13.5px; font-weight: 600; color: var(--fg); margin-bottom: 2px; }
.tsm-gap-note { font-size: 13px; color: var(--fg-3); }
.tsm-timeline { display: flex; align-items: center; gap: 0; margin-top: 6px; }
.tsm-tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-4); flex-shrink: 0; }
.tsm-tl-dot.due { background: var(--warn); }
.tsm-tl-line { flex: 1; height: 1.5px; background: var(--border); }
.tsm-tl-label { font-size: 11.5px; color: var(--fg-3); margin-left: 6px; white-space: nowrap; }

/* ── Buttons ── */
.btn-p {
  display: inline-flex; align-items: center; gap: 7px;
  height: 36px; padding: 0 18px; border-radius: 9px; border: none;
  background: var(--btn-bg); color: #fff;
  font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(37,99,235,.18);
  transition: background .15s, box-shadow .15s;
}
.btn-p:hover { background: var(--btn-bg-h); box-shadow: 0 4px 14px rgba(37,99,235,.24); }
.btn-s {
  display: inline-flex; align-items: center; gap: 5px;
  height: 34px; padding: 0 13px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--fg-2); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.btn-s:hover { background: var(--accent-soft); color: var(--accent); border-color: rgba(37,99,235,.2); }

/* ── Scribed tag — marks scribe-pre-populated selections ── */
.scribed-tag {
  display: inline-flex; align-items: center;
  font-size: 9.5px; font-weight: 700; color: var(--accent);
  background: var(--accent-soft); border-radius: 999px;
  padding: 1px 7px; margin-left: 7px; letter-spacing: .02em;
  vertical-align: middle; white-space: nowrap;
}

/* ── Confirmation pill — replaces CTA footer on resolved assessments ── */
.task-confirm-pill {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 42px; border-radius: 10px;
  background: var(--ok-bg); color: var(--ok);
  font-size: 13.5px; font-weight: 700;
}
.task-confirm-pill svg { flex-shrink: 0; }

/* ── Canvas fade-in — fires on every innerHTML swap ── */
@keyframes fadeUp {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.canvas-fade { animation: fadeUp 0.12s ease-out both; }
.canvas-fade:has(.task-shell) { height: 100%; padding: 0 !important; }
body:not([data-preview="mobile"]) #canvas > .canvas-fade:has(.task-shell) { padding: 0 !important; }
.canvas-fade:has(.task-shell) .task-shell { border-radius: 0; clip-path: none; }
.canvas-fade:has(.task-shell) .task-shell > .elders-sheet-footer { border-radius: 0; }
.canvas-fade:has(.task-shell) .elders-fullscreen-header.elders-sheethead { padding: 18px 20px 16px 20px; }
/* JS-class fallback — applied directly by renderCanvas() when a task-shell is active */
.canvas-task-open { height: 100%; padding: 0 !important; }
body:not([data-preview="mobile"]) #canvas > .canvas-task-open { padding: 0 !important; }
.canvas-task-open .task-shell { border-radius: 0 !important; clip-path: none !important; }
.canvas-task-open .task-shell > .elders-sheet-footer { border-radius: 0 !important; }

.canvas-task-open .elders-sheethead-titlelink { white-space: normal; overflow: visible; text-overflow: unset; }
/* Assessment footer kebab popup */
.assessment-kebab-menu {
  position: absolute; bottom: calc(100% + 6px); left: 16px;
  background: #fff; border: 1px solid #E5E7EB; border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 200px; z-index: 200;
  overflow: hidden;
}
.assessment-kebab-menu button {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 10px 16px; font-size: 13px; color: #374151; cursor: pointer;
  font-family: inherit; line-height: 1.4;
}
.assessment-kebab-menu button:hover { background: #F9FAFB; }
.assessment-kebab-menu button.destructive { color: #DC2626; }
.assessment-kebab-menu .kebab-divider { height: 1px; background: #F3F4F6; margin: 2px 0; }
.elders-sheet-footer { position: relative; }
.canvas-fade:has(.reconfirm-shell) { height: 100%; padding: 0 !important; }
body:not([data-preview="mobile"]) #canvas > .canvas-fade:has(.reconfirm-shell) { padding: 0 !important; }
.canvas-col:has(.reconfirm-shell) { border-left: 1px solid #ECEEF1; }
.recording-active .canvas-fade,
.recording-active .ap-dot.live,
.recording-active .rec-dot { animation: none; }
@keyframes intentionalUpdate {
  from { opacity: .78; transform: translateY(2px); }
  to { opacity: 1; transform: translateY(0); }
}
.recording-active #canvas .rec-update { animation: intentionalUpdate .28s ease-out both; }

.btn-danger {
  height: 34px; padding: 0 13px; border-radius: 8px;
  border: 1px solid rgba(217,9,28,.25); background: transparent;
  color: var(--danger); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.btn-danger:hover { background: var(--danger-soft); }
.btn-ghost { border: none; background: none; color: var(--fg-3); font-size: 12px; font-weight: 600; cursor: pointer; padding: 0 4px; font-family: inherit; }
.btn-ghost:hover { color: var(--fg); }

/* ── Scroll-spy nav (replaces agenda list in scroll-doc mode) ── */
.spy-head {
  flex-shrink: 0; padding: 16px 14px 14px;
  font-size: 14px; font-weight: 650; color: var(--fg);
  letter-spacing: -.01em; line-height: 1.2;
  border-bottom: 1px solid var(--border-soft);
}
.spy-nav { flex: 1; overflow-y: auto; padding: 4px 0 6px; min-height: 0; }
.spy-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 7px 12px 7px 14px; width: 100%;
  border: none; border-left: 2.5px solid transparent; background: transparent;
  text-align: left; cursor: pointer; font-family: inherit;
  color: var(--fg-3); transition: color .1s, background .1s, border-color .1s;
}
.spy-item:hover { color: var(--fg); background: rgba(37,99,235,.04); }
.spy-item.spy-active {
  color: var(--accent); background: var(--accent-soft);
  border-left-color: var(--accent);
}
.spy-label { flex: 1; min-width: 0; }
.spy-label-name { display: block; font-size: 12.5px; font-weight: 500; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spy-item.spy-active .spy-label-name { font-weight: 650; }
.spy-label-sub { display: block; font-size: 10.5px; color: var(--fg-4); margin-top: 1px; }
.spy-item.spy-active .spy-label-sub { color: rgba(37,99,235,.6); }
.spy-item.spy-done .spy-label-name { color: var(--fg-3); }

/* ── Scroll-document section wrappers ── */
.doc-section { border-top: 10px solid var(--border-soft); }
.doc-section:first-child { border-top: none; }
/* Next-section navigation button */
.doc-next-row { padding: 0 28px 36px; display: flex; justify-content: flex-end; }
.doc-next-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: transparent;
  padding: 8px 14px; border-radius: 20px;
  font-size: 13px; color: var(--fg-3);
  cursor: pointer; transition: background 130ms, color 130ms;
}
.doc-next-btn:hover { background: var(--surface-2); color: var(--fg); }
.doc-sec-head {
  padding: 22px 28px 14px;
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.doc-sec-step {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 650; color: var(--fg-3); line-height: 1;
}
.doc-sec-step.done { border-color: #A8ABE0; color: #A8ABE0; }
.doc-sec-step.assessment-state { border:0;color:inherit; }
.doc-sec-titles { flex: 1; min-width: 0; }
.doc-sec-title {
  font-size: 17px; font-weight: 650; color: var(--fg);
  letter-spacing: -.02em; flex-shrink: 0;
}
.doc-sec-sub { font-size: 12px; color: var(--fg-3); margin-top: 1px; }
.doc-sec-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; color: var(--ok);
  background: var(--ok-bg); border-radius: 999px; padding: 2px 9px; flex-shrink: 0;
}
/* Task-wrap flows naturally in doc (not flex-grow) */
.doc-sec-body .task-wrap { display: block; }
.doc-sec-body .task-2col { padding-bottom: 22px; overflow: visible; }
/* Task actions inline per section, not pinned to bottom */
.doc-sec-body .task-actions {
  position: static; border-top: 1px solid var(--border-soft);
  padding: 12px 28px; margin: 0;
}

/* ── Assessment task layout ── */
.task-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.task-header { padding: 18px 32px 14px; border-bottom: 1px solid var(--border-soft); flex-shrink: 0; }
.task-pattern { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--fg-3); margin-bottom: 3px; }
.task-title { font-size: 20px; font-weight: 600; color: var(--fg); letter-spacing: -.02em; line-height: 1.2; }
.task-sub { font-size: 13px; color: var(--fg-3); margin-top: 3px; }
/* ── Elders sheethead — matches showcase assessment header ── */
.elders-fullscreen-header { display: flex; align-items: center; gap: 10px; padding: 14px 20px 12px 32px; flex-shrink: 0; border-bottom: 1px solid var(--border-soft); }
.elders-fullscreen-header.elders-sheethead { align-items: flex-start; padding: 14px 20px 12px 32px; }
.elders-sheethead .elders-sheethead-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.elders-sheethead-eyebrow { font-size: 10px; font-weight: 600; color: #AAAAAA; text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.3; }
.elders-sheethead-title { font-size: 16px; font-weight: 700; color: #111; line-height: 1.25; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.elders-sheethead-sub { font-size: 11px; color: #9CA3AF; line-height: 1.4; margin-top: 1px; }
.elders-round-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: #f5f5f5; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #6B7280; margin-top: 1px; }
.elders-round-btn:hover { background: #ececec; }
.elders-sheethead-titlelink { font-size:16px;font-weight:700;letter-spacing:-0.3px;color:#444AD3;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left; }
.elders-sheethead-titlelink:hover { opacity:0.7; }
/* ── Encounters canvas — horizontal tab strip ── */
.enc-canvas { display:flex; flex-direction:column; height:100%; }
.enc-tab-bar { display:flex; gap:0; border-bottom:1px solid var(--border-soft); padding:0 24px; flex-shrink:0; background:#fff; }
.enc-tab { background:none; border:none; border-bottom:2px solid transparent; font-size:13px; font-weight:500; color:#6B7280; padding:11px 16px; margin-bottom:-1px; cursor:pointer; font-family:inherit; transition:color .15s; }
.enc-tab:hover { color:#374151; }
.enc-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
.enc-content { flex:1; overflow-y:auto; overflow-x:hidden; padding:0 0 40px; }
/* Encounter record cards */
.enc-card { padding:16px 24px; border-bottom:1px solid var(--border-soft); }
.enc-card-type { font-size:9.5px; font-weight:700; color:#9CA3AF; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; }
.enc-card-title { font-size:14px; font-weight:700; color:#111; margin-bottom:3px; letter-spacing:-0.2px; }
.enc-card-summary { font-size:12px; color:#6B7280; line-height:1.5; margin-bottom:10px; }
.enc-card-rows { border-top:1px solid #F3F4F6; margin-top:10px; }
.enc-row { display:flex; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px solid #F9FAFB; font-size:12px; }
.enc-row-label { color:#111; flex-shrink:0; }
.enc-row-val { color:#555; text-align:right; flex:1; min-width:0; overflow-wrap:break-word; }
.enc-row-val.abn { color:#444; font-weight:600; }
.enc-section-label { font-size:9px; font-weight:700; color:#AAA; letter-spacing:.5px; text-transform:uppercase; padding:12px 0 6px; }
.enc-disc-med { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px solid #F9FAFB; }
.enc-disc-med-name { font-size:13px; color:#111; flex:1; }
.enc-disc-med-name.held { color:#9CA3AF; text-decoration:line-through; }
.enc-new-badge { font-size:10px; font-weight:700; color:#059669; background:#D1FAE5; border-radius:3px; padding:1px 5px; flex-shrink:0; }
.enc-held-badge { font-size:10px; font-weight:700; color:#DC2626; background:#FEE2E2; border-radius:3px; padding:1px 5px; flex-shrink:0; }

/* Disambiguation bar and ol-mini-rec removed — replaced by nd-badge + agenda strip */
/* Legacy canvas-footer mount retained for markup compatibility. Assessment
   actions now remain owned by their card rather than the workspace column. */
#canvas-footer { flex-shrink: 0; display: none; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--border-soft); background: var(--surface); }
#canvas-footer.visible { display: none; }

/* ── Draft ready — neutral clickable rows (no amber treatment) ── */
.draft-items { display: flex; flex-direction: column; }
.draft-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; cursor: pointer; border-bottom: 1px solid var(--border-soft); transition: background .12s; }
.draft-item:last-child { border-bottom: none; }
.draft-item:hover { background: var(--bg-hover); margin: 0 -8px; padding: 12px 8px; border-radius: 8px; }
.draft-item-ic { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
.draft-item-body { flex: 1; min-width: 0; }
.draft-item-name { font-size: 14px; font-weight: 600; color: var(--fg); }
.draft-item-reason { font-size: 12.5px; color: var(--fg-3); margin-top: 2px; line-height: 1.45; }
.draft-item-link { font-size: 12px; font-weight: 600; color: var(--accent); flex-shrink: 0; margin-top: 3px; white-space: nowrap; }
.draft-footer { font-size: 13px; color: var(--fg-3); margin-top: 14px; line-height: 1.6; }

/* ── Recording canvas (live visit) — compact, like mobile DiscussingCard ── */
/* No background tint — canvas sits directly on the white workbench surface */
/* ── Recording canvas — two-zone layout ── */
/* Zone 1: scribe card (colored bg) — topic title + metrics live here */
.rec-scribe-card {
  background: #eef0fb;
  border-bottom: 1px solid #dde0f0;
  padding-bottom: 8px;
  position: sticky;
  top: 0;
  z-index: 2;
}
.rec-topic-heading {
  padding: 22px 28px 0;
}
.rec-topic-eyebrow {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: #7c82d1; margin-bottom: 5px;
}
.rec-topic-title {
  font-size: 21px; font-weight: 700; letter-spacing: -.025em;
  color: var(--fg); line-height: 1.15; margin-bottom: 3px;
}
.rec-topic-sub {
  font-size: 12.5px; color: var(--fg-3); margin-bottom: 0;
}
.rec-scribe-card .tsm {
  background: transparent; border-bottom: none; padding: 18px 28px 14px;
}
.rec-sig-waiting {
  padding: 22px 28px; font-size: 13px; color: var(--fg-3); font-style: italic;
}

/* ── Canvas-local scribe zone (ws-scribe-zone) styles ── */
.sz-inner { /* background comes from .ws-scribe-zone */ }
.sz-visit-title {
  font-size: 15px; font-weight: 650; color: var(--fg);
  letter-spacing: -.015em; line-height: 1.2;
}
.sz-visit-sub { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
.sz-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  min-height: 78px; padding: 14px 18px 10px; gap: 16px;
}
.sz-header.is-idle,
.sz-header.is-listening { min-height:62px;padding:0 18px;align-items:center; }
.sz-header.is-review { min-height:62px;padding:0 18px;align-items:center; }
.review-zone-copy { min-width:0; }
.review-zone-title { font-size:18px;line-height:1.2;font-weight:720;letter-spacing:-.025em;color:var(--fg); }
.review-zone-sub { margin-top:2px;font-size:11.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.review-zone-status {
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:6px 10px;
  border-radius:999px;background:#f1f3f6;color:#5e6671;font-size:11px;font-weight:700;
}
.review-zone-status.ready { background:#eaf7f0;color:var(--ok); }
.review-zone-status.signed { background:#e6f6ed !important;color:var(--ok) !important; }
.review-zone-action { flex:0 0 auto;max-width:230px;overflow:hidden;text-overflow:ellipsis; }
.sz-listening-title { font-size:15px;font-weight:650;color:var(--fg);letter-spacing:-.015em; }
.sz-listening-hint { margin-top:2px;font-size:11.5px;color:var(--fg-3); }
.sz-controls {
  display: flex; align-items: center; gap: 7px; flex-shrink: 0; padding-top: 2px;
}
.sz-header.is-listening .sz-controls { padding-top:0; }
.sz-waiting-body {
  height:150px;display:flex;align-items:center;justify-content:center;gap:10px;
  color:var(--fg-3);font-size:12.5px;background:#fafbfc;
}
.sz-waiting-mark {
  width:28px;height:28px;border-radius:10px;background:#f0f4fb;color:var(--accent);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(37,99,235,.09);
}
.sz-control-btn {
  height:32px;padding:0 11px;border:1px solid var(--border);border-radius:9px;
  background:#fff;color:var(--fg-2);font:600 12px Inter,sans-serif;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.sz-control-btn:hover { color:var(--accent);border-color:#cfd0ea;background:#f8f8fd; }
.sz-control-btn.stop:hover { color:var(--danger);border-color:rgba(220,38,38,.24);background:var(--danger-soft); }
.sz-control-btn.pause,
.sz-control-btn.resume,
.sz-control-btn.end { border:0;border-radius:50%;padding:0;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:transparent; }
.sz-control-btn.pause { color:var(--fg-2); }
.sz-control-btn.resume { color:var(--fg-2); }
.sz-control-btn.end { color:var(--danger); }
.sz-control-btn.pause:hover { border:0;background:#f0f0f0;color:var(--fg); }
.sz-control-btn.resume:hover { border:0;background:#f0f0f0;color:var(--fg); }
.sz-control-btn.end:hover { border:0;background:var(--danger-soft);color:#b91c1c; }
.sz-timer {
  font-size: 12.5px; font-weight: 600; color: var(--fg-3);
  font-variant-numeric: tabular-nums; min-width: 32px;
}
.sz-inner .rec-topic-eyebrow { margin-bottom: 5px; }
.sz-inner .rec-topic-title { font-size: 22px; }
.scribe-state-kicker { display:flex;align-items:center;gap:6px; }
.scribe-state-dot { width:6px;height:6px;border-radius:50%;background:var(--danger);animation:scribeHeartbeat 2.8s ease-in-out infinite; }
.scribe-state-kicker.paused { color:var(--fg-3); }
.scribe-state-kicker.paused .scribe-state-dot { background:var(--fg-3);animation:none; }
.sz-inner .tsm {
  background: transparent; border-bottom: none; padding: 18px 28px 14px;
}
@keyframes scribeContentSettle {
  from { opacity:0; transform:translateY(3px); }
  to { opacity:1; transform:translateY(0); }
}
.visit-workspace.scribe-content-entering .sz-header > :first-child {
  animation:scribeContentSettle 300ms 90ms ease-out both;
}
.visit-workspace.scribe-content-entering .sz-data-row {
  animation:scribeContentSettle 340ms 150ms ease-out both;
}
/* Zone 2: captured feed (white bg) */
.rec-captured-card {
  background: #fff; padding: 18px 28px 24px;
}
.rec-ts-head {
  margin-bottom: 10px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em; color: var(--fg-4);
}
.rec-ts-row {
  display: flex; align-items: baseline; gap: 18px;
  padding: 6px 0; border-bottom: 1px solid var(--border-soft);
}
.rec-ts-row:last-child { border-bottom: none; }
.rec-ts {
  flex-shrink: 0; min-width: 32px;
  font-size: 11px; color: var(--fg-4);
  font-variant-numeric: tabular-nums; letter-spacing: 0;
}
.rec-ts-note { font-size: 13.5px; color: var(--fg); line-height: 1.4; }
.rec-ts-empty { font-size: 13px; color: var(--fg-3); padding: 4px 0; }
.rec-canvas { padding: 22px 28px 16px; background: transparent; }
.rec-summary { font-size: 15px; font-weight: 400; color: var(--fg-2); line-height: 1.6; margin-bottom: 14px; max-width: 62ch; }
.rec-records { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.rec-records-lbl { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-4); flex-shrink: 0; }
.rec-chip { font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.rec-bullets { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
.rec-bullet { font-size: 13px; color: var(--fg-3); display: flex; align-items: baseline; gap: 7px; }
.rec-bullet::before { content: '·'; color: var(--fg-4); flex-shrink: 0; }
.rec-update { max-width: 760px; }
.rec-update-label { margin-bottom: 9px; font-size: 10px; font-weight: 700; color: var(--fg-4); text-transform: uppercase; letter-spacing: .05em; }
.rec-update-list { display: flex; flex-direction: column; gap: 7px; }
.rec-update-item { display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; line-height: 1.5; color: var(--fg-2); }
.rec-update-item::before { content:"✓"; color: var(--ok); font-weight: 700; }
.rec-update-empty { font-size: 13.5px; color: var(--fg-3); }
.rec-update-foot { margin-top: 14px; font-size: 10.5px; color: var(--fg-4); }
.rec-divider { height: 1px; background: var(--border-soft); margin: 14px 0; }
.rec-coverage { font-size: 12.5px; color: var(--fg-3); line-height: 1.55; }
.rec-coverage-topics { font-weight: 500; color: var(--fg-2); }

.brief-start-card { background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; cursor: pointer; }
.brief-start-card:hover { background: var(--accent-mid); }
.bsc-eyebrow { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 4px; }
.bsc-name { font-size: 15px; font-weight: 600; color: var(--fg); margin-bottom: 3px; }
.bsc-why { font-size: 12.5px; color: var(--fg-2); line-height: 1.5; }
.brief-flag { display: flex; align-items: flex-start; gap: 9px; background: var(--warn-bg); border-radius: 10px; padding: 12px 14px; }
.bf-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex-shrink: 0; margin-top: 5px; }
.bf-label { font-size: 11px; font-weight: 700; color: var(--warn); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
.bf-text { font-size: 13.5px; color: var(--warn); line-height: 1.5; }
.ready-sec { font-size: 12.5px; font-weight: 600; color: var(--fg-2); margin-bottom: 12px; }
.brief-event { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border-soft); }
.brief-event:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.be-meta { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 5px; }
.be-badge { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; flex-shrink: 0; letter-spacing: .03em; }
.be-badge.hosp { background: var(--danger-soft); color: var(--danger); }
.be-badge.enc { background: var(--accent-soft); color: var(--accent); }
.be-badge.rx { background: var(--ok-bg); color: var(--ok); }
.be-badge.gap { background: var(--warn-bg); color: var(--warn); }
.be-kind { font-size: 11px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: .04em; }
.be-date { font-size: 11px; color: var(--fg-3); margin-top: 1px; }
.be-heading { font-size: 14px; font-weight: 600; color: var(--fg); margin-bottom: 4px; padding-left: 32px; }
.be-body { font-size: 13.5px; color: var(--fg-2); line-height: 1.6; padding-left: 32px; }
.brief-meds { display: flex; flex-direction: column; gap: 6px; }
.bm-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.bm-item:not(:last-child) { border-bottom: 1px solid var(--border-soft); }
.bm-name { font-size: 13.5px; font-weight: 500; color: var(--fg); flex: 1; }
.bm-tag { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.bm-tag.new { color: var(--accent); background: var(--accent-soft); }
.bm-tag.cont { color: var(--fg-3); background: var(--surface-2); }
.brief-gaps { display: flex; flex-direction: column; gap: 0; }
.bg-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.bg-item:not(:last-child) { border-bottom: 1px solid var(--border-soft); }
.bg-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
.bg-name { font-size: 13.5px; font-weight: 600; color: var(--fg); flex: 1; }
.bg-note { font-size: 12px; color: var(--fg-3); }
/* Recording — not-discussed callout */
.not-discussed-note { font-size: 13px; color: var(--fg-3); font-style: italic; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

/* ── Sign workspace ── */
.sign-note-status { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
.sign-note-status.draft { color: var(--fg-3); background: var(--surface-2); }
.sign-note-status.needs-update { color: var(--warn); background: var(--warn-bg); }
.sign-note-status.ready { color: var(--ok); background: var(--ok-bg); }
.sign-note-status.signed { color: var(--ok); background: var(--ok-bg); }
.sign-err { background: var(--danger-soft); border: 1px solid rgba(217,9,28,.2); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; }
.sign-err-title { font-size: 14px; font-weight: 700; color: var(--danger); margin-bottom: 6px; }
.sign-err-body { font-size: 13.5px; color: var(--danger); line-height: 1.6; }
.sign-err-list { margin: 6px 0 0 4px; display: flex; flex-direction: column; gap: 4px; }
.sign-section { margin-bottom: 20px; }
.sign-sec-label { font-size: 12px; font-weight: 600; color: var(--fg-3); margin-bottom: 8px; }
.sign-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; }
.sign-row:not(:last-child) { border-bottom: 1px solid rgba(0,0,0,.04); }
.sign-row.blocker { background: rgba(217,9,28,.05); margin: 0 -8px; padding: 10px 8px; border-radius: 8px; }
.sign-row-ic { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; }
.sign-row-ic.ok { background: var(--ok); }
.sign-row-ic.warn { border: 1.5px solid var(--warn); }
.sign-row-ic.danger { border: 1.5px solid var(--danger); }
.sign-row-body { flex: 1; min-width: 0; }
.sign-row-name { font-size: 13.5px; font-weight: 600; color: var(--fg); }
.sign-row.blocker .sign-row-name { color: var(--danger); }
.sign-row-detail { font-size: 12px; color: var(--fg-3); margin-top: 2px; line-height: 1.4; }
.sign-row.blocker .sign-row-detail { color: rgba(217,9,28,.75); }
.sign-icd { font-size: 11px; font-weight: 600; color: var(--fg-3); background: var(--surface-2); padding: 2px 7px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
.sign-note-card { background: var(--surface-2); border-radius: 10px; padding: 14px 16px; }
.sign-note-card-title { font-size: 11.5px; color: var(--fg-3); margin-bottom: 6px; }
.sign-note-desc { font-size: 13.5px; color: var(--fg-2); line-height: 1.6; }
.sign-success { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--ok-bg); border-radius: 10px; margin-bottom: 16px; }
.sign-success-title { font-size: 14px; font-weight: 700; color: var(--ok); }
.sign-success-sub { font-size: 12px; color: var(--ok); margin-top: 2px; }

.task-2col { display: grid; grid-template-columns: 1fr 1fr; flex: 1; min-height: 0; overflow: hidden; }
.task-ev { padding: 20px 20px 20px 32px; border-right: 1px solid var(--border-soft); overflow-y: auto; }
.task-det { padding: 20px 32px 20px 20px; overflow-y: auto; }
.task-sec-label { font-size: 12px; font-weight: 600; color: var(--fg-3); margin: 16px 0 8px; }
.task-sec-label:first-child { margin-top: 0; }

.ev-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 5px 0; }
.ev-row:not(:last-child) { border-bottom: 1px solid rgba(0,0,0,.04); }
.ev-label { font-size: 13.5px; color: var(--fg-3); }
.ev-val { font-size: 13.5px; font-weight: 600; color: var(--fg); text-align: right; }
.ev-val.flag { color: var(--danger); }
.ev-val.ok { color: var(--ok); }
/* Evidence section — showcase elders-* classes */
.elders-evidence-section { display:flex; flex-direction:column; gap:12px; }
.elders-evidence-label { display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#9CA3AF; margin-bottom:2px; }
.elders-lab-ev { display:flex; flex-direction:column; gap:0; }
.elders-lab-ev-header { display:flex; align-items:baseline; gap:4px; flex-wrap:wrap; }
.elders-lab-name { font-size:14px; font-weight:400; color:var(--fg); line-height:20px; }
.elders-lab-units { font-size:12px; color:#9CA3AF; line-height:16px; }
.elders-lab-row { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.elders-lab-value { font-size:14px; font-weight:400; color:#444AD3; line-height:20px; }
.elders-lab-flag { font-size:12px; font-weight:700; color:var(--danger); line-height:16px; }
.elders-lab-date { font-size:12px; color:var(--fg-3); line-height:16px; }
.elders-med-ev { display:flex; flex-direction:column; gap:0; }
.elders-med-name { font-size:14px; font-weight:400; color:var(--fg); line-height:20px; }
.elders-med-doc { font-size:12px; font-weight:400; color:var(--fg-3); line-height:16px; }
.elders-cond-ev { display:flex; flex-direction:column; gap:0; }
.elders-cond-name { font-size:14px; font-weight:400; color:var(--fg); line-height:20px; }
.elders-cond-meta, .elders-cond-date { font-size:12px; font-weight:400; color:var(--fg-3); line-height:16px; }
/* Checkbox + button design system from showcase */
:root {
  --elders-btn-primary-bg: #3F45C4;
  --elders-btn-primary-hover: #3238B0;
  --elders-checkbox-selected-bg: #F0F0FD;
  --elders-checkbox-selected-border: #444AD3;
}
.elders-assessment-section { display:flex; flex-direction:column; gap:8px; }
.elders-checkbox-contained {
  width:100%; text-align:left; background:#fff; border:1.5px solid #E5E7EB; border-radius:10px;
  padding:10px 12px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:4px;
  transition:border-color .12s, background .12s;
}
.elders-checkbox-contained:hover { border-color:#C4C6F4; background:#F8F8FE; }
.elders-checkbox-selected { background:var(--elders-checkbox-selected-bg); border-color:var(--elders-checkbox-selected-border); }
.elders-checkbox-row { display:flex; align-items:center; gap:10px; }
.elders-checkbox-row-top { align-items:flex-start; }
.elders-checkbox-box {
  flex-shrink:0; width:18px; height:18px; border-radius:5px; border:1.5px solid #D1D5DB;
  background:#fff; display:flex; align-items:center; justify-content:center;
}
.elders-checkbox-box.ticked { background:#444AD3; border-color:#444AD3; }
.elders-checkbox-text { font-size:14px; font-weight:400; color:#111827; line-height:20px; flex:1; }
.elders-checkbox-tag-label {
  flex-shrink:0; font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px;
  background:#EEF2FF; color:#444AD3; white-space:nowrap;
}
.elders-checkbox-context-text { font-size:13px; color:#6B7280; line-height:18px; padding-left:28px; }
.elders-checkbox-children { display:flex; flex-direction:column; gap:6px; padding-left:20px; }
.elders-sheet-footer {
  flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 24px; border-top:1px solid #E5E7EB; background:#fff;
}
.elders-footer-end { justify-content:flex-end; }
.elders-footer-context { margin-right:auto; font-size:11.5px; color:var(--fg-3); display:flex; flex-direction:column; gap:1px; }
.elders-footer-context strong { font-size:11.5px; color:var(--fg-2); }
.elders-footer-context span { font-size:9.5px; color:var(--fg-4); }
.elders-btn-primary {
  padding:9px 20px; border:none; border-radius:10px; background:var(--elders-btn-primary-bg); color:#fff;
  font-size:14px; font-weight:600; cursor:pointer; transition:background .12s; font-family:inherit; white-space:nowrap;
}
.elders-btn-primary:hover { background:var(--elders-btn-primary-hover); }
.assessment-back-btn {
  padding:9px 20px; border:none; border-radius:10px; background:transparent; color:#444AD3;
  font-size:14px; font-weight:600; cursor:pointer; transition:background .12s; font-family:inherit; white-space:nowrap;
}
.assessment-back-btn:hover { background:#eef0fd; }
.elders-btn-secondary {
  padding:9px 20px; border:1.5px solid #D1D5DB; border-radius:10px; background:#fff; color:#374151;
  font-size:14px; font-weight:600; cursor:pointer; transition:background .12s, border-color .12s; font-family:inherit; white-space:nowrap;
}
.elders-btn-secondary:hover { border-color:#9CA3AF; background:#F9FAFB; }
.elders-btn-secondary.warn { color:var(--danger); border-color:rgba(220,38,38,.3); }
.elders-btn-secondary.warn:hover { border-color:var(--danger); background:#FEF2F2; }
.ev-conv-note {
  margin-top:8px;padding:2px 0 2px 12px;
  border-left:2px solid #d5d9df;border-radius:0;background:transparent;
  color:var(--fg-3);font-size:13px;font-style:normal;line-height:1.55;
}
.ev-cap-item { display: flex; align-items: flex-start; gap: 7px; padding: 4px 0; font-size: 13.5px; color: var(--fg-2); }

.radio-group { display: flex; flex-direction: column; gap: 6px; }
.radio-opt { display: flex; align-items: flex-start; gap: 9px; padding: 9px 11px; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--border); transition: border-color .12s, background .12s; }
.radio-opt:hover { border-color: rgba(37,99,235,.3); background: var(--accent-soft); }
.radio-opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.radio-opt input { accent-color: var(--accent); flex-shrink: 0; margin-top: 2px; cursor: pointer; }
.ro-label { font-size: 13.5px; font-weight: 400; color: var(--fg); line-height: 1.3; }
.ro-sub { font-size: 12px; color: var(--fg-3); margin-top: 2px; }

.check-group { display: flex; flex-direction: column; gap: 4px; }
.check-opt { display: flex; align-items: flex-start; gap: 9px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.check-opt:hover { background: var(--surface-2); }
.check-opt input { accent-color: var(--accent); flex-shrink: 0; margin-top: 3px; cursor: pointer; }
.co-label { font-size: 13.5px; color: var(--fg-2); line-height: 1.4; }

.task-actions { flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 32px; border-top: 1px solid var(--border-soft); background: var(--surface); }
.task-shell { height: 100%; min-height: 0; display: flex; flex-direction: column; }
.task-shell > .task-wrap { flex: 1; min-height: 0; }
.task-actions-context { margin-right: auto; font-size: 11.5px; color: var(--fg-3); }
.task-confirmed-note { font-size: 12px; font-weight: 600; color: var(--ok); padding: 7px 10px; background: var(--ok-bg); border-radius: 8px; }
.task-single-col { flex: 1; padding: 24px 32px; overflow-y: auto; }
.ambient-alert {
  margin: 12px 24px 0; padding: 11px 13px; border-radius: 10px;
  border: 1px solid rgba(37,99,235,.18); background: var(--accent-soft);
  display: flex; align-items: flex-start; gap: 10px;
}
.ambient-alert-dot { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(37,99,235,.1); }
.ambient-alert-title { font-size: 12.5px; font-weight: 650; color: var(--fg); }
.ambient-alert-sub { margin-top: 2px; font-size: 11.5px; color: var(--fg-3); }
.scenario-banner { font-size: 10.5px; font-weight: 650; color: var(--accent); margin-bottom: 5px; }

/* At a 50/50 canvas/record split, keep assessment work readable. */
@container (max-width: 620px) {
  .task-2col { grid-template-columns: 1fr; overflow-y: auto; }
  .task-ev {
    border-right: none; border-bottom: 1px solid var(--border-soft);
    overflow: visible; padding: 20px 24px;
  }
  .task-det { overflow: visible; padding: 20px 24px; }
  .task-actions { padding-left: 24px; padding-right: 24px; }
  .tsm { padding-left: 24px; padding-right: 24px; }
}

@media (max-width: 1399px) {
  /* Record panel stays in flex flow (push, not overlay) — workspace shrinks to make room.
     Narrower sheet at this breakpoint so canvas stays readable. */
  .outer { --record-sheet-width: 360px; }
  .outer.record-open .ctx-resizer { display: none; }
  .outer.record-open { gap: 8px; }
}

@media (max-width: 1050px) {
  .nav-slice { width: 286px; }
  .scribe-local { width: min(390px, 48%); }
