function renderLabDetail(id) {
  const detail = LAB_DETAILS[id];
  if (!detail) return `<div style="padding:20px 16px;color:#6B7280;">Lab detail not found.</div>`;
  const flaskIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#444AD3" stroke-width="1.8"><path d="M9 3h6M6 9l-3 9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2l-3-9M8 9h8"/></svg>`;
  const docIcon = `<svg width="13" height="14" viewBox="0 0 24 24" fill="#444AD3"><path d="M6 2c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8.83L14.83 2H6zm7 7V3.5L18.5 9H13z"/></svg>`;
  const expandedId = `labDetailExpanded_${id}`;

  const rows = detail.rows.map(r => {
    const flagSpan = r.flag ? `<span style="color:#E00D1A;font-size:10px;font-weight:700;margin-left:1px;">${r.flag}</span>` : '';
    const resultColor = r.normal ? '#2B2933' : '#E00D1A';
    const chevronDown = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>`;
    const chevronUp = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>`;
    const hasTrend = !!r.trend;
    const isExpanded = (window[expandedId] || '') === r.test;

    let expandedContent = '';
    if (hasTrend && isExpanded) {
      const pts = r.trend.points;
      const W = 296, H = 52;
      const xs = pts.map(p => Math.round(p.x/100*(W-4))+2);
      const ys = pts.map(p => Math.round(H - p.y/100*(H-4))-2);
      const pathD = pts.map((p,i) => `${i===0?'M':'L'}${xs[i]},${ys[i]}`).join(' ');
      const hollowDots = pts.slice(0,-1).map((p,i) => `<circle cx="${xs[i]}" cy="${ys[i]}" r="2" fill="#FFFFFF" stroke="#A05A00" stroke-width="1.5"/>`).join('');
      const lastX = xs[xs.length-1], lastY = ys[ys.length-1];
      const labels = r.trend.xLabels || ["Jul '21","May '22","Mar '23","Jan '24","Nov '24","Jun '26"];
      expandedContent = `<div style="padding:12px 14px 14px;background:#FAFAFA;border-top:1px solid #D6D6E1;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2px;">
          <div>
            <div style="display:flex;align-items:baseline;gap:5px;">
              <span style="font-size:20px;font-weight:800;color:#A05A00;letter-spacing:-.45px;">${r.result}</span>
              <span style="font-size:11px;color:#726D83;">${r.unit}</span>
            </div>
            <div style="font-size:10px;font-weight:700;color:#726D83;letter-spacing:.6px;text-transform:uppercase;margin-top:2px;">${r.trend.label}</div>
          </div>
          <div style="font-size:11px;font-weight:600;color:#A05A00;text-align:right;">${r.trend.delta}</div>
        </div>
        <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="width:100%;display:block;overflow:visible;margin-top:10px;">
          <path d="${pathD}" fill="none" stroke="#A05A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          ${hollowDots}
          <circle cx="${lastX}" cy="${lastY}" r="3.5" fill="#A05A00" stroke="#A05A00" stroke-width="1.5"/>
        </svg>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:#726D83;letter-spacing:.17px;margin-top:4px;">
          ${labels.map(l=>`<span>${l}</span>`).join('')}
        </div>
        <div style="font-size:10px;color:#726D83;letter-spacing:.12px;margin-top:6px;">Reference: ${r.ref} ${r.unit}</div>
        <div style="text-align:right;margin-top:6px;">
          <button style="font-size:13px;font-weight:600;color:#3F45C4;background:none;border:none;cursor:pointer;font-family:inherit;">See all details →</button>
        </div>
      </div>`;
    }

    const rowClick = hasTrend ? `onclick="var k='${expandedId}';window[k]=(window[k]==='${r.test}'?'':'{r.test}');renderCtxSheet();"` : '';
    const rowClick2 = hasTrend ? `onclick="var k='${expandedId}';window[k]=(window[k]==='${r.test}'?'':'${r.test}');renderCtxSheet();"` : '';

    return `<div style="border-bottom:1px solid #EAEBEF;">
      <div class="pd-lab-detail-row" ${rowClick2}>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:600;color:#1F2937;">${escapeHTML(r.test)}</div>
          <div style="font-size:11px;color:#6B7280;">${r.unit}</div>
        </div>
        <div style="font-size:14px;font-weight:500;color:${resultColor};margin-right:4px;">${r.result}${flagSpan}</div>
        <div style="font-size:13px;color:#6B7280;margin-right:8px;min-width:70px;text-align:right;">${r.ref}</div>
        ${hasTrend ? (isExpanded ? chevronUp : chevronDown) : `<div style="width:14px;"></div>`}
      </div>
      ${expandedContent}
    </div>`;
  }).join('');

  return `<div style="display:flex;flex-direction:column;flex:1;min-height:0;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid #EAEBEF;flex-shrink:0;">
      <button onclick="closeLabDetail()" style="display:flex;align-items:center;gap:3px;border:none;background:none;cursor:pointer;padding:0;font-family:inherit;font-size:13px;font-weight:500;color:var(--accent);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="m15 18-6-6 6-6"/></svg>
        All labs
      </button>
      <button class="elders-round-btn" onclick="requestCloseRecord()" aria-label="Close" title="Close" style="margin:0;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div style="padding:12px 16px 10px;border-bottom:1px solid #EAEBEF;flex-shrink:0;">
      <div class="elders-sheethead-titles">
        <span class="elders-sheethead-eyebrow">Lab and test result</span>
        <span class="elders-sheethead-title">${escapeHTML(detail.name)}</span>
        <span class="elders-sheethead-sub">${escapeHTML(detail.date)} · ${escapeHTML(detail.provider)} · ${escapeHTML(detail.specialty)}</span>
        <div style="display:flex;align-items:center;gap:4px;margin-top:5px;">
          <span style="font-size:13px;font-weight:600;color:#444AD3;cursor:pointer;">View</span>
          ${docIcon}
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:#FAFAFA;border-bottom:1px solid #EAEBEF;flex-shrink:0;">
      <span style="flex:1;font-size:12px;color:#6B7280;">Test</span>
      <span style="font-size:12px;color:#6B7280;min-width:50px;">Result</span>
      <span style="font-size:12px;color:#6B7280;min-width:70px;text-align:right;">Reference</span>
      <div style="width:14px;"></div>
    </div>
    <div style="flex:1;overflow-y:auto;scrollbar-width:none;">${rows}</div>
  </div>`;
}

      return `<div style="flex:1;background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:8px 10px;">

      </div>`;
    }).join('');
    const bullets = c.bullets.map(b => `<div style="display:flex;align-items:flex-start;gap:8px;padding-top:6px;padding-bottom:6px;border-top:1px solid #F3F4F6;">

      <span style="font-size:12.5px;color:#374151;line-height:1.5;">${escapeHTML(b.text)}</span>
    </div>`).join('');
    const timeline = c.timeline.map(t => `<div style="display:flex;gap:10px;padding:5px 0;border-top:1px solid #F3F4F6;font-size:12px;">
      <span style="color:#9CA3AF;font-weight:500;min-width:48px;flex-shrink:0;">${escapeHTML(t.date)}</span>
      <span style="color:#374151;line-height:1.4;">${escapeHTML(t.event)}</span>

      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;">
        <div>
          <div style="font-size:16px;font-weight:700;color:#111;letter-spacing:-.2px;">${escapeHTML(c.name)}</div>
          <div style="font-size:11.5px;color:#9CA3AF;margin-top:2px;">${escapeHTML(c.icd)} · Since ${escapeHTML(c.since)} · ${escapeHTML(c.doctor)} · ${escapeHTML(c.specialty)}</div>

}

function renderCtxSheet() {
  const headEl = document.getElementById('ctxHead');
  const bodyEl = document.getElementById('ctxBody');
  const sheetEl = document.getElementById('ctxSheet');
  const resizerEl = document.getElementById('ctxResizer');
  const outerEl = document.querySelector('.outer');
  const triggerEl = document.getElementById('recordTrigger');
  if (!headEl || !bodyEl) return;
  const alwaysOpen = isAlwaysOpenPanel();
  sheetEl?.classList.toggle('is-closed', !recordOpen);
  sheetEl?.classList.toggle('detent-half', !alwaysOpen && recordSheetDetent === 'half');
  sheetEl?.classList.toggle('detent-full', !alwaysOpen && recordSheetDetent === 'full');
  sheetEl?.setAttribute('aria-hidden', String(!recordOpen));
  resizerEl?.classList.toggle('is-closed', !recordOpen);
  outerEl?.classList.toggle('record-open', recordOpen);
  triggerEl?.classList.toggle('open', recordOpen);
  triggerEl?.setAttribute('aria-expanded', String(recordOpen));
  if (!recordOpen) return;
  const max = getRecordSheetMax();
  const expanded = recordFullWidth;
  const widthButton = `<button class="ctx-icon-btn record-width-toggle" onclick="toggleRecordSheetWidth()"
    aria-label="${expanded?'Collapse to panel':'Expand to full page'}"
    title="${expanded?'Collapse to panel':'Expand to full page'}">
    ${expanded
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6"/></svg>`}
  </button>`;

  if (recordMessages.length) {
    headEl.innerHTML = `<div class="ctx-title-row">
      <button class="ctx-icon-btn ctx-back-btn" onclick="resetRecordChat()" aria-label="Back" title="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="ctx-title" id="ctxSheetTitle">Patient data</div>
      ${widthButton}
      <button class="elders-round-btn" onclick="requestCloseRecord()" aria-label="Close" title="Close" style="margin-top:0;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>`;
    bodyEl.innerHTML = `<div class="ctx-chat">
      <div class="ctx-chat-scroll">
        ${recordMessages.map(message=>`<div class="ctx-chat-turn">
          <div class="ctx-chat-user">${escapeHTML(message.question)}</div>
          <div class="ctx-chat-assistant">
            ${message.answer}
            <div class="ctx-citations">${message.citations.map(([label,id])=>
              `<button class="ctx-citation" onclick="selectAssessment('${id}')">${escapeHTML(label)} →</button>`
            ).join('')}</div>
          </div>
        </div>`).join('')}
      </div>
      <div class="ctx-chat-composer">${recordComposerHTML(true)}</div>
    </div>`;
  } else if (recordFilter) {
    // Filtered record view (clicked condition, hospitalization, etc.)
    headEl.innerHTML = `<div class="ctx-title-row">
      <button class="ctx-icon-btn ctx-back-btn" onclick="resetRecordFilter()" aria-label="Back" title="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="ctx-title" id="ctxSheetTitle">Patient data</div>
      ${widthButton}
      <button class="elders-round-btn" onclick="requestCloseRecord()" aria-label="Close" title="Close" style="margin-top:0;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="ctx-query" style="border-top:1px solid #E5E7EB;">${recordComposerHTML(false)}</div>`;
    bodyEl.innerHTML = `<div class="rp-body">${buildRecordBody(recordQuery)}</div>`;
  } else if (askLabDetailId) {
    headEl.style.display = 'none';
    const isNew = bodyEl.dataset.activeDetail !== `lab-${askLabDetailId}`;
    bodyEl.dataset.activeDetail = `lab-${askLabDetailId}`;
    bodyEl.style.cssText = `flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;${isNew?'animation:labDetailSlideIn 230ms cubic-bezier(0.2,0,0,1) both;':''}`;
    bodyEl.innerHTML = renderLabDetail(askLabDetailId);
    applyRecordSheetWidth(recordSheetWidth);
    initMobileRecordSheetDrag();
    return;
  } else if (askMedDetailId !== null) {
    headEl.style.display = 'none';
    const isNew = bodyEl.dataset.activeDetail !== `med-${askMedDetailId}`;
    bodyEl.dataset.activeDetail = `med-${askMedDetailId}`;
    bodyEl.style.cssText = `flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;${isNew?'animation:labDetailSlideIn 230ms cubic-bezier(0.2,0,0,1) both;':''}`;
    bodyEl.innerHTML = renderMedDetail(askMedDetailId);
    applyRecordSheetWidth(recordSheetWidth);
    initMobileRecordSheetDrag();
    return;
  } else if (askEncounterId) {
    headEl.style.display = 'none';
    const isNew = bodyEl.dataset.activeDetail !== `enc-${askEncounterId}`;
    bodyEl.dataset.activeDetail = `enc-${askEncounterId}`;
    bodyEl.style.cssText = `flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;${isNew?'animation:labDetailSlideIn 230ms cubic-bezier(0.2,0,0,1) both;':''}`;
    bodyEl.innerHTML = renderEncounterDetail(askEncounterId);
    applyRecordSheetWidth(recordSheetWidth);
    initMobileRecordSheetDrag();
    return;
  } else {
    // Patient data panel — Ask / Medications / Labs / Encounters tabs
    headEl.style.display = '';
    bodyEl.style.cssText = '';
    delete bodyEl.dataset.activeDetail;
    const TABS = [{id:'ask',label:'Ask'},{id:'medications',label:'Meds'},{id:'labs',label:'Labs'},{id:'encounters',label:'Encounters'}];
    const tabBar = TABS.map(t => {
      const active = askActiveTab === t.id;
      return `<button onclick="setAskTab('${t.id}')" style="padding:0 0 6px;border:none;background:transparent;font-size:14px;font-weight:${active?700:600};color:${active?'#3F45C4':'#726D83'};border-bottom:1px solid ${active?'#3F45C4':'transparent'};cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:color 0.15s;">${t.label}</button>`;
    }).join('');

    headEl.innerHTML = `<div class="ctx-title-row">
      <div class="ctx-title" id="ctxSheetTitle">Patient data</div>
      ${widthButton}
      <button class="elders-round-btn" onclick="requestCloseRecord()" aria-label="Close" title="Close" style="margin-top:0;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div style="display:flex;gap:20px;padding:14px 16px 0;border-bottom:1px solid #D6D6E1;overflow-x:auto;scrollbar-width:none;">${tabBar}</div>`;

    const tabContent = renderAskTabContent();
    const showComposer = askActiveTab === 'ask';
    bodyEl.innerHTML = showComposer
      ? `<div class="ctx-chat" style="height:100%;display:flex;flex-direction:column;">
           <div style="flex:1;overflow-y:auto;scrollbar-width:none;">${tabContent}</div>
           <div class="ctx-chat-composer" style="border-top:none;padding:12px 14px;">${askComposerHTML()}</div>
         </div>`
      : `<div style="height:100%;overflow-y:auto;scrollbar-width:none;">${tabContent}</div>`;
  }
  applyRecordSheetWidth(recordSheetWidth);
  initMobileRecordSheetDrag();
}

function parseTime12h(t) {
  const m = t.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return 0;
  let h = parseInt(m[1],10), mn = parseInt(m[2],10);
  const pm = m[3].toUpperCase() === 'PM';
  if (pm && h !== 12) h += 12;
  if (!pm && h === 12) h = 0;
  return h * 60 + mn;
}

function startTimer(){
  if(running) return;
  running=true;
  timerStartedAt=Date.now()-(secs*1000);
  timerInt=setInterval(()=>{
    const elapsed = Math.floor((Date.now()-timerStartedAt)/1000);
    if (elapsed === secs) return;
    secs = elapsed;
    const t = fmt(secs);
    ['liveTimer','miniTimer','railTimer','phScribeTimer','mobileScribeTimer','gnavScribeTimer'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=t; });
    updateScenarioFlow();
  },250);
}
function stopTimer(){ running=false; timerStartedAt=null; if(timerInt){clearInterval(timerInt);timerInt=null;} }

function scheduleContentReady(delayMs) {
  if (scribeContentReadyTimer) clearTimeout(scribeContentReadyTimer);
  scribeContentReady = false;
  scribeContentReadyTimer = setTimeout(() => {
    scribeContentReady = true;
    scribeContentReadyTimer = null;
    renderAll();
  }, delayMs);
}

function updateScenarioFlow() {
  if (scribeState !== 'recording' || lifecycleState !== 'recording') return;
  let changed = false;
  // Apply milestones in order. A delayed or throttled interval may cross more
  // than one threshold; the while loop catches up instead of silently losing
  // every subsequent state. Pause still freezes both secs and this sequence.
  const milestones = activeScenario === 'B' ? [
    { at:4, apply:()=>{
      scribeFeedVisible=true; scribeContentDetected=true; scribeContentEntering=true;
      liveTopicId='hfref'; scheduleContentReady(3000);
    }},
    { at:8, apply:()=>{
      decisions.hfref={confirmed:true,autoFill:true,completedTime:'0:08'};
      liveTopicId='ckd'; scheduleContentReady(3000);
    }},
    { at:16, apply:()=>{
      decisions.ckd={confirmed:true,interveningEvidence:true,completedTime:'0:16'};
      liveTopicId='htn'; scheduleContentReady(3000);
    }},
    { at:24, apply:()=>{
      decisions.htn={partial:true,needsReview:true,completedTime:'0:24'};
      liveTopicId='dm'; scheduleContentReady(3000);
    }},
    { at:32, apply:()=>{
      decisions.dm={confirmed:true,partialCapture:true,completedTime:'0:32'};
      liveTopicId='eye'; scheduleContentReady(3000);
    }},
    { at:40, apply:()=>{
      decisions.eye={confirmed:true,autoFill:true,completedTime:'0:40'};
      liveTopicId=null; visitCloseReached=true;
    }},
  ] : [
    { at:4, apply:()=>{
      scribeFeedVisible=true; scribeContentDetected=true; scribeContentEntering=true;
      liveTopicId=scenarioData().start; scheduleContentReady(3000);
    }},
  ];
  while (scribeDemoStage < milestones.length && secs >= milestones[scribeDemoStage].at) {
    milestones[scribeDemoStage].apply();
    scribeDemoStage++;
    changed = true;
  }
  if (changed) renderAll();
}

function setLifecycle(s) {
  finalNoteOpen = false; recordOpen = false; viewingBrief = false;
  briefDetailId = null; briefMasterScrollTop = 0;

  signValidation = false; returnToSignAfterConfirm = false;
  lifecycleState = s; selectedAssessmentId = null; canvasMode = 'live-conversation';
  workspaceMode = 'visit'; renderAll();
}
function setState(s) { setLifecycle(s); }

function setPreset(n) {
  const p = PRESETS[n]; if (!p) return;
  // Every preset is deterministic and maps to a documented point in the guide.
  ambientAfib = false; afibInserted = false; visitCloseReached = false; micMode = 'scribe';
  scribeFeedVisible = false;
  scribeContentDetected = false; scribeContentEntering = false;
  scribeContentReady = false;
  if (scribeContentReadyTimer) { clearTimeout(scribeContentReadyTimer); scribeContentReadyTimer = null; }
  scribeDemoStage = 0;
  finalNoteOpen = false; recordOpen = false; viewingBrief = false;
  briefDetailId = null; briefMasterScrollTop = 0;
  scribeExpanded = true;
  signValidation = false; returnToSignAfterConfirm = false;
  signaturePanelOpen = false; signatureAcknowledged = false; legalExpanded = false;
  // Reset sign state for all presets — no preset should inherit signed status
  signedState = false; noteNeedsUpdate = false;
  reviewNoteCollapsed = false;
  visitNoteDisposition = 'pending';
  patientInstructionsText = DEFAULT_PATIENT_INSTRUCTIONS;
  patientInstructionsPhone = '';
  patientInstructionsSent = false;
  patientInstructionLanguage = 'English';
  Object.keys(decisions).forEach(k => delete decisions[k]);
  if (activeScenario === 'B' && n === 3) {
    decisions.hfref={confirmed:true,autoFill:true,completedTime:'0:08'};
  }
  if (activeScenario === 'B' && n >= 4) seedScenarioBPostScribeState();
  if (n === 6) { // Sign preset — required work only; optional gaps and patient instructions remain untouched
    [...requiredIds(), ...scenarioData().auto].forEach(id => {
      decisions[id] = {...(decisions[id]||{}), confirmed:true, partial:false, needsReview:false};
    });
    visitNoteDisposition = 'reviewed';
  }
  lifecycleState = p.lc;
  liveTopicId = p.live ? scenarioData().start : null;
  selectedAssessmentId = p.sel ? (assessmentIds().includes(p.sel) ? p.sel : scenarioData().start) : null;
  canvasMode = p.cm; workspaceMode = p.wm || 'visit';
  scribeState = p.scribe || 'idle';
  // Presets represent an established moment; starting manually still begins
  // in the compact listening state and waits for the first detected content.
  scribeContentDetected = scribeState === 'recording' && !!liveTopicId;
  scribeExpanded = !(lifecycleState === 'recording' && selectedAssessmentId);
  desktopPhase = n === 0 ? 'brief' : (n >= 5 ? 'review' : 'visit');
  if (n === 0) activeSpySection = 'brief';
  else if (desktopPhase === 'visit' && lifecycleState !== 'recording') {
    activeSpySection = selectedAssessmentId || orderedAssessmentIds().find(id=>!isResolved(id)) || 'close';
    scrollSpySuppressUntil = Date.now() + 1200;
  } else if (desktopPhase === 'review') activeSpySection = computeSignStatus().unresolved.length ? 'review-needs' : 'review';
  secs = 0; // new segment always starts at 0:00
  // The sign preset enters the same focused Visit review takeover.
  if (lifecycleState === 'sign') {
    finalNoteOpen = true; workspaceMode = 'sign'; activeSpySection = 'review';
  }
  if (scribeState === 'recording') startTimer(); else stopTimer();
  renderAll();
  if (desktopPhase !== 'brief' && scribeState === 'idle') {
    requestAnimationFrame(()=>scrollToSection(activeSpySection, true));
  }
  for (let i = 0; i < 7; i++) { const b=document.getElementById('pb'+i); if(b) b.classList.toggle('on', i===n); }
}

// ── Scribe controls (orthogonal to lifecycle) ──────────────

// ALWAYS starts a new segment at 0:00.
// resumeScribe() is the only path that preserves elapsed time.
function startScribe() {
  if (scribeState === 'recording' || scribeState === 'paused') return;
  if (document.getElementById('sched')?.classList.contains('active')) return;
  // Starting from Brief should feel like the clinician scrolled naturally
  // into Visit: capture the rail geometry before the phase changes, then
  // animate the accordion sections into their new positions after render.
  const phaseMotion = capturePhaseRailTransition('visit');
  // Capture prior lifecycle before overwriting it
  const priorLifecycle = lifecycleState;
  secs = 0; // new segment — always reset
  scribeState = 'recording';
  liveTopicId = activeScenario === 'B' ? null : scenarioData().start;
  resetScribeDemoState();
  lifecycleState = 'recording';
  desktopPhase = 'visit'; briefDetailId = null;
  // Preserve the current canvas beneath the fixed Scribe frame. Entering a
  // recording should add context, not replace the clinician's place.
  recordOpen = false; finalNoteOpen = false; workspaceMode = 'visit'; scribeExpanded = true;
  // Don't disturb any assessment the clinician had open — they chose to be there.
  // Only clear stale review/sign canvas state that can't apply during a new recording.
  if (canvasMode !== 'assessment-task' || !selectedAssessmentId) {
    canvasMode = 'live-conversation'; selectedAssessmentId = null;
  }
  // Open canvas with scribe content at wide viewports; narrow viewports use the nav slot
  if (canvasMode === 'live-conversation') scribeCanvasOpen = true;
  // Use priorLifecycle so the check fires correctly even after lifecycleState changes
  if (signedState || noteNeedsUpdate || priorLifecycle === 'sign' || priorLifecycle === 'reviewing' || priorLifecycle === 'draft-ready') noteNeedsUpdate = true;
  if (noteNeedsUpdate) visitNoteDisposition = 'pending';
  signValidation = false; signedState = false; // new recording invalidates prior signature
  signaturePanelOpen = false; signatureAcknowledged = false; legalExpanded = false;
  // decisions are preserved — prior confirmed work is not discarded
  startTimer();
  renderAll();
  schedulePhaseRailTransition(phaseMotion);
}

function pauseScribe() {
  if (scribeState !== 'recording') return;
  scribeState = 'paused';
  stopTimer(); // freeze — secs keeps its current value
  renderAll();
}

function resumeScribe() {
  if (scribeState !== 'paused') return;
  scribeState = 'recording';
  startTimer(); // resume from frozen secs — no reset
  renderAll();
}

function stopScribe() {
  if (scribeState === 'idle') return;
  scribeState = 'idle';
  mobileScribeOpen = false;
  scribeCanvasOpen = false;
  stopTimer();
  liveTopicId = null; // no live topic when scribe is not running
  if (lifecycleState === 'recording') {
    lifecycleState = 'draft-ready';
    workspaceMode = 'visit';
    // Keep the assessment canvas open if the clinician had one up — let them close it when ready
    if (canvasMode !== 'assessment-task' || !selectedAssessmentId) {
      selectedAssessmentId = null;
      canvasMode = 'live-conversation';
    }
    // If user stopped scribe while browsing Review tab, return them to visit
    if (desktopPhase === 'review' && !finalNoteOpen) desktopPhase = 'visit';
  }
  renderAll();
}

function finishScribeAndReview() {
  if (scribeState !== 'idle') {
    scribeState = 'idle';
    stopTimer();
    liveTopicId = null;
    lifecycleState = 'draft-ready';
    selectedAssessmentId = null;
    canvasMode = 'live-conversation';
    workspaceMode = 'visit';
    scribeExpanded = true;
  }
  openSignWorkspace();
}

function enterReview() {

function confirmSelectedAssessment() {
  switch(selectedAssessmentId) {
    case 'hfref': confirmHFrEF(); break;
    case 'ckd':   confirmCKD(); break;
    case 'htn': {
      const v = taskQuery('input[name="htn-plan"]:checked')?.value || decisions.htn?.plan || 'monitor';
      decisions.htn = { ...(decisions.htn||{}), confirmed:true, partial:false, needsReview:false, plan:v };
      returnAfterConfirm(); break;
    }
    case 'dm':    confirmDM(); break;
    case 'eye': {
      const v = taskQuery('input[name="eye-action"]:checked')?.value || 'refer';
      confirmEye(v); break;
    }
    case 'mamm': {
      const v = taskQuery('input[name="mamm-action"]:checked')?.value || 'refer';
      confirmMamm(v); break;
    }
    case 'afib': decisions.afib = { confirmed:true, adHoc:true }; returnAfterConfirm(); break;
    case 'close': confirmClose(); break;
    default:
      if (selectedAssessmentId) {
        decisions[selectedAssessmentId] = { confirmed:true };
        returnAfterConfirm();
      }
  }
}

function isResolved(id) { const d=decisions[id]; return !!(d&&(d.confirmed||d.deferred)); }

// Persist confirmation and preserve review-layer return behavior. Inline task
// completion chooses its next section in confirmAssessmentById().
function returnAfterConfirm() {
  if (reviewTaskId) {
    if (!usesMobileDisclosurePattern()) return;
    reviewTaskId = null; selectedAssessmentId = null; canvasMode = 'live-conversation';
    returnToSignAfterConfirm = false; renderAll();
    requestAnimationFrame(()=>restoreReviewAnchor());
    return;
  }
  // If clinician was editing from sign workspace, return there after re-confirming
  if (returnToSignAfterConfirm) {
    returnToSignAfterConfirm = false;
    openSignWorkspace();
    return;
  }
  workspaceMode = 'visit';
  if (lifecycleState === 'reviewing') {
    selectedAssessmentId = null; canvasMode = 'live-conversation';
    const st = computeSignStatus();
    lifecycleState = st.canSign ? 'sign' : 'draft-ready';
  } else {
    selectedAssessmentId = null; canvasMode = 'live-conversation'; scribeExpanded = true;
  }
  renderAll();
}

function deferAssessment(id) {
  const fromReviewLayer = !!reviewTaskId;
  decisions[id] = decisions[id] || {};
  decisions[id].deferred = true; decisions[id].confirmed = false;
  returnAfterConfirm();
  advanceAfterTaskAction(id, fromReviewLayer);
}

// ── Effective icon code ────────────────────────────────────
// For items coming from computeOD(), the `c` field is already scenario-aware.
// This function adds the orthogonal-state overrides (live/sel) on top.
function effectiveIconCode(item) {
  if (!item.id) return item.c;
  // The microphone is the canonical live state from the alpha/MVP reference.
  // Selection remains visible through the row treatment without replacing it.
  if (lifecycleState === 'recording' && liveTopicId && item.id === liveTopicId) return 'live';
  if (item.id === selectedAssessmentId && canvasMode === 'assessment-task') return 'sel';
  // item.c already reflects decisions via iconForId() in computeOD
  return item.c;
}

// Draws an inline SVG sparkline from an array of values (nulls allowed for gaps).
function sparkSVG(vals, w, h, color, goalMax, goalMin) {
  const nonNull = vals.filter(v => v != null);
  if (nonNull.length < 2) return '';
  const allScale = [...nonNull];
  if (goalMax != null) allScale.push(goalMax);
  if (goalMin != null) allScale.push(goalMin);
  const lo = Math.min(...allScale);
  const hi = Math.max(...allScale);
  const rng = (hi - lo) || 1;
  const px = 5, py = 5;
  function x(i) { return px + (i / (vals.length - 1)) * (w - px * 2); }
  function y(v) { return h - py - ((v - lo) / rng) * (h - py * 2); }
  // Build contiguous segments
  const segs = []; let seg = [];
  vals.forEach((v, i) => {
    if (v != null) { seg.push([x(i), y(v)]); }
    else if (seg.length) { segs.push(seg); seg = []; }
  });
  if (seg.length) segs.push(seg);
  const last = segs[segs.length - 1];
  const lp = last[last.length - 1];
  // Area fill
  const areaR = `${last[0][0]},${h - py} ${last.map(([ax,ay])=>`${ax},${ay}`).join(' ')} ${lp[0]},${h - py}`;
  // Reference line
  const refV = goalMax != null ? goalMax : goalMin;
  const refLine = refV != null
    ? `<line x1="${px}" y1="${y(refV)}" x2="${w-px}" y2="${y(refV)}" stroke="${color}" stroke-width="1" stroke-dasharray="3 3" opacity=".25"/>`
    : '';
  const polylines = segs.map(s =>
    `<polyline points="${s.map(([ax,ay])=>`${ax.toFixed(1)},${ay.toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="square"/>`
  ).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="display:block">
    <polygon points="${areaR}" fill="${color}" opacity=".1"/>
    ${refLine}
    ${polylines}
    <circle cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="3.5" fill="${color}"/>
  </svg>`;
}

function renderMetricSignal(m) {
  // Use resolved hex values — CSS custom properties don't work in SVG presentation attributes
  const color = m.status === 'warn' ? '#d9091c' : '#007f61';
  const arrow = m.trend === 'up' ? '↑' : m.trend === 'down' ? '↓' : '→';
  const svg = sparkSVG(m.spark, 160, 44, color, m.goalMax, m.goalMin);
  return `<div class="tsm-metric">
    <div class="tsm-val">
      <div class="tsm-key">${m.key}</div>
      <div class="tsm-number ${m.status}">${m.val}</div>

    </div>
    <div class="tsm-chart" aria-label="${m.key} trend: ${m.spark.filter(v=>v!=null).join(', ')} ${m.unit}">${svg}</div>
  </div>`;
}

  if (scribeState === 'paused') {
    return `<div class="ssh-scribe" style="padding:0 6px 0 12px;gap:2px;background:transparent;">
      <span class="rec-timer" id="liveTimer" style="font-size:13px;font-weight:600;color:var(--fg-3);min-width:36px">${fmt(secs)}</span>
      <div class="ssh-scribe-sep" style="margin:0 2px"></div>
      ${iconBtn('resumeScribe()', I.play, 'Resume')}
      ${iconBtn('stopScribe()', I.stop, 'Stop')}
    </div>`;
  }
  // Idle: pill-shaped button only, no island border
  return `<div class="ssh-scribe idle">
    <button class="btn-p scribe-start" onclick="startScribe()">${I.mic} Start Scribe</button>
  </div>`;
}

function renderLocalizedScribe() {
  if (scribeState === 'idle') {
    return `<div class="ssh-start-actions">
      <button class="btn-p scribe-start" onclick="startScribe()">${I.mic} Start Scribe</button>
    </div>`;
  }

  const topicLabel = liveTopicId
    ? (ITEMS[liveTopicId]||{label:liveTopicId}).label
    : secs < 4
      ? 'Listening for the first topic'
      : 'Structured discussion complete';
  const statusLabel = scribeState === 'paused'
    ? 'Paused'
    : liveTopicId
      ? 'Now discussing'
      : secs < 4 ? 'Scribe starting' : 'Scribe active';
  const compact = !scribeExpanded;
  const paused = scribeState === 'paused';
  const _iconBtn = (onclick, icon, label) =>
    `<button onclick="${onclick}" aria-label="${label}" title="${label}" style="width:32px;height:32px;border-radius:50%;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-2);flex-shrink:0;" onmouseenter="this.style.background='#f0f0f0'" onmouseleave="this.style.background='transparent'">${icon}</button>`;
  const controls = `<div class="scribe-local-controls" style="gap:2px;">
    ${paused
      ? _iconBtn('resumeScribe()', I.play, 'Resume')
      : _iconBtn('pauseScribe()', I.pause, 'Pause')}
    ${_iconBtn('stopScribe()', I.stop, 'Stop')}
    <button class="scribe-local-btn scribe-live-return" onclick="returnToLive()"
      aria-label="Return to live discussion" title="Return to live discussion">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m15 18-6-6 6-6"/></svg>
      Return to live
    </button>
  </div>`;

  if (compact) {
    return `<div class="scribe-local compact">
      <div class="scribe-local-status${paused?' paused':''}">${statusLabel}</div>
      <div class="scribe-local-title">${topicLabel}</div>
      <div class="scribe-local-time" id="liveTimer">${fmt(secs)}</div>
      ${controls}
    </div>`;
  }

  return `<div class="scribe-local full">
    <div class="scribe-live-copy">
      <div class="scribe-local-status${paused?' paused':''}">${statusLabel}</div>
      <div class="scribe-local-title">${topicLabel}</div>
    </div>
    <div class="scribe-live-actions" style="gap:4px;">
      <div class="scribe-recording-state${paused?' paused':''}">
        ${paused?'Paused':'Recording'} <span id="liveTimer">${fmt(secs)}</span>
      </div>
      ${paused
        ? `<button onclick="resumeScribe()" aria-label="Resume" title="Resume" style="width:34px;height:34px;border-radius:50%;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-2);" onmouseenter="this.style.background='#f0f0f0'" onmouseleave="this.style.background='transparent'">${I.play}</button>`
        : `<button onclick="pauseScribe()" aria-label="Pause" title="Pause" style="width:34px;height:34px;border-radius:50%;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-2);" onmouseenter="this.style.background='#f0f0f0'" onmouseleave="this.style.background='transparent'">${I.pause}</button>`}
      <button onclick="stopScribe()" aria-label="Stop" title="Stop" style="width:34px;height:34px;border-radius:50%;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-2);" onmouseenter="this.style.background='#f0f0f0'" onmouseleave="this.style.background='transparent'">${I.stop}</button>
    </div>
  </div>`;
}

  ready: ()=>`<div class="ssh-state-info">

  recording: ()=> {
    if (hasPinnedAssessment(selectedAssessmentId)) {
      return `<div class="ssh-state-info">

        <div class="ssh-kicker">${(ITEMS[selectedAssessmentId]||{detail:'Agenda item'}).detail} · Scribe continues in the agenda</div>
      </div>`;
    }
    const paused = scribeState === 'paused';
    const sig = scribeContentDetected && liveTopicId ? SIGNALS[liveTopicId] : null;
    const hasDisplayableTopic = scribeHasDisplayableTopic(scribeContentDetected, liveTopicId, sig);
    const wrapped = visitCloseReached && !liveTopicId;
    const topicTitle = wrapped ? 'Visit wrap-up' : hasDisplayableTopic ? (ITEMS[liveTopicId]?.label || liveTopicId) : 'Live visit';
    const scribeStatus = paused ? 'Paused' : 'Scribe listening';
    const dot = paused ? '' : `<div class="rec-dot" style="width:6px;height:6px;flex-shrink:0;"></div>`;
    return `<div class="ssh-state-info">

// renderPhScribe — fills the patient-header Scribe slot (right side of .ph).
// Scribe controls live here, not inside the visit workbench header.
function renderPhScribe() {
  const el = document.getElementById('phScribe');
  if (!el) return;
  el.innerHTML = renderScribeControls();
}

// renderSSH — visit lifecycle state title only (one consistent authoritative title per state).
// Scribe controls live in the patient header (.ph), not here.
function renderSSH() {
  const el = document.getElementById('ssh');
  if (!el) return;
  const fullScribeHeader = scrollDocMode
    && !finalNoteOpen
    && lifecycleState === 'recording'
    && scribeState !== 'idle'
    && scribeExpanded;
  el.classList.toggle('live-scribe-header', fullScribeHeader);
  if (fullScribeHeader) {
    el.innerHTML = `<div class="ssh-inner">${renderLocalizedScribe()}</div>`;
    return;
  }
  // During recording the SSH shows the visit-level header; the scribe canvas below
  // provides scribe-specific status + topic content. Both coexist in the layout.
  // 'Ready to begin' is redundant — the canvas content (assessment card or visit list) provides context
  if (lifecycleState === 'ready') { el.style.cssText = 'display:none'; return; }
  // Task canvases own their own headers — hide SSH so it doesn't stack with them
  if ((canvasMode === 'assessment-task' && !!selectedAssessmentId) ||
      canvasMode === 'reconfirm' || canvasMode === 'optional-assessments' || canvasMode === 'additional-topics') {
    el.style.cssText = 'display:none'; return;
  }
  let stateFn;
  if (finalNoteOpen) {
    const st = computeSignStatus();
    stateFn = ()=>`<div class="ssh-state-info">
      <div class="ssh-state-title">Review and sign</div>
      <div class="ssh-kicker">${st.unresolved.length} required unresolved · ${st.optional.filter(a=>!a.resolved).length} optional care gaps · Patient instructions ${st.wrapDone?'reviewed':'not reviewed'}</div>
    </div>`;
  } else {
    stateFn = SSH_STATE[lifecycleState] || (()=>`<div class="ssh-state-info"></div>`);
  }
  // In scroll-doc mode the scribe zone owns all identity and controls — collapse SSH entirely
  if (scrollDocMode) {
    el.style.cssText = 'display:none';
    return;
  }
  el.style.cssText = '';
  const stateHTML = stateFn();
  el.innerHTML = `<div class="ssh-inner">${stateHTML}${scrollDocMode ? renderLocalizedScribe() : ''}</div>`;
}
