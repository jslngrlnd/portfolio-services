// ── renderCanvas ───────────────────────────────────────────
function renderCanvas() {
  const el = document.getElementById('canvas');
  let inner = '';
  // The Scribe is an additive fixed frame. Keep the existing document beneath
  // it during recording unless the clinician explicitly opens another view.
  // Desktop scribe + assessment: recording in visit phase with an assessment opened — show both.
  // Mobile/tablet-ask handle assessments via their own sheet layers (renderMobileAssessSheet etc.)
  const scribeAssessDesktop = lifecycleState === 'recording' && desktopPhase === 'visit'
    && canvasMode === 'assessment-task' && !!selectedAssessmentId
    && !usesMobileSheetPattern() && !(usesTabletAskPattern() && recordOpen);
  const scribeFocus = false; // scribe content now lives in the nav slot, not the canvas
  const useScrollDoc = scrollDocMode && desktopPhase !== 'review' && !finalNoteOpen && !conditionContextId && !viewingBrief && canvasMode !== 'assessment-task' && !scribeFocus;
  // task-mode (overflow:hidden) not needed for the combo view — canvas scrolls normally
  const taskMode = !scribeAssessDesktop && !useScrollDoc && !viewingBrief && ((canvasMode === 'assessment-task' && !!selectedAssessmentId) || canvasMode === 'reconfirm' || canvasMode === 'optional-assessments' || canvasMode === 'additional-topics' || ((desktopPhase === 'review' || finalNoteOpen) && signaturePanelOpen && !signedState));
  el.classList.toggle('task-mode', taskMode);
  el.classList.toggle('review-l1-mode', !!reviewTaskId && !usesOverlayDisclosurePattern());
  el.classList.toggle('brief-detail-open', !!briefDetailId && desktopPhase === 'brief' && useScrollDoc);
  const mobileBaseView = usesMobileDisclosurePattern()
    && !conditionContextId && !viewingBrief && canvasMode !== 'assessment-task'
    && !signaturePanelOpen && !signedState;
  if (mobileBaseView) {
    inner = (desktopPhase === 'review' || finalNoteOpen)
      ? renderMobileReviewCanvas()
      : desktopPhase === 'brief' ? renderMobileBriefCanvas() : renderMobileVisitCanvas();
  } else if (conditionContextId) {
    inner = renderConditionContextCanvas(conditionContextId);
  } else if (reviewTaskId && !usesOverlayDisclosurePattern()) {
    inner = renderReviewAssessmentDocument();
  } else if ((desktopPhase === 'review' || finalNoteOpen) && canvasMode === 'visit-note') {
    inner = renderVisitNoteCanvas();
  } else if ((desktopPhase === 'review' || finalNoteOpen) && canvasMode === 'assessment-task' && selectedAssessmentId) {
    inner = `<div class="task-shell">${renderAssessmentTask(selectedAssessmentId)}${renderTaskActionBar(selectedAssessmentId)}</div>`;
  } else if ((desktopPhase === 'review' || finalNoteOpen) && canvasMode === 'reconfirm') {
    inner = renderReconfirmCanvas();
  } else if ((desktopPhase === 'review' || finalNoteOpen) && canvasMode === 'optional-assessments') {
    inner = renderOptionalAssessmentsCanvas();
  } else if ((desktopPhase === 'review' || finalNoteOpen) && canvasMode === 'additional-topics') {
    inner = renderAdditionalTopicsCanvas();
  } else if ((desktopPhase === 'review' || finalNoteOpen) && signaturePanelOpen && !signedState) {
    inner = renderSignaturePanel();
  } else if ((desktopPhase === 'review' || finalNoteOpen) && signedState) {
    inner = renderSignedVisitCanvas();
  } else if (desktopPhase === 'review' || finalNoteOpen) {
    inner = renderReviewDefaultCanvas();
  } else if (useScrollDoc) {
    inner = renderScrollDocument();
  } else if (canvasMode === 'brief') {
    inner = renderBriefCanvas();
  } else if (viewingBrief) {
    inner = `<div class="doc-section brief-standalone">
      <div style="display:flex;justify-content:flex-end;padding:14px 16px 0"><button class="btn-s" onclick="closeBriefView()">Back to all tasks</button></div>
      <div class="doc-sec-body">${renderBriefDocSection()}</div>
    </div>`;
  } else if (canvasMode === 'reconfirm') {
    inner = renderReconfirmCanvas();
  } else if (canvasMode === 'optional-assessments') {
    inner = renderOptionalAssessmentsCanvas();
  } else if (canvasMode === 'additional-topics') {
    inner = renderAdditionalTopicsCanvas();
  } else if (scribeAssessDesktop) {
    inner = renderScribeWithAssessment(selectedAssessmentId);
  } else if (canvasMode === 'assessment-task' && selectedAssessmentId) {
    inner = `<div class="task-shell">${renderAssessmentTask(selectedAssessmentId)}${renderTaskActionBar(selectedAssessmentId)}</div>`;
  } else if (scribeCanvasOpen && lifecycleState === 'recording') {
    inner = (CANVAS.recording)();
  } else if (scribeFocus) {
    inner = renderScribeFocusCanvas();
  } else {
    inner = (CANVAS[lifecycleState]||(()=>''))();
  }
  const showPhaseHeading = !mobileBaseView
    && !conditionContextId
    && !reviewTaskId
    && !signaturePanelOpen
    && !signedState
    && ((useScrollDoc && !!briefDetailId) || viewingBrief);
  const phaseHeading = showPhaseHeading ? renderCanvasPhaseHeading(desktopPhase,signedState) : '';
  // Wrap in .canvas-fade so each swap triggers the fadeUp animation.
  // Add canvas-task-open when the inner content is a task-shell for reliable edge-to-edge CSS targeting.
  const isTaskShell = inner.startsWith('<div class="task-shell">');
  el.innerHTML = `<div class="canvas-fade${isTaskShell ? ' canvas-task-open' : ''}">${phaseHeading}${inner}</div>`;
  const scroll = el.closest('.canvas-scroll');
  // Starting or updating the Scribe must not pull the underlying Brief/task
  // back to the top. Explicit navigation actions still own their scroll reset.
  const preserveDuringRecording = lifecycleState === 'recording'
    && (viewingBrief || canvasMode === 'assessment-task');
  if (scroll && !useScrollDoc && !preserveDuringRecording) scroll.scrollTop = 0;
}

function renderCanvasFooter() {
  const footer = document.getElementById('canvas-footer');
  const column = footer?.closest('.canvas-col');
  if (!footer || !column) return;
  // Action controls are rendered once, inside the assessment that owns them.
  // Keeping this compatibility mount empty prevents a second workspace-level
  // footer from visually detaching the action from its card.
  footer.classList.remove('visible');
  column.classList.remove('has-canvas-footer');
  footer.innerHTML = '';
}

// ── Assessment task helpers ────────────────────────────────

// Shown when a different assessment is selected while a live topic is active.
// Guards against null liveTopicId (idle scribe) to prevent rendering broken state.
// Green confirmation pill — replaces the defer/confirm footer when resolved.
// Matches mobile prototype "All confirmed" pill pattern.
function confirmPillHTML(outcomeText, deferred) {
  const checkSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
  const deferSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`;
  if (deferred) {
    return `<div class="task-confirm-pill" style="background:var(--surface-2);color:var(--fg-3)">${deferSvg} Deferred</div>`;
  }
  return `<div class="task-confirm-pill">${checkSvg} ${outcomeText || 'Confirmed'}</div>`;
}

// True whenever the clinician has explicitly opened an assessment during recording.
// This remains true if the live discussion later moves to that same assessment;
// only another navigation or task action should replace the pinned workspace.
function hasPinnedAssessment(id) {
  return !!id && lifecycleState === 'recording' && canvasMode === 'assessment-task';
}

// True when the pinned workspace and live discussion point at different items.
function isDisambiguating(id) {
  return hasPinnedAssessment(id) && !!liveTopicId && id !== liveTopicId;
}

// Merged title-nav bar shown when the selected assessment differs from the live topic.
// Replaces both the old "Scribe still listening" banner AND the task-header title row,
// saving vertical space. Back is far-left; Set as discussing is far-right (secondary).
function disambiguationBanner(id, titleLabel, titleSub) {
  if (!isDisambiguating(id)) return '';
  // Title is the primary canvas header. Two paired buttons: ghost (tertiary) + secondary.
  return `<div class="dis-bar">
    <div class="dis-title-block">
      <div class="dis-title">${titleLabel}</div>
      ${titleSub ? `<div class="dis-sub">${titleSub}</div>` : ''}
    </div>
    <div style="display:flex;gap:8px;flex-shrink:0;align-items:center">
      <button class="btn-ghost" onclick="returnToLive()">← Back to live</button>
      <button class="btn-s" onclick="setAsLiveTopic('${id}')">Set as discussing</button>
    </div>

// Mirrors showcase InteractiveChart: big stat headers + SVG polyline (makeSparkEl-style)
function evInteractiveChart(label, val, unit, status, spark, xLabels, label2, val2, unit2, status2, spark2) {
  const sW = 220, sH = 88, pad = 6, aBase = sH - 12;
  const hasDual = !!(label2 && val2 && spark2 && spark2.length);
  const endCol1 = status === 'warn' ? '#f97316' : status === 'good' ? '#22c55e' : '#6366f1';
  const valCol1 = status === 'warn' ? '#374151' : '#6366f1';
  const endCol2 = '#818cf8';
  const valCol2 = (status2 === 'warn') ? '#374151' : '#818cf8';
  const col1 = '#94a3b8', col2 = '#818cf8';
  function buildLine(vals) {
    if (!vals || vals.length < 2) return { pts: [], line: '', area: '' };
    const clean = vals.filter(v => v != null);
    const mn = Math.min(...clean), mx = Math.max(...clean), rng = mx - mn || 1;
    const pts = vals.map((v, i) => ({
      x: parseFloat(((i / (vals.length - 1)) * (sW - pad) + pad / 2).toFixed(1)),
      y: parseFloat((aBase - ((v - mn) / rng) * (aBase - pad - 12)).toFixed(1))
    }));
    const lineStr = pts.map(p => `${p.x},${p.y}`).join(' ');
    const areaStr = `M ${pts[0].x},${aBase} ${pts.map(p => `L ${p.x},${p.y}`).join(' ')} L ${pts[pts.length-1].x},${aBase} Z`;
    return { pts, line: lineStr, area: areaStr };
  }
  const l1 = buildLine(spark), l2 = hasDual ? buildLine(spark2) : null;
  const last1 = l1.pts.length ? l1.pts[l1.pts.length - 1] : null;
  const last2 = l2 && l2.pts.length ? l2.pts[l2.pts.length - 1] : null;
  const first1 = l1.pts.length ? l1.pts[0] : null;
  const svgEl = `<svg viewBox="0 0 ${sW} ${sH}" preserveAspectRatio="none" style="display:block;width:100%;height:100%;overflow:visible">
    ${l1.area ? `<path d="${l1.area}" fill="rgba(148,163,184,0.07)" stroke="none"/>` : ''}
    ${l2 && l2.area ? `<path d="${l2.area}" fill="rgba(129,140,248,0.05)" stroke="none"/>` : ''}
    ${first1 ? `<line x1="${first1.x}" y1="${aBase}" x2="${last1.x}" y2="${aBase}" stroke="#ebebeb" stroke-width="1"/>` : ''}
    ${l1.line ? `<polyline points="${l1.line}" fill="none" stroke="${col1}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    ${l2 && l2.line ? `<polyline points="${l2.line}" fill="none" stroke="${col2}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    ${last1 ? `<circle cx="${last1.x}" cy="${last1.y}" r="4" fill="${endCol1}"/>` : ''}
    ${last2 ? `<circle cx="${last2.x}" cy="${last2.y}" r="3.5" fill="${endCol2}"/>` : ''}
    ${xLabels && xLabels.length >= 2 && first1 ? `<text x="${first1.x}" y="${sH - 1}" font-size="8.5" fill="#bbb">${xLabels[0]}</text><text x="${last1.x}" y="${sH - 1}" font-size="8.5" fill="#bbb" text-anchor="end">${xLabels[xLabels.length-1]}</text>` : ''}
  </svg>`;
  function legLine(c, lbl) {
    return `<div style="display:flex;align-items:center;gap:4px"><div style="width:18px;height:2.5px;border-radius:2px;background:${c}"></div><span style="font-size:8.5px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em">${lbl}</span></div>`;
  }
  return `<div style="display:flex;flex-direction:column;padding-bottom:4px">
    <div style="display:flex;gap:18px;align-items:flex-end;margin-bottom:10px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:3px">
        <div style="display:flex;align-items:baseline;gap:3px">
          <span style="font-size:24px;font-weight:800;color:${valCol1};line-height:1;letter-spacing:-0.03em">${val}</span>
          <span style="font-size:9.5px;font-weight:600;color:#9CA3AF">${unit}</span>
        </div>
        ${legLine(col1, label)}
      </div>
      ${hasDual ? `<div style="display:flex;flex-direction:column;gap:3px">
        <div style="display:flex;align-items:baseline;gap:3px">
          <span style="font-size:24px;font-weight:800;color:${valCol2};line-height:1;letter-spacing:-0.03em">${val2}</span>
          <span style="font-size:9.5px;font-weight:600;color:#9CA3AF">${unit2}</span>
        </div>
        ${legLine(col2, label2)}
      </div>` : ''}
    </div>
    <div style="width:100%;max-width:${sW}px;aspect-ratio:${sW}/${sH};position:relative">${svgEl}</div>
  </div>`;
}

// Returns the suffix appended to the step-2 title (child conditions only, no type label).
function buildDMStep2Sub() {
  const scribed = lifecycleState !== 'ready';
  const effectiveType = dmTypeChoice !== null ? dmTypeChoice : (scribed ? 'dm-t2' : null);
  if (!effectiveType) return '';
  // Non-T2 types: show the type name as the suffix
  if (effectiveType !== 'dm-t2') {
    return { 'dm-t1': 'Type I', 'dm-remission': 'Remission', 'dm-eval': 'Further evaluation', 'dm-eval2': 'Evaluation not recommended' }[effectiveType] || '';
  }
  // T2: list the checked child conditions
  const ck = (id, scriDef) => dmChecks[id] !== undefined ? dmChecks[id] : (scribed && scriDef);
  const children = [
    ['dm-retino','Retinopathy',true], ['dm-hyperglycemia','Hyperglycemia',true], ['dm-htn-dm','Hypertension with DM',true],
    ['dm-athero','Atherosclerosis',false], ['dm-skin','Skin ulcers',false], ['dm-amp','Amputation',false],
    ['dm-osteo','Osteomyelitis',false], ['dm-bmi','BMI ≥ 40',false], ['dm-neuro','Neuropathy',false], ['dm-no-comp','Without complications',false]
  ];
  return children.filter(([id,,scriDef]) => ck(id, scriDef)).map(([,label]) => label).join(', ');
}

// ── COPD — 4-step: ASSESS ×3 (obstructive → respiratory → arterial) + TREAT ──
function buildCOPDTitle(upToStep) {
  // COPD defaults come from EHR data, not scribe — always apply defaults
  const ck1 = (id, def) => copdChecks[id] !== undefined ? copdChecks[id] : def;
  const ck2 = (id, def) => copdStep2Checks[id] !== undefined ? copdStep2Checks[id] : def;
  const ck3 = (id, def) => copdStep3Checks[id] !== undefined ? copdStep3Checks[id] : def;
  const parts = [];
  if (upToStep >= 1) {
    if (ck1('copd-main', false)) parts.push('COPD');
    else if (ck1('emphysema', false)) parts.push('Emphysema');
    else if (ck1('bronchitis', false)) parts.push('Chronic bronchitis');
    else if (ck1('cough', false)) parts.push("Smoker's cough");
    else if (ck1('asthma', false)) parts.push('Asthma');
  }
  if (upToStep >= 2) {
    if (ck2('resp-fail', false)) parts.push('Respiratory failure');
    else if (ck2('ventilator', false)) parts.push('On ventilator');
    else if (ck2('trach', false)) parts.push('Tracheostomy');
  }
  if (upToStep >= 3) {
    if (ck3('athero', false)) parts.push('Atherosclerosis of lower extremities');
    else if (ck3('aorta', false)) parts.push('Aortic aneurysm');
    else if (ck3('bypass-graft', false)) parts.push('Atherosclerosis of bypass graft');
    else if (ck3('pulm-aneurysm', false)) parts.push('Aneurysm of pulmonary artery');
  }
  return parts.join(', ') || 'COPD';
}

function sendPatientInstructions(button) {
  const input = document.getElementById('patient-instructions-phone');
  const status = document.getElementById('patient-instructions-send-status');

  const digits = phone.replace(/\D/g,'');

// ══ OUTLINE — dynamic computation ═════════════════════════
// computeOD() replaces the static OD object. It builds the
// correct section structure from current orthogonal state.

const ASSESS_META = {
  hfref: { n:'Hospitalization follow-up: HFrEF', baseNt:'2-week post-discharge', baseNc:'m' },
  ckd:   { n:'CKD',                              baseNt:'eGFR 29 — new finding',  baseNc:'warn' },
  dm:    { n:'Type 2 Diabetes',                  baseNt:'A1c 7.8% — review',     baseNc:'m' },
  afib:  { n:'Atrial fibrillation',               baseNt:'Ad-hoc finding',         baseNc:'warn' },
  hf_stability:{ n:'HF stability',                baseNt:'Recent readmission',     baseNc:'warn' },
  copd:  { n:'COPD',                              baseNt:'Specialist managed',     baseNc:'m' },
  htn:   { n:'Hypertension',                      baseNt:'Review BP plan',         baseNc:'m' },
  eye:   { n:'Diabetic eye exam',                baseNt:'Overdue',               baseNc:'warn' },
  mamm:  { n:'Mammogram',                        baseNt:'Overdue · last screening 2023', baseNc:'warn' },
  pneumo:{ n:'Pneumococcal vaccination',          baseNt:'Care gap',              baseNc:'m' },
  dexa:  { n:'DEXA screening',                    baseNt:'Care gap',              baseNc:'m' },
  acp:   { n:'Advance care planning',             baseNt:'Care gap',              baseNc:'m' },
  crc:   { n:'Colorectal screening',              baseNt:'Care gap',              baseNc:'m' },
  close: { n:'Patient instructions',                 baseNt:'Ready to review',       baseNc:'m' },
};

// Compute icon code for an assessment item (Scenario B context-aware)
function iconForId(id) {
  const d = decisions[id];
  if (d && d.confirmed) return 'done';
  if (d && d.deferred)  return 'defer';
  if (d && d.partial)   return 'part';
  if (id === selectedAssessmentId && canvasMode === 'assessment-task') return 'sel';
  if (lifecycleState === 'recording' && liveTopicId && id === liveTopicId) return 'live';
  return 'q';
}

// Compute display note for an assessment item
function noteForId(id) {
  const d = decisions[id];
  const postScribe = lifecycleState === 'draft-ready' || lifecycleState === 'reviewing';
  if (d && d.confirmed) return {};
  if (d && d.deferred)  return {};
  if (d && d.partial)   return {};
  if (id === 'close')   return { nt:visitCloseReached ? 'Optional · Ready for wrap-up' : 'Optional · Available after discussion', nc:'m' };
  if (id === 'hfref') return { nt:'BNP 780 ↓ · EF 35% · post-discharge day 15', nc:'m' };
  if ((lifecycleState === 'draft-ready' || lifecycleState === 'reviewing') && (id === 'eye' || id === 'mamm')) return { nt:'Not discussed', nc:'m' };
  return {};
}

function makeItem(id, overrides) {
  const m = ASSESS_META[id] || { n: id };
  const note = noteForId(id);
  const scenarioName = id === 'hfref' ? 'HF decompensation' : m.n;
  const isHosp = id === 'hfref';
  return { c: iconForId(id), id, n: scenarioName, isHosp, ...note, ...(overrides||{}) };
}

function computeOD() {
  const closeItem = makeItem('close');
  // Helper: care gap group label with pending count
  function gapLabel(pending) { return pending > 0 ? `Care gaps · ${pending} pending` : 'Care gaps'; }

  switch(lifecycleState) {
    case 'ready': {
      const gapPend = gapIds().filter(id => !isResolved(id)).length;
      return {
        h: 'Visit', s: `${assessmentIds().length} items planned`,
        gs: [
          { l:'Agenda', items: clinicalIds().map(id => makeItem(id)) },
          { l: gapLabel(gapPend), items: gapIds().map(id => makeItem(id)) },
        ]
      };
    }

    case 'recording': {
      const gs = [];
      if (agendaOrderMode === 'stable') {
        // Planned order is immutable while Scribe updates status. Live and
        // completed items stay in their original positions and change icon only.
        const plannedClinical = clinicalIds();
        const plannedGaps = gapIds();
        if (plannedClinical.length) gs.push({ l:'Agenda', items:plannedClinical.map(id=>makeItem(id)) });
        if (plannedGaps.length) gs.push({ l:gapLabel(plannedGaps.filter(id=>!isResolved(id)).length), items:plannedGaps.map(id=>makeItem(id)) });
      } else {
        // Remaining first is the explicit triage view: unresolved items float
        // above completed work while the active topic is conveyed by its mic.
        const remaining = assessmentIds().filter(id=>!isResolved(id));
        const completed = assessmentIds().filter(id=>isResolved(id));
        if (remaining.length) gs.push({ l:'Remaining', items:remaining.map(id=>makeItem(id)) });
        if (completed.length) gs.push({ l:'Completed', items:completed.map(id=>makeItem(id)) });
      }
      return { h:'Visit', s:'Recording', gs };
    }

    case 'draft-ready': {
      const needs     = clinicalIds().filter(id => requiredIds().includes(id) && !isResolved(id));
      const uncaptured = clinicalIds().filter(id => !requiredIds().includes(id) && !isResolved(id));
      const gapPend   = gapIds().filter(id => !isResolved(id));
      const gapDone2  = gapIds().filter(id => isResolved(id));
      const clinDone2 = clinicalIds().filter(id => isResolved(id));
      const gs = [];
      if (needs.length)     gs.push({ l:'Needs review', items: needs.map(id => makeItem(id)) });
      if (uncaptured.length) gs.push({ l:'Scribe not completed', items: uncaptured.map(id => makeItem(id)) });
      const allGaps2 = [...gapPend, ...gapDone2];
      if (allGaps2.length)  gs.push({ l: gapLabel(gapPend.length), items: allGaps2.map(id => makeItem(id)) });
      if (clinDone2.length) gs.push({ l:'Completed', items: clinDone2.map(id => makeItem(id)) });
      gs.push({ l:'Patient instructions', items:[closeItem] });
      return { h:'Visit review', s:`${needs.length} required need review · ${gapPend.length} optional open`, gs };
    }

    case 'reviewing': {
      const curId = selectedAssessmentId && assessmentIds().includes(selectedAssessmentId) ? selectedAssessmentId : null;
      const remaining = assessmentIds().filter(id => !isResolved(id) && id !== curId);
      const reviewed  = assessmentIds().filter(id => isResolved(id));
      const clinRem2  = remaining.filter(id => !gapIds().includes(id));
      const gapRem2   = remaining.filter(id => gapIds().includes(id));
      const gapDone3  = reviewed.filter(id => gapIds().includes(id));
      const clinReviewed = reviewed.filter(id => !gapIds().includes(id));
      const gs = [];
      if (curId) gs.push({ l:'Now reviewing', items:[{ ...makeItem(curId), c:'rev' }] });
      if (clinRem2.length) gs.push({ l:'Remaining', items: clinRem2.map(id => makeItem(id)) });
      const allGaps3 = [...gapRem2, ...gapDone3];
      if (allGaps3.length) gs.push({ l: gapLabel(gapRem2.length), items: allGaps3.map(id => makeItem(id)) });
      if (clinReviewed.length) gs.push({ l:'Reviewed', items: clinReviewed.map(id => makeItem(id)) });
      const wrapDone = isResolved('close');
      gs.push({ l:'Patient instructions', items:[wrapDone ? {...closeItem,c:'done',nt:'Reviewed',nc:'ok'} : closeItem] });
      return { h:`Reviewing ${reviewedCount()} of ${totalAssessmentCount()}`, s:'', gs };
    }

    case 'sign':
    default: {
      const gapPend2 = gapIds().filter(id => !isResolved(id)).length;
      const wrapDone2 = isResolved('close');
      return {
        h: computeSignStatus().canSign ? 'Ready to sign' : 'Review and sign',
        s:`${computeSignStatus().resolved.length} of ${computeSignStatus().required.length} required confirmed`,
        gs:[
          { l:'Confirmed', items: clinicalIds().map(id => makeItem(id)) },
          { l: gapLabel(gapPend2), items: gapIds().map(id => makeItem(id)) },
          { l:'Patient instructions', items:[wrapDone2 ? {...closeItem,c:'done',nt:'Reviewed',nc:'ok'} : closeItem] },
        ]
      };
    }
  }
}

// ── Sign workspace ─────────────────────────────────────────

function nextReviewItemId() {
  const st = computeSignStatus();
  return st.unresolved[0]?.id || null;
}

function nextReviewItemAfter(id) {
  const unresolvedIds = new Set(computeSignStatus().unresolved.map(item=>item.id));
  const order = requiredIds();
  const currentIndex = order.indexOf(id);
  const after = order.slice(Math.max(currentIndex + 1, 0)).find(itemId=>unresolvedIds.has(itemId));
  const nextRequired = after || order.slice(0,Math.max(currentIndex,0)).find(itemId=>unresolvedIds.has(itemId));
  if (nextRequired) return nextRequired;
  // Required done → reconfirm → optional → patient instructions
  if (RECON_TASKS.some(t => !reconStatus[t.id])) return 'reconfirm';
  if (OPT_ITEMS.length > 0) return 'optional-assessments';
  if (lifecycleState !== 'ready' && !isResolved('close')) return 'close';
  return null;
}

function scrollReviewToItem(id) {
  const body = document.querySelector('.review-takeover-body');
  const section = document.getElementById('review-section-' + id);
  if (!body || !section) return;
  const delta = section.getBoundingClientRect().top - body.getBoundingClientRect().top;
  const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  body.scrollBy({ top: delta, behavior: reducedMotion ? 'auto' : 'smooth' });
}

function openSignWorkspace(phaseMotion=null) {
  phaseMotion = phaseMotion || capturePhaseRailTransition('review');
  if (!finalNoteOpen) {
    reviewReturnSection = activeSpySection;
    reviewReturnWasBrief = viewingBrief;
    phaseBeforeReview = desktopPhase;
  }
  closeRecord();
  briefDetailId = null;
  desktopPhase = 'review';
  finalNoteOpen = true; workspaceMode = 'sign'; signValidation = false; viewingBrief = false;
  reviewInlineTaskId = nextReviewItemId();
  activeSpySection = 'review'; reviewTaskId = null; renderAll();
  schedulePhaseRailTransition(phaseMotion);
}

// Compute the current completion status across all assessments.
function computeSignStatus() {
  const items = assessmentIds().map(id => {
    const d = decisions[id] || {};
    const optional = gapIds().includes(id);
    const resolved = isResolved(id);
    return { id, resolved, optional, confirmed: !!d.confirmed, deferred: !!d.deferred, d };
  });
  const required = items.filter(a => requiredIds().includes(a.id));
  const workflow = items.filter(a => !a.optional);
  const workflowResolved = workflow.filter(a => a.resolved);
  const unresolved  = required.filter(a => !a.resolved);
  const resolved    = required.filter(a => a.resolved);
  const optional    = items.filter(a => a.optional);
  const wrapDone    = isResolved('close');
  const recording   = scribeState !== 'idle';
  const noteReady   = !noteNeedsUpdate && (visitNoteDisposition === 'reviewed' || visitNoteDisposition === 'sent');
  const blockers    = [];
  if (unresolved.length) blockers.push({ type:'assessments', count:unresolved.length, items:unresolved });
  if (recording)          blockers.push({ type:'recording' });
  return { items, workflow, workflowResolved, required, unresolved, resolved, optional, wrapDone, recording, noteReady, blockers, canSign: blockers.length === 0 };
}

function computeReviewWorkStatus() {
  const st = computeSignStatus();
  const total = st.required.length;
  const complete = st.resolved.length;
  const remaining = Math.max(0,total-complete);
  return {...st,totalWork:total,completeWork:complete,remainingWork:remaining,progress:Math.round((complete/Math.max(total,1))*100)};
}

// ICD-10 codes and outcomes for confirmed assessments.
function outcomeForId(id) {
  const d = decisions[id] || {};
  if (id === 'hfref') return { code:'I50.22', label:'Acute on chronic HFrEF decompensation · EF 35%' };
  if (id === 'ckd') {
    const stage = d.stage || '4';
    return { code: stage==='4' ? 'N18.4' : 'N18.3', label:`CKD Stage ${stage}${d.ref?' · Nephrology referral ordered':''}` };
  }
  if (id === 'dm')  return { code:'E11.9', label:`T2DM${d.bpChoice==='address' ? ' · BP management addressed' : ' · Plan confirmed'}` };
  if (id === 'afib') return { code:'I48.91', label:'Atrial fibrillation · ad-hoc finding reviewed' };
  if (id === 'htn') return { code:'I10', label:'Hypertension · plan confirmed' };
  if (id === 'copd') return { code:'J44.9', label:'COPD · status and plan confirmed' };
  const gapOuts = { refer:'Referral ordered', declined:'Patient declined', done:'Already completed', defer:'Deferred' };
  if (id === 'eye')  return { label: d.deferred ? 'Deferred' : ((gapOuts[d.action]||'Referral ordered') + (d.action==='refer' ? ' — Valley Eye Center' : '')) };
  if (id === 'mamm') return { label: d.deferred ? 'Deferred' : (gapOuts[d.action] || 'Referral ordered') };
  if (id === 'close') return { label: d.instructionsSent && d.phone ? `Patient instructions reviewed · Instructions sent to ${d.phone}` : 'Patient instructions reviewed · Instructions not sent' };
  return { label:'Confirmed' };
}

// Human-readable reason an assessment is unresolved.
function unresolvedReason(id) {
  const dr = {'ckd':'Stage 3 → 4 — staging decision and nephrology plan required','dm':'Hypertension not addressed — BP management decision needed','afib':'Ad-hoc Afib finding requires clinician review','htn':'Blood pressure plan requires confirmation','copd':'COPD status and plan require confirmation','hf_stability':'Post-readmission stability assessment requires confirmation','eye':'Optional care gap','mamm':'Optional care gap','close':'Optional · Review follow-ups, medication changes, and patient instructions'};
  return dr[id] || 'Assessment not yet completed';
}

// Note status label based on current state.
function noteStatusLabel() {
  if (signedState)       return { cls:'signed',      text:'Signed' };
  if (noteNeedsUpdate)   return { cls:'needs-update', text:'Optional update' };
  if (visitNoteDisposition === 'sent') return { cls:'ready', text:'Sent to EHR' };
  if (visitNoteDisposition === 'reviewed') return { cls:'ready', text:'Reviewed' };
  return { cls:'draft', text:'Optional' };
}

// Open an assessment from sign workspace — navigates away from sign to the canvas task.

function openFromSign(id) {
  openReviewTask(id, false);
}

// Edit a confirmed assessment — unconfirms it so it requires re-review.
function editFromSign(id) {
  openReviewTask(id, true);

function openReviewTask(id, edit=false) {
  reviewTaskReturnFocus = document.activeElement;
  const scroll = document.querySelector('.canvas-scroll');
  reviewReturnScrollTop = scroll ? scroll.scrollTop : 0;
  closeRecord(); conditionContextId = null;
  if (edit) {
    if (!decisions[id]) decisions[id] = {};
    decisions[id].confirmed = false; decisions[id].deferred = false; decisions[id].needsReview = true;
    noteNeedsUpdate = true;
    visitNoteDisposition = 'pending';
  }
  reviewTaskId = id; selectedAssessmentId = id; canvasMode = 'assessment-task';
  activeSpySection = id;
  returnToSignAfterConfirm = usesMobileDisclosurePattern(); renderAll();

}

function restoreReviewAnchor() {
  const scroll = document.querySelector('.canvas-scroll');
  if (scroll) scroll.scrollTop = reviewReturnScrollTop;
}

function closeReviewTask() {
  reviewTaskId = null; selectedAssessmentId = null; canvasMode = 'live-conversation';
  returnToSignAfterConfirm = false; renderAll();
  const returnTarget = reviewTaskReturnFocus;
  reviewTaskReturnFocus = null;
  requestAnimationFrame(()=>{ restoreReviewAnchor();returnTarget?.focus?.({preventScroll:true}); });
}

function initReviewTaskSheetDrag() {
  const handle = document.getElementById('reviewTaskDragHandle');
  const sheet = document.querySelector('.review-task-sheet');
  if (!handle || !sheet) return;
  let startY = 0;
  let deltaY = 0;
  const settle = event => {
    sheet.style.transition = 'transform .22s cubic-bezier(.2,.75,.2,1)';
    sheet.style.transform = '';
    if (deltaY > 72) closeReviewTask();
    deltaY = 0;
    try { handle.releasePointerCapture(event.pointerId); } catch (_) {}
  };
  handle.addEventListener('pointerdown', event => {
    if (!usesMobileDisclosurePattern()) return;
    startY = event.clientY;deltaY = 0;sheet.style.transition = 'none';
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', event => {
    if (!handle.hasPointerCapture(event.pointerId)) return;
    deltaY = Math.max(0, event.clientY - startY);
    sheet.style.transform = `translateY(${deltaY}px)`;
  });
  handle.addEventListener('pointerup', settle);
  handle.addEventListener('pointercancel', settle);
  handle.addEventListener('keydown', event => {
    if (event.key === 'ArrowDown') { event.preventDefault();closeReviewTask(); }
  });
}

function renderReviewTaskLayer() {
  const el = document.getElementById('reviewTaskLayer');
  if (!el) return;
  if (!reviewTaskId || !usesOverlayDisclosurePattern()) { el.innerHTML=''; return; }
  const label = ITEMS[reviewTaskId]?.label || ASSESS_META[reviewTaskId]?.n || reviewTaskId;

function currentRailPhase() { return finalNoteOpen ? 'review' : desktopPhase; }

function capturePhaseRailTransition(nextPhase) {
  const fromPhase = currentRailPhase();
  if (fromPhase === nextPhase) return null;
  const positions = {};
  document.querySelectorAll('#phaseSpine .phase-section[data-phase-id]').forEach(section=>{
    positions[section.dataset.phaseId] = section.getBoundingClientRect().top;
  });
  return { fromPhase, nextPhase, positions };
}

function playPhaseRailTransition(motion) {
  if (!motion || window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
  const spine = document.getElementById('phaseSpine');
  if (!spine || typeof Element.prototype.animate !== 'function') return;
  const order = ['brief','visit','review'];
  const direction = Math.sign(order.indexOf(motion.nextPhase) - order.indexOf(motion.fromPhase)) || 1;
  spine.classList.add('phase-transitioning');
  spine.querySelectorAll('.phase-section[data-phase-id]').forEach(section=>{
    const priorTop = motion.positions[section.dataset.phaseId];
    if (priorTop == null) return;
    const delta = priorTop - section.getBoundingClientRect().top;
    if (Math.abs(delta) < 1) return;
    section.animate(
      [{transform:`translateY(${delta}px)`},{transform:'translateY(0)'}],
      {duration:305,easing:'cubic-bezier(.2,.88,.32,1)'}
    );
  });
  const body = spine.querySelector('.phase-section.active .phase-section-body');
  body?.animate(
    [{opacity:.5,transform:`translateY(${direction * 7}px)`},{opacity:1,transform:'translateY(0)'}],
    {duration:270,delay:40,easing:'cubic-bezier(.2,.88,.32,1)',fill:'both'}
  );
  window.setTimeout(()=>spine.classList.remove('phase-transitioning'),345);
}

function schedulePhaseRailTransition(motion) {
  if (!motion) return;
  requestAnimationFrame(()=>playPhaseRailTransition(motion));
}

function returnToVisitBottomFromReview() {
  const phaseMotion = capturePhaseRailTransition('visit');
  finalNoteOpen = false;reviewTaskId = null;reviewInlineTaskId = null;workspaceMode = 'visit';
  briefDetailId = null;signaturePanelOpen = false;signatureAcknowledged = false;legalExpanded = false;
  desktopPhase = 'visit';viewingBrief = false;selectedAssessmentId = null;canvasMode = 'live-conversation';
  activeSpySection = 'close';
  scrollSpySuppressUntil = Date.now() + 900;
  renderAll();
  schedulePhaseRailTransition(phaseMotion);
  requestAnimationFrame(()=>{
    const canvasScroll = document.querySelector('.canvas-scroll');
    if (canvasScroll) canvasScroll.scrollTop = Math.max(0,canvasScroll.scrollHeight-canvasScroll.clientHeight);
    renderAgendaPanel();
    renderScribeZone();

    requestAnimationFrame(()=>{
      const alList = document.querySelector('.al-list');
      if (alList) alList.scrollTop = Math.max(0, alList.scrollHeight - alList.clientHeight);
    });
  });
}

function setDesktopPhase(phase) {
  const phaseMotion = capturePhaseRailTransition(phase);
  if (phase === 'review') {
    briefDetailId = null;
    if (scribeState !== 'idle') {
      desktopPhase = 'review'; navView = 'review'; finalNoteOpen = false; renderAll(); return;
    }
    openSignWorkspace(phaseMotion);
    return;
  }
  finalNoteOpen = false; reviewTaskId = null; workspaceMode = 'visit';
  if (phase !== 'brief') briefDetailId = null;
  signaturePanelOpen = false; signatureAcknowledged = false; legalExpanded = false;
  desktopPhase = phase === 'brief' ? 'brief' : 'visit';
  navView = desktopPhase;
  viewingBrief = false;
  // Preserve open assessment across phase switches; only reset when no task is open
  if (canvasMode !== 'assessment-task') {
    selectedAssessmentId = null;
    canvasMode = 'live-conversation';
  }
  activeSpySection = selectedAssessmentId || (desktopPhase === 'brief' ? 'brief' : (orderedAssessmentIds()[0] || 'close'));
  renderAll();
  schedulePhaseRailTransition(phaseMotion);
  if (canvasMode !== 'assessment-task') requestAnimationFrame(()=>scrollToSection(activeSpySection));
}

function renderNavTabStrip() {
  const el = document.getElementById('navTabStrip');
  if (!el) return;
  const inReview = desktopPhase === 'review' || finalNoteOpen;
  const tabs = [
    { label: 'BRIEF',  active: !inReview && navView === 'brief', click: inReview ? "exitReviewToPhase('brief')" : 'navGoBack()' },
    { label: 'VISIT',  active: !inReview && navView !== 'brief', click: inReview ? "exitReviewToPhase('visit')" : 'navGoVisit()' },
    { label: 'REVIEW', active: inReview,                          click: 'navGoReview()' },
  ];
  el.innerHTML = tabs.map(t => {
    const cls = ['nav-tab', t.active ? 'ntab-active' : ''].filter(Boolean).join(' ');
    return `<button class="${cls}" onclick="${t.click}" aria-label="${t.label}"><span>${t.label}</span></button>`;
  }).join('');
}

// Assessment rows appended to the brief panel so there's content to scroll through.
// Clicking an assessment transitions directly to it (sets navView to visit as side effect via renderAll).
function buildBriefAssessmentRows() {
  const D = computeOD();
  let rows = `<div style="font-size:9.5px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:#9CA3AF;padding:12px 16px 4px;">This visit</div>`;
  D.gs.forEach(g => {
    g.items.forEach(it => {
      const effC = effectiveIconCode(it);
      const icon = (it.isHosp && effC !== 'done' ? AGENDA_ICONS.hosp : (AGENDA_ICONS[effC] || AGENDA_ICONS.q))();
      const muted = effC === 'done' ? ' muted' : '';
      const clk = it.id ? `navView='visit';selectAssessment('${it.id}')` : '';
      const briefNoteHTML = it.nt ? `<div class="al-note ${it.nc||'m'}">${it.nt}</div>` : '';
      const briefHospCls = it.isHosp && effC !== 'done' ? ' hosp-followup' : '';
      const briefCurCls = (effC === 'sel' || effC === 'curr' || effC === 'live') ? ' cur' : '';
      rows += `<div class="al-row${briefCurCls}${briefHospCls}" ${it.id ? `onclick="${clk}" tabindex="0" role="button" aria-label="${it.n}"` : ''}>
        ${icon}<div class="al-body"><div class="al-name${muted}">${it.n}</div>${briefNoteHTML}</div>
      </div>`;
    });
  });
  // Reconfirm row
  const reconDone = RECON_TASKS.every(t => !!reconStatus[t.id]);
  const reconAnyDone = RECON_TASKS.some(t => !!reconStatus[t.id]);
  const reconRemaining = RECON_TASKS.filter(t => !reconStatus[t.id]);
  const reconIcon = reconDone ? assessmentStatusIcon('done') : reconAnyDone ? assessmentStatusIcon('partial') : assessmentStatusIcon(null);
  const reconSub = reconDone ? 'All reconfirmed' : reconRemaining.slice(0,2).map(t => t.displayName||t.name).join(' · ');

// Fires navGoVisit after user reaches the true bottom of the brief list AND continues
// scrolling past it (wheel accumulation). Requires deliberate intent — no hair-trigger.
let _briefScrollOverrun = 0;
function attachBriefScrollTrigger() {
  const list = document.querySelector('.nav-brief-list');
  if (!list) return;
  _briefScrollOverrun = 0;
  function onScroll() {
    if (list.scrollTop + list.clientHeight < list.scrollHeight - 2) _briefScrollOverrun = 0;
  }
  function onWheel(e) {
    if (e.deltaY <= 0) { _briefScrollOverrun = 0; return; }
    const atBottom = list.scrollTop + list.clientHeight >= list.scrollHeight - 2;
    if (!atBottom) { _briefScrollOverrun = 0; return; }
    _briefScrollOverrun += Math.abs(e.deltaY);
    if (_briefScrollOverrun >= 100) {
      list.removeEventListener('scroll', onScroll);
      list.removeEventListener('wheel', onWheel);
      _briefScrollOverrun = 0;
      navGoVisit('scroll');
    }
  }
  list.addEventListener('scroll', onScroll, { passive: true });
  list.addEventListener('wheel', onWheel, { passive: true });
}

// Fires navGoBack when user wheels upward at the very top of the visit list.
function attachVisitScrollBack(list) {
  if (!list) return;
  list.addEventListener('wheel', (e) => {
    if (list.scrollTop === 0 && e.deltaY < 0) navGoBack('scroll');
  }, { passive: true });
}

  // ≤599px: mobileScribeBar already handles status — don't duplicate
  if (usesMobileSheetPattern()) return '';
  if (lifecycleState !== 'recording' || scribeState === 'idle') return '';
  // ≥900px: canvas column is visible and handles "now discussing" — don't show in nav
  if (window.innerWidth >= 900) return '';
  // Hide when canvas has an explicit task — user is working there
  const canvasHasTask = (canvasMode === 'assessment-task' && !!selectedAssessmentId) ||
    canvasMode === 'reconfirm' || canvasMode === 'optional-assessments' ||
    canvasMode === 'additional-topics' || canvasMode === 'visit-note' ||
    finalNoteOpen || (signaturePanelOpen && !signedState);
  if (canvasHasTask) return '';
  const paused = scribeState === 'paused';
  const contentReady = scribeContentDetected;
  const sig = contentReady && liveTopicId ? SIGNALS[liveTopicId] : null;
  const hasDisplayableTopic = scribeHasDisplayableTopic(contentReady, liveTopicId, sig);
  const wrapped = visitCloseReached && !liveTopicId;
  const topicLabel = wrapped ? 'Visit wrap-up' : hasDisplayableTopic ? (ITEMS[liveTopicId]?.label || liveTopicId) : null;
  const dot = paused ? '' : `<div style="width:6px;height:6px;border-radius:50%;background:#ef4444;flex-shrink:0;animation:rPulse 1.3s ease-in-out infinite;"></div>`;
  // scribe-now-body already enforces height:220px overflow:hidden — no layout shift as content loads
  const scribeBody = renderScribeFocusCanvas();
  return `<div class="narrow-scribe-slot">
    <div style="display:flex;align-items:center;gap:6px;padding:10px 16px 6px;min-width:0;">
      ${dot}
      <span style="font:750 10px/1 Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:${paused?'var(--fg-3)':'var(--danger)'};">${paused ? 'Paused' : 'Now discussing'}</span>
      ${topicLabel ? `<span style="font:600 13px/1.2 Inter,sans-serif;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;">${escapeHTML(topicLabel)}</span>` : ''}
    </div>
    <div class="narrow-scribe-content-well">${scribeBody}</div>
    <div style="height:1px;background:#ECEEF1;margin:8px 16px 0;"></div>
  </div>`;
}

function closeMobileScribeSheet() { mobileScribeOpen = false; renderMobileScribeSheet(); }

function renderAll() {
  renderGnavMobile();
  document.getElementById('sv')?.classList.toggle('recording-active', lifecycleState === 'recording');
  const workspace = document.querySelector('.visit-workspace');
  workspace?.classList.toggle('scribe-live', scribeState !== 'idle');
  workspace?.classList.toggle('scribe-content-ready', scribeState !== 'idle' && scribeContentDetected);
  workspace?.classList.toggle('scribe-content-entering', scribeState !== 'idle' && scribeContentEntering);
  workspace?.classList.toggle('scribe-compact', scribeState !== 'idle' && (!scribeExpanded || canvasMode === 'assessment-task'));
  workspace?.classList.toggle('sign-mode', finalNoteOpen && scrollDocMode);
  workspace?.classList.toggle('phase-brief', desktopPhase === 'brief' && !finalNoteOpen);
  workspace?.classList.toggle('phase-visit', desktopPhase === 'visit' && !finalNoteOpen);
  workspace?.classList.toggle('phase-review', desktopPhase === 'review' || finalNoteOpen);
  // v14: is-review expands nav; review-task-open shows canvas alongside for assessment detail
  const _outer = document.querySelector('.outer');
  const _inReview = desktopPhase === 'review' || finalNoteOpen;
  const _reviewTaskOpen = _inReview && (canvasMode === 'assessment-task' || canvasMode === 'visit-note' || canvasMode === 'reconfirm' || canvasMode === 'optional-assessments' || canvasMode === 'additional-topics' || lifecycleState === 'recording' || (signaturePanelOpen && !signedState) || signedState);
  _outer?.classList.toggle('is-review', _inReview);
  _outer?.classList.toggle('review-task-open', _reviewTaskOpen);
  // v14: canvas-col opens when an assessment task is open, sign/final-note is active, reconfirm is shown,
  // or user explicitly returned to the live scribe canvas view (scribeCanvasOpen)
  const _canvasOpen = (canvasMode === 'assessment-task' && !!selectedAssessmentId) ||
    canvasMode === 'reconfirm' ||
    canvasMode === 'optional-assessments' ||
    canvasMode === 'additional-topics' ||
    canvasMode === 'visit-note' ||
    finalNoteOpen ||
    (signaturePanelOpen && !signedState) ||
    (scribeCanvasOpen && lifecycleState === 'recording') ||
    canvasMode === 'brief';
  const _agendaOnly = !_canvasOpen && !_inReview && !recordOpen;
  const _mobileSheet  = usesMobileSheetPattern();
  _outer?.classList.toggle('record-full-width', !!(recordOpen && recordFullWidth && !_mobileSheet));
  // Auto-close ask when canvas is open and viewport narrows to where canvas would sheet over nav
  if (recordOpen && _canvasOpen && !_inReview && window.innerWidth < 900) {
    recordOpen = false;
  }
  // canvas-open: drives compact nav; also active in review when a task/note is open so nav compacts same as visit
  _outer?.classList.toggle('canvas-open', _canvasOpen && (!_inReview || _reviewTaskOpen));
  const _narrowThreshold = 900;
  const _canvasSheet = _canvasOpen && !_inReview && window.innerWidth >= 600 && window.innerWidth < _narrowThreshold;
  _outer?.classList.toggle('canvas-sheet', _canvasSheet);
  // ask-sheet: panel flows beside workspace at all widths (not just < 900px)
  const _askSheet = recordOpen && !_canvasOpen && !_inReview;
  _outer?.classList.toggle('ask-sheet', _askSheet);
  const _workspace = document.querySelector('.visit-workspace');
  const _navSlice  = document.querySelector('.nav-slice');
  const _canvasCol = document.querySelector('.canvas-col');
  _workspace?.classList.toggle('mobile-sheet-mode', _mobileSheet);
  const _transparentWorkspace = _agendaOnly || _mobileSheet;
  // Always cap workspace at 50vw in agenda-only mode so nav never sprawls full-width.
  // When record is open, right-align (flex-end) so Patient data stays at far right.
  const _capAgenda = _agendaOnly && !_mobileSheet;
  const _capReview = _inReview && !_reviewTaskOpen && !_mobileSheet; // compact workspace when review has no task open
  const _constrainAgenda = _capAgenda && !recordOpen;
  // Center normally; switch to flex-start when ask panel is open so the workspace+panel fill left→right.
  if (_outer) _outer.style.justifyContent = 'flex-start';
  if (_workspace) {
    _workspace.style.background   = _transparentWorkspace ? 'transparent' : '';
    _workspace.style.borderColor  = _transparentWorkspace ? 'transparent' : '';
    _workspace.style.boxShadow    = _transparentWorkspace ? 'none' : '';
    // Animate the collapse when entering capped-review (no task open) from full width
    const _willCap = _capAgenda || _capReview;
    const _wasCapped = _workspace.style.maxWidth !== '';
    if (_capReview && !_wasCapped) {
      _workspace.classList.add('ws-review-collapsing');
      setTimeout(() => _workspace?.classList.remove('ws-review-collapsing'), 520);
    }
    _workspace.style.maxWidth     = _willCap ? 'var(--agenda-width, 320px)' : '';
    _workspace.style.width        = _willCap ? 'auto' : '';
    // Review: task open → full width; no task → compact (same as agenda-only) so rows don't spread wide
    _workspace.style.flex         = (_inReview && !_reviewTaskOpen) ? '' : _inReview ? '1 1 auto' : _askSheet ? '1 1 auto' : '';
  }
  // When ask-sheet is active, drive the panel's width via inline style so it grows with the viewport.
  const _ctxSheet = document.getElementById('ctxSheet');
  if (_ctxSheet) {
    if (_askSheet) {
      _ctxSheet.style.flex     = '1 1 490px';
      _ctxSheet.style.minWidth = '390px';
      _ctxSheet.style.maxWidth = '50%';
      _ctxSheet.style.position = 'relative';
    } else {
      _ctxSheet.style.flex     = '';
      _ctxSheet.style.minWidth = '';
      _ctxSheet.style.maxWidth = '';
      _ctxSheet.style.position = '';
    }
  }
  const _wsBody = document.querySelector('.ws-body');
  if (_wsBody) {
    _wsBody.style.background  = _transparentWorkspace ? 'transparent' : '';
    _wsBody.style.boxShadow   = _transparentWorkspace ? 'none' : '';
  }
  if (_navSlice) {
    // No card styling when the patient header has dropped off (≤767px visit-active → edge-to-edge)
    const _navCard = _agendaOnly && !_mobileSheet && !(document.body.classList.contains('visit-active') && window.innerWidth <= 767);
    _navSlice.style.borderRadius  = _navCard ? 'var(--radius)' : '';
    _navSlice.style.border        = _navCard ? '1px solid #dbe5ec' : '';
    _navSlice.style.boxShadow     = _navCard ? '0 2px 4px rgba(15,23,42,.04),0 10px 28px rgba(15,23,42,.055)' : '';
    _navSlice.style.width         = '';
  }
  if (_canvasCol) {
    const _shouldShowCanvas = _canvasOpen && !(_inReview && !_reviewTaskOpen);
    const _wasHidden = _canvasCol.style.display === 'none' || _canvasCol.style.display === '';
    _canvasCol.style.display = _shouldShowCanvas ? 'flex' : 'none';
    if (_shouldShowCanvas && _wasHidden) {
      // First appearance — play slide-in animation via class.
      _canvasCol.classList.add('canvas-entering');
      setTimeout(() => _canvasCol.classList.remove('canvas-entering'), 400);
    }
  }
  // Clear canvas back row — shown only when relevant context sets it
  const cbr = document.getElementById('canvasBackRow');
  if (cbr) cbr.innerHTML = '';
  renderNavTabStrip();    // BRIEF / VISIT / REVIEW tab strip
  renderNavScribeIsland(); // gradient fade only — buttons moved to header / float bar
  renderPhStartScribe();  // Start Scribe or compact recording state in patient header (≥768px)
  renderMobileFloatBar(); // Start Scribe + Ask floating buttons (≤767px)
  renderPhScribe();       // patient-header Scribe controls (no-op — #phScribe element absent)
  renderNsBrief();        // compact visit context at top of nav slice
  renderSSH();            // visit lifecycle state title (collapsed in scroll-doc mode)
  renderNdBadge();        // corner badge when disambiguating
  renderSignalPanel();    // topic chart — recording only
  renderScribeZone();     // no-op — scribe controls moved to nav island
  renderWsSign();         // retained as an empty compatibility surface; Review is inline
  renderCanvas();
  renderCanvasPositionNav(); // optional nearby-anchor orientation control
  renderCanvasFooter();   // persistent task controls, independent of assessment height
  renderReviewTaskLayer();// L2 task layer opened from the unified review section
  renderMobileAssessSheet();  // assessment detail sheet for mobile (≤767px)
  renderMobileScribeSheet();  // scribe canvas sheet for narrow mobile (≤599px)
  renderTabletAssessSheet();  // no-op: canvas-col now handles assessment display at all widths
  renderAgendaPanel();    // scroll-spy outline (or agenda list in recording)
  renderCtxSheet();       // integrated patient record, search, and Ask
  initRecordResizer();    // draggable/keyboard split; initialized once
  setupScrollSpy();       // attach scroll listener after canvas DOM is ready
  setupCanvasPositionKeyboardNavigation(); // Page Up/Down and Home/End share the same anchors
  setupPhaseScrollHandoff(); // scroll past Brief → Visit and Visit → Review
  setupAssessmentGlide(); // softly settle near full-height assessment boundaries
  requestAnimationFrame(syncAssessmentViewportHeight);
  if (scribeState === 'recording') startTimer(); else if (scribeState !== 'paused') stopTimer();
  if (scribeContentEntering) {
    window.setTimeout(()=>{
      scribeContentEntering = false;
      document.querySelector('.visit-workspace')?.classList.remove('scribe-content-entering');
    }, 560);
  }
}

let _resizeRaf;
let _lastBreakpoint = -1;
window.addEventListener('resize', () => {
  cancelAnimationFrame(_resizeRaf);
  _resizeRaf = requestAnimationFrame(() => {
    if (recordOpen && document.querySelector('.outer.canvas-open') && window.innerWidth < 900) {
      recordOpen = false;
      renderAll();
      return;
    }
    syncAssessmentViewportHeight();
    // Re-render when crossing a meaningful breakpoint so sheet/canvas states stay correct
    const w = window.innerWidth;
    const prev = _lastBreakpoint;
    const cur = w <= 599 ? 0 : w < 768 ? 1 : w < 900 ? 2 : w < 1100 ? 3 : 4;
    if (cur !== prev) { _lastBreakpoint = cur; renderAll(); }
  });
}, {passive:true});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    if (reviewTaskId) { event.preventDefault();closeReviewTask();return; }
    if (recordOpen) { event.preventDefault();requestCloseRecord();return; }
  }
  if (reviewTaskId && usesOverlayDisclosurePattern()) trapFocusIn(document.querySelector('.review-task-sheet'), event);
  else if (recordOpen && usesOverlayDisclosurePattern()) trapFocusIn(document.getElementById('ctxSheet'), event);
});

// ── Mobile merged nav — gnav shows patient name + scribe/ask icons ────
function handleGnavScribe() {
  if (scribeState === 'idle') startScribe();
  else if (scribeState === 'listening') pauseScribe();
  else if (scribeState === 'paused') resumeScribe();
}

function renderGnavMobile() {
  // Patient name + meta in gnav at ≤599px (gnav absorbs .ph)
  const title = document.getElementById('gnavPageTitle');
  if (title) {
    const nameEl = document.getElementById('phName');
    title.textContent = nameEl ? nameEl.textContent : 'Counterpart Assistant';
  }
  const metaEl = document.getElementById('gnavPhMeta');
  if (metaEl) {
    const phMeta = document.getElementById('phMeta');
    metaEl.textContent = phMeta ? phMeta.textContent.replace(/\s+/g, ' ').trim() : '';
  }
  // Scribe button state — transform to recording pill at ≤767px visit-active
  const scribeBtn = document.getElementById('gnavMobileScribe');
  if (!scribeBtn) return;
  const gnavControls = document.getElementById('gnavScribeControls');
  const askBtnEl = document.querySelector('.gnav-mobile-ask');
  const isNarrowVisit = window.innerWidth <= 767 && document.body.classList.contains('visit-active');

  if (isNarrowVisit && scribeState !== 'idle') {
    // Show recording controls pill; hide scribe button + ask button
    scribeBtn.style.display = 'none';
    if (askBtnEl) askBtnEl.style.display = 'none';
    if (gnavControls) {
      const paused = scribeState === 'paused';
      const dot = paused
        ? `<span style="width:7px;height:7px;border-radius:50%;background:#9ca3af;flex-shrink:0;display:inline-block;"></span>`
        : `<span style="width:7px;height:7px;border-radius:50%;background:#ef4444;flex-shrink:0;display:inline-block;animation:rPulse 1.5s ease-in-out infinite;"></span>`;
      const iconRound = (onclick, icon, label, bg='#f3f4f6', fg='#374151') =>
        `<button onclick="${onclick}" aria-label="${label}" title="${label}" style="width:32px;height:32px;border-radius:50%;border:none;background:${bg};color:${fg};display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">${icon}</button>`;
      const pauseBtn = paused ? iconRound('resumeScribe()', I.play, 'Resume') : iconRound('pauseScribe()', I.pause, 'Pause');
      const stopBtn = iconRound('stopScribe()', I.stop, 'End recording', '#fef2f2', '#dc2626');
      gnavControls.innerHTML = `
        <div style="display:flex;align-items:center;gap:5px;padding:0 10px;height:34px;border-radius:17px;background:${paused?'#f3f4f6':'#fff3f3'};border:1.5px solid ${paused?'#e5e7eb':'#fca5a5'};">
          ${dot}
          <span id="gnavScribeTimer" style="font-size:12px;font-weight:700;color:${paused?'#6b7280':'#dc2626'};font-variant-numeric:tabular-nums;min-width:32px;">${fmt(secs)}</span>
        </div>
        ${pauseBtn}${stopBtn}`;
      gnavControls.style.display = 'flex';
      gnavControls.style.alignItems = 'center';
      gnavControls.style.gap = '6px';
    }
  } else {
    // Idle: restore scribe + ask buttons, hide controls
    scribeBtn.style.display = '';
    if (askBtnEl) askBtnEl.style.display = '';
    if (gnavControls) gnavControls.style.display = 'none';
    scribeBtn.classList.remove('recording', 'paused');
    if (scribeState === 'listening') scribeBtn.classList.add('recording');
    else if (scribeState === 'paused') scribeBtn.classList.add('paused');
  }
  // Ask button active state
  if (askBtnEl) askBtnEl.classList.toggle('active', recordOpen);
}

// ── Global nav: inline search + menu panel ────────────────────────────
function openGnavSearch() {
  const gnav = document.getElementById('gnav');
  if (!gnav) return;
  gnav.classList.add('search-open');
  const input = document.getElementById('gnavSearchInput');
  if (input) { input.value = ''; input.focus(); }
  closeGnavMenu();
}

function closeGnavSearch() {
  const gnav = document.getElementById('gnav');
  if (gnav) gnav.classList.remove('search-open');
}

function toggleGnavMenu() {
  const panel = document.getElementById('gnavNavPanel');
  if (!panel) return;
  if (panel.classList.contains('open')) {
    closeGnavMenu();
  } else {
    // Position flyout below gnav at wider widths (robust against banners above)
    if (window.innerWidth >= 600) {
      const gnav = document.getElementById('gnav');
      if (gnav) panel.style.top = gnav.getBoundingClientRect().bottom + 'px';
    } else {
      panel.style.top = '';
    }
    panel.classList.add('open');
    document.getElementById('gnavNavOverlay')?.classList.add('open');
    document.getElementById('gnavHamburger')?.classList.add('active');
    closeGnavSearch();
  }
}

function closeGnavMenu() {
  document.getElementById('gnavNavPanel')?.classList.remove('open');
  document.getElementById('gnavNavOverlay')?.classList.remove('open');
  document.getElementById('gnavHamburger')?.classList.remove('active');
}

// Close flyout on outside click
document.addEventListener('click', function(e) {
  const panel = document.getElementById('gnavNavPanel');
  const hamburger = document.getElementById('gnavHamburger');
  if (!panel?.classList.contains('open')) return;
  if (!panel.contains(e.target) && !hamburger?.contains(e.target)) closeGnavMenu();
});

// Close on Escape (additive — doesn't conflict with existing Escape handler)
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  closeGnavSearch();
  closeGnavMenu();
});

// init — show Schedule, then Preset 0 (Ready) is used when entering visit
renderSchedList();
renderSchedDetail();
</script>
