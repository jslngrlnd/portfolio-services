function reviewL1FooterState(id) {
  if (!reviewTaskId || usesMobileDisclosurePattern()) return null;
  const queue = reviewAssessmentQueueIds();
  const index = Math.max(0,queue.indexOf(id));
  const next = nextReviewItemAfter(id);
  return {queue,index,next};
}

function assessmentMaxStep(id) {
  if (id === 'copd') return 4;
  if (['hfref','ckd','htn','dm'].includes(id)) return 2;
  return 1;
}

function renderTaskActionBar(id) {
  const optional = gapIds().includes(id) || id === 'close';
  const reviewFooter = reviewL1FooterState(id);
  const maxStep = assessmentMaxStep(id);
  // Compute next-section label for confirm button (visit phase, no review layer)
  const nextSection = !reviewFooter ? nextCanvasSectionAfter(id) : null;
  const confirmLabel = reviewFooter
    ? (reviewFooter.next ? 'Confirm &amp; next' : id === 'close' ? 'Mark reviewed' : 'Confirm')
    : id === 'close' ? 'Mark reviewed'
    : nextSection === 'review' ? 'Next: Review &amp; sign'
    : nextSection === 'reconfirm' ? 'Next: Reconfirm'
    : nextSection === 'optional' ? 'Next: Optional assessments'
    : nextSection ? `Next: ${escapeHTML(ITEMS[nextSection]?.label || nextSection)}`
    : 'Confirm';
  const kebabMenu = kebabOpenId === id ? `<div class="assessment-kebab-menu" onclick="event.stopPropagation()">
    <button onclick="kebabOpenId=null;renderAll();">Add note to assessment</button>
    <button onclick="kebabOpenId=null;renderAll();">Flag for follow-up</button>
    ${optional ? '' : `<button onclick="kebabOpenId=null;renderAll();">Skip for this visit</button>`}
    <div class="kebab-divider"></div>
    <button class="destructive" onclick="kebabOpenId=null;selectedAssessmentId=null;canvasMode='live-conversation';renderAll();">Remove from visit</button>
  </div>` : '';
  const kebabBtn = `<button class="elders-round-btn" aria-label="More options" onclick="kebabOpenId=kebabOpenId==='${id}'?null:'${id}';renderAll();event.stopPropagation();" style="margin-left:-8px;flex-shrink:0;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
  </button>`;
  // Simplified footer for patient instructions
  if (id === 'close') {
    return `<div class="elders-sheet-footer" onclick="if(kebabOpenId){kebabOpenId=null;renderAll();}">
      ${kebabMenu}${kebabBtn}
      <button class="elders-btn-primary" onclick="confirmAssessmentById('close')">Done</button>
    </div>`;
  }
  if (!isResolved(id) && maxStep > 1 && taskStep < maxStep) {
    const backBtnHTML = taskStep > 1 ? `<button class="assessment-back-btn" onclick="taskStep--;renderAll()">Back</button>` : '';
    return `<div class="elders-sheet-footer" onclick="if(kebabOpenId){kebabOpenId=null;renderAll();}">
      ${kebabMenu}${kebabBtn}
      <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
        ${backBtnHTML}
        <button class="elders-btn-primary" onclick="taskStep++;decisions[selectedAssessmentId]={...(decisions[selectedAssessmentId]||{}),partial:true};renderAll()">Next</button>
      </div>
    </div>`;
  }
  if (!isResolved(id) && maxStep > 1 && taskStep >= maxStep) {
    const backBtnHTML = taskStep > 1 ? `<button class="assessment-back-btn" onclick="taskStep--;renderAll()">Back</button>` : '';
    return `<div class="elders-sheet-footer" onclick="if(kebabOpenId){kebabOpenId=null;renderAll();}">
      ${kebabMenu}${kebabBtn}
      <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
        ${backBtnHTML}
        <button class="elders-btn-primary" onclick="confirmAssessmentById('${id}')">${reviewFooter?.next ? 'Done &amp; next' : confirmLabel}</button>
      </div>
    </div>`;
  }
  const contextHTML = reviewFooter
    ? `<div class="elders-footer-context"><strong>Finish remaining</strong><span>${reviewFooter.index+1} of ${reviewFooter.queue.length} open assessments</span></div>`
    : optional ? `<div class="elders-footer-context">Optional care gap</div>`
    : '';
  const nextOpenBtn = reviewFooter?.next
    ? (reviewFooter.next === 'optional-assessments'
      ? `<button class="elders-btn-secondary review-l1-next" onclick="canvasMode='optional-assessments';optionalEditId=null;renderAll()">Optional assessments</button>`
      : `<button class="elders-btn-secondary review-l1-next" onclick="focusReviewAssessment('${reviewFooter.next}')">Next open: ${escapeHTML(ITEMS[reviewFooter.next]?.label||reviewFooter.next)}</button>`)
    : '';
  return `<div class="elders-sheet-footer" onclick="if(kebabOpenId){kebabOpenId=null;renderAll();}">
    ${kebabMenu}${kebabBtn}
    ${contextHTML}
    ${nextOpenBtn}
    ${optional?`<button class="elders-btn-secondary" onclick="deferAssessment('${id}')">Defer</button>`:''}
    <button class="elders-btn-primary" onclick="confirmAssessmentById('${id}')">${confirmLabel}</button>
  </div>`;
}

function confirmAssessmentById(id) {
  const fromReviewLayer = !!reviewTaskId;
  // Capture canvas-visit state before confirmSelectedAssessment() fires returnAfterConfirm() and clears it
  const canvasVisitMode = !fromReviewLayer && canvasMode === 'assessment-task' && !scrollDocMode
    && lifecycleState !== 'recording' && desktopPhase !== 'review' && !finalNoteOpen;
  const nextForCanvas = canvasVisitMode ? nextCanvasSectionAfter(id) : null;
  selectedAssessmentId = id;
  confirmSelectedAssessment();
  if (canvasVisitMode) {
    if (nextForCanvas === 'review') {
      openReviewWithSignPanel();
    } else if (nextForCanvas === 'reconfirm') {
      canvasMode = 'reconfirm';
      selectedAssessmentId = null;
      renderAll();
    } else if (nextForCanvas === 'optional') {
      canvasMode = 'optional-assessments';
      optionalEditId = null;
      selectedAssessmentId = null;
      renderAll();
    } else {
      selectedAssessmentId = nextForCanvas;
      canvasMode = 'assessment-task';
      taskStep = 1;
      renderAll();
    }
    return;
  }
  advanceAfterTaskAction(id, fromReviewLayer);
}

function advanceAfterTaskAction(id, fromReviewLayer=false) {
  if (fromReviewLayer) {
    if (!usesMobileDisclosurePattern()) {
      const nextReview = nextReviewItemAfter(id);
      if (nextReview === 'reconfirm') {
        closeReviewTask();
        canvasMode = 'reconfirm'; reconfirmEditId = null;
        renderAll();
      } else if (nextReview === 'optional-assessments') {
        closeReviewTask();
        canvasMode = 'optional-assessments';
        optionalEditId = null;
        renderAll();
      } else if (nextReview === 'close') {
        closeReviewTask();
        selectAssessment('close');
      } else if (nextReview) {
        reviewTaskId = nextReview; selectedAssessmentId = nextReview; activeSpySection = nextReview;
        canvasMode = 'assessment-task'; renderAll();
        requestAnimationFrame(()=>{
          if (usesOverlayDisclosurePattern()) document.querySelector('.review-task-sheet')?.focus?.({preventScroll:true});
          else scrollToSection(nextReview, true);
        });
      } else {
        closeReviewTask();
      }
    }
    return;
  }
  if (lifecycleState === 'recording') {
    const nextLiveTask = orderedAssessmentIds().find(nextId=>nextId!==id && !isResolved(nextId));
    if (nextLiveTask) selectAssessment(nextLiveTask);
    else returnToLive();
    return;
  }
  if (desktopPhase === 'review' || finalNoteOpen) {
    const nextReview = nextReviewItemAfter(id);
    if (nextReview === 'reconfirm') {
      canvasMode = 'reconfirm'; reconfirmEditId = null; renderAll();
    } else if (nextReview === 'optional-assessments') {
      canvasMode = 'optional-assessments';
      optionalEditId = null;
      renderAll();
    } else if (nextReview === 'close') {
      selectAssessment('close');
    } else if (nextReview) {
      reviewTaskId = null;
      selectedAssessmentId = nextReview;
      canvasMode = 'assessment-task';
      taskStep = 1;
      renderAll();
    } else {
      reviewInlineTaskId = null;
      selectedAssessmentId = null;
      canvasMode = 'live-conversation';
      desktopPhase = 'review';
      activeSpySection = 'review';
      signaturePanelOpen = false;
      signatureAcknowledged = false;
      renderAll();
      requestAnimationFrame(()=>{
        scrollToSection('review', true);
      });
    }
    return;
  }
  if (canvasMode === 'assessment-task' && !scrollDocMode) {
    const next = nextCanvasSectionAfter(id);
    if (next === 'review') {
      if (lifecycleState === 'recording') {
        // Don't transition to review while scribe is active — return to live scribe canvas
        selectedAssessmentId = null; canvasMode = 'live-conversation'; renderAll();
        return;
      }
      openReviewWithSignPanel();
    } else if (next === 'reconfirm') {
      canvasMode = 'reconfirm';
      selectedAssessmentId = null;
      renderAll();
    } else if (next === 'optional') {
      canvasMode = 'optional-assessments';
      optionalEditId = null;
      selectedAssessmentId = null;
      renderAll();
    } else if (next) {
      selectedAssessmentId = next;
      taskStep = 1;
      renderAll();
    }
    return;
  }
  if (!scrollDocMode) return;
  const next = nextCanvasSectionAfter(id);
  if (next === 'review') openSignWorkspace();
  else activateAssessmentSection(next);
}

// Advance through the document after an inline completion while preserving
// direct agenda navigation. Review-layer tasks still return to Visit review.
function nextCanvasSectionAfter(id) {
  const auto = new Set(scenarioData().auto || []);
  const ordered = orderedAssessmentIds().filter(aid => !auto.has(aid));
  const index = ordered.indexOf(id);
  // Prefer assessments after the current position, then wrap to the start
  const afterCurrent = ordered.slice(index + 1).find(nextId => !isResolved(nextId));
  if (afterCurrent) return afterCurrent;
  const beforeCurrent = ordered.slice(0, index).find(nextId => !isResolved(nextId));
  if (beforeCurrent) return beforeCurrent;
  // All clinical assessments done — check reconfirm tasks before jumping to Review
  const hasOpenRecon = RECON_TASKS.some(t => !reconStatus[t.id]);
  if (hasOpenRecon) return 'reconfirm';
  return 'review';
}

// ── Scroll-spy functions ───────────────────────────────────

function orderedAssessmentIds() {
  const ids = assessmentIds();
  if (agendaOrderMode === 'stable') return ids;
  return [...ids.filter(id=>!isResolved(id)), ...ids.filter(id=>isResolved(id))];
}

function setAgendaOrderMode(mode) {
  agendaOrderMode = mode === 'remaining' ? 'remaining' : 'stable';
  const available = orderedAssessmentIds();
  if (desktopPhase === 'brief') activeSpySection = 'brief';
  else if (!available.includes(activeSpySection) && activeSpySection !== 'close') activeSpySection = available[0] || 'close';
  renderAll();
  if (lifecycleState !== 'recording') requestAnimationFrame(()=>scrollToSection(activeSpySection));
}

// All doc-section ids in display order for the current scenario.
function docSectionIds() {
  if (desktopPhase === 'brief' || desktopPhase === 'visit') return ['brief', ...orderedAssessmentIds(), 'close'];
  if (desktopPhase === 'review') {
    if (reviewTaskId && !usesOverlayDisclosurePattern()) return reviewAssessmentQueueIds();
    return ['review','review-needs','review-completed'];
  }
  return [];
}

function canvasPositionLabel(id) {
  const labels = {
    brief:'Brief', close:'Patient instructions', review:'Visit Note',
    'review-needs':'Work to finish',
    'review-completed':'Completed assessments'
  };
  return labels[id] || ITEMS[id]?.label || id;
}

function canvasPositionPreview(id) {
  const title = canvasPositionLabel(id);
  let status = '';
  let snippet = '';
  if (id === 'brief') {
    status = scenarioData().summary || '';
    snippet = scenarioData().brief || '';
  } else if (id === 'close') {
    status = isResolved('close') ? outcomeForId('close').label : 'Review, edit, and share instructions';
    snippet = 'Document any outstanding follow-up orders and patient instructions before signing.';
  } else if (id === 'review') {
    status = 'Optional — does not block signature';
    snippet = 'Add a free-text note to accompany the structured documentation before submitting to the EHR.';
  } else if (id === 'review-needs') {
    const n = computeSignStatus().unresolved.length;
    status = `${n} item${n !== 1 ? 's' : ''} need review`;
    snippet = 'Required assessments with unresolved decisions or incomplete ICD-10 codes.';
  } else if (id === 'review-completed') {
    status = 'Completed';
    snippet = 'Review confirmed decisions and ICD-10 codes before signing.';
  } else {
    if (isResolved(id)) {
      const out = outcomeForId(id);
      status = out.label + (out.code ? ` · ${out.code}` : '');
      snippet = ITEMS[id]?.detail || '';
    } else if (decisions[id]?.needsReview) {
      status = unresolvedReason(id);
      snippet = ITEMS[id]?.detail || '';
    } else {
      status = ITEMS[id]?.detail || '';
      snippet = '';
    }
  }
  return { title, status, snippet };
}

function goToCanvasPosition(id) {
  if (desktopPhase === 'review' || finalNoteOpen) {
    activateReviewSection(id);
    return;
  }
  const nextPhase = id === 'brief' ? 'brief' : 'visit';
  if (nextPhase !== desktopPhase) {
    const phaseMotion = capturePhaseRailTransition(nextPhase);
    desktopPhase = nextPhase;
    const workspace = document.querySelector('.visit-workspace');
    workspace?.classList.toggle('phase-brief', desktopPhase === 'brief');
    workspace?.classList.toggle('phase-visit', desktopPhase === 'visit');
    renderPhaseSpine();
    renderAgendaPanel();
    setupPhaseScrollHandoff();
    schedulePhaseRailTransition(phaseMotion);
  }
  scrollSpySuppressUntil = Date.now() + 520;
  scrollToSection(id);
  renderCanvasPositionNav();
}

function stepCanvasPosition(direction) {
  const ids = docSectionIds();
  if (!ids.length) return;
  let index = ids.indexOf(activeSpySection);
  if (index < 0) index = 0;
  const nextIndex = Math.max(0, Math.min(ids.length - 1, index + direction));
  if (nextIndex !== index) goToCanvasPosition(ids[nextIndex]);
}

function renderCanvasPositionNav() {
  const el = document.getElementById('canvasPositionNav');
  if (!el) return;
  const fullScribe = scribeState !== 'idle' && scribeExpanded && canvasMode !== 'assessment-task';
  const ids = docSectionIds();
  if (!scrollDocMode || fullScribe || briefDetailId || signaturePanelOpen || signedState || !ids.length) {
    el.className = 'canvas-position-nav is-hidden';
    el.innerHTML = '';
    return;
  }
  let activeIndex = ids.indexOf(activeSpySection);
  if (activeIndex < 0) activeIndex = 0;
  const gaps = gapIds();
  el.className = 'canvas-position-nav';
  el.innerHTML = `<div class="cpn-rail" role="navigation" aria-label="Section navigation">${
    ids.map((id, i) => {
      const isCurrent = i === activeIndex;
      const done = isResolved(id);
      const isGap = gaps.includes(id);
      const needsRev = !done && !!decisions[id]?.needsReview;
      const cls = isCurrent ? 'is-current' : done ? 'is-done' : isGap ? 'is-gap' : needsRev ? 'is-review' : '';
      const p = canvasPositionPreview(id);
      return `<button class="cpn-tick${cls ? ' '+cls : ''}" onclick="goToCanvasPosition('${id}')" aria-label="${p.title}${isCurrent?' (current)':''}, section ${i+1} of ${ids.length}"><div class="cpn-preview" role="tooltip"><div class="cpn-preview-title">${p.title}</div>${p.status ? `<div class="cpn-preview-status">${p.status}</div>` : ''}${p.snippet ? `<div class="cpn-preview-snippet">${p.snippet}</div>` : ''}</div></button>`;
    }).join('')
  }</div>`;
}

function setupCanvasPositionKeyboardNavigation() {
  if (canvasPositionKeyboardCleanup) { canvasPositionKeyboardCleanup(); canvasPositionKeyboardCleanup = null; }
  const canvasScroll = document.querySelector('.canvas-scroll');
  if (!canvasScroll || !scrollDocMode) return;
  const onKeyDown = event => {
    if (event.target.closest?.('input,textarea,select,button,[contenteditable="true"]')) return;
    if (!['PageUp','PageDown','Home','End'].includes(event.key)) return;
    event.preventDefault();
    const ids = docSectionIds();
    if (!ids.length) return;
    if (event.key === 'PageUp') stepCanvasPosition(-1);
    else if (event.key === 'PageDown') stepCanvasPosition(1);
    else goToCanvasPosition(event.key === 'Home' ? ids[0] : ids[ids.length - 1]);
  };
  canvasScroll.addEventListener('keydown', onKeyDown);
  canvasPositionKeyboardCleanup = () => canvasScroll.removeEventListener('keydown', onKeyDown);
}

// Spy nav item click — scrolls in ready state, shows detail in recording state.
function spyItemClick(id) {
  if (id === 'review') {
    openSignWorkspace();
    return;
  }
  if ((desktopPhase === 'brief' || desktopPhase === 'review' || finalNoteOpen) && id !== 'brief') {
    desktopPhase = 'visit';
    activeSpySection = id;
    selectAssessment(id);
    return;
  }
  if (viewingBrief && lifecycleState !== 'recording') {
    viewingBrief = false;
    renderCanvas();
    requestAnimationFrame(()=>scrollToSection(id));
    return;
  }
  if (briefDetailId && id !== 'brief' && lifecycleState !== 'recording') {
    briefDetailId = null;
    desktopPhase = 'visit'; activeSpySection = id;
    renderAll();
    requestAnimationFrame(()=>scrollToSection(id));
    return;
  }
  if (lifecycleState === 'recording' && scrollDocMode) {
    viewingBrief = false;
    selectedAssessmentId = (id === 'brief' || id === 'close') ? null : id;
    renderCanvas();
    renderSpyNav();
    return;
  }
  scrollToSection(id);
}

// Smooth-scroll the canvas to a named section and update the spy highlight.
function scrollToSection(id, instant=false) {
  const canvasScroll = document.querySelector('.canvas-scroll');
  const section = document.getElementById('doc-section-' + id);
  if (!canvasScroll || !section) return;
  const firstVisitId = orderedAssessmentIds()[0] || 'close';
  const phaseAnchorId = canvasScrollAnchorId(id,firstVisitId);
  const scrollTarget = phaseAnchorId ? (document.getElementById(phaseAnchorId) || section) : section;
  if (programmaticScrollCleanup) { programmaticScrollCleanup(); programmaticScrollCleanup = null; }
  activeSpySection = id;
  programmaticScrollTarget = id;
  // Keep the explicitly chosen anchor stable while smooth scrolling past
  // intermediate sections; the rail and position control should move once.
  scrollSpySuppressUntil = Date.now() + (instant ? 180 : 5000);
  renderAgendaPanel();
  renderScribeZone();
  renderCanvasPositionNav();
  const delta = scrollTarget.getBoundingClientRect().top - canvasScroll.getBoundingClientRect().top - 14;
  const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  const useInstant = instant || reducedMotion;
  let releaseTimer = null;
  const releaseProgrammaticScroll = event => {
    if (event?.type === 'scrollend') {
      const remaining = scrollTarget.getBoundingClientRect().top - canvasScroll.getBoundingClientRect().top - 14;
      if (Math.abs(remaining) > 6) return;
    }
    canvasScroll.removeEventListener('scrollend', releaseProgrammaticScroll);
    canvasScroll.removeEventListener('pointerdown', releaseProgrammaticScroll);
    if (releaseTimer) clearTimeout(releaseTimer);
    scrollSpySuppressUntil = 0;
    programmaticScrollCleanup = null;
    programmaticScrollTarget = null;
    activeSpySection = id;
    renderAgendaPanel();
    renderScribeZone();
    renderCanvasPositionNav();
  };
  canvasScroll.addEventListener('scrollend', releaseProgrammaticScroll);
  canvasScroll.addEventListener('pointerdown', releaseProgrammaticScroll, {once:true,passive:true});
  releaseTimer = setTimeout(releaseProgrammaticScroll, useInstant ? 220 : 3600);
  programmaticScrollCleanup = releaseProgrammaticScroll;
  canvasScroll.scrollBy({ top: delta, behavior: useInstant ? 'auto' : 'smooth' });
}

// Canonical assessment status language from "one prototype to rule them all":
// not started = dashed circle · partial = progress arc · done = outlined check
// active Scribe = microphone. Reused by the rail and assessment canvas.
function assessmentStatusIcon(state) {
  if (state === 'done') {
    return `<svg class="assessment-status-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <circle cx="9" cy="9" r="8.25" stroke="#A8ABE0" stroke-width="1.5"/>
      <path d="M5 9l2.5 2.5 5.5-5.5" stroke="#A8ABE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }
  if (state === 'partial') {
    return `<svg class="assessment-status-icon" width="18" height="18" viewBox="0 0 22 22" fill="none" aria-hidden="true">
      <circle cx="11" cy="11" r="9" stroke="#E0DDF0" stroke-width="1.5"/>
      <path d="M11 2 A9 9 0 1 1 3.72 16.29" stroke="#444AD3" stroke-width="1.5" stroke-linecap="round"/>
    </svg>`;
  }
  if (state === 'live') {
    return `<span class="assessment-status-icon assessment-status-mic" aria-hidden="true">${I.mic}</span>`;
  }
  return `<svg class="assessment-status-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
    <circle cx="9" cy="9" r="8.25" stroke="#C4C0D5" stroke-width="1.5" stroke-dasharray="3.5 2.5"/>
  </svg>`;
}

function assessmentStateForId(id) {
  if (lifecycleState === 'recording' && liveTopicId === id && !isResolved(id)) return 'live';
  if (isResolved(id)) return 'done';
  const d = decisions[id];
  if (d && (d.partial || d.needsReview || Object.keys(d).some(k => d[k] != null && k !== 'confirmed' && k !== 'deferred'))) return 'partial';
  return 'idle';
}

// Status icon for a spy nav item.
function spyStatusIcon(id) {
  if (id === 'review') {
    return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${computeSignStatus().canSign?'var(--ok)':'#8b929c'}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg>`;
  }
  if (id === 'brief') {
    return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4C0D5" stroke-width="1.8" stroke-linecap="round" style="flex-shrink:0"><path d="M14 3v4a1 1 0 001 1h4"/><path d="M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z"/></svg>`;
  }
  return assessmentStatusIcon(assessmentStateForId(id));
}

// Re-render just the spy nav items (cheap — avoids a full renderAll).
function renderSpyNav(suppressSelection=false, targetId='agendaL') {
  const el = document.getElementById(targetId);
  if (!el) return;
  const ids = [...orderedAssessmentIds(), 'close'];
  if (!suppressSelection && !ids.includes(activeSpySection)) activeSpySection = ids[0] || 'close';
  const items = ids.map(id => {
    const isActive = !suppressSelection && id === activeSpySection;
    const isDone   = isResolved(id);
    const label    = id === 'close' ? 'Patient instructions'
                   : (ITEMS[id]?.label || id);
    const sub      = id === 'close' ? 'Review, edit, and share instructions' : '';
    const rowSub = decisions[id]?.needsReview ? unresolvedReason(id) : sub;
    return `<button class="spy-item${isActive ? ' spy-active' : ''}${isDone ? ' spy-done' : ''}${id==='review'?' spy-review':''}"
      onclick="spyItemClick('${id}')">
      ${spyStatusIcon(id)}
      <span class="spy-label">
        <span class="spy-label-name">${label}</span>
        ${rowSub ? `<span class="spy-label-sub">${rowSub}</span>` : ''}
      </span>
    </button>`;
  }).join('');
  el.innerHTML = `<div class="spy-nav">${items}</div>`;
}

function renderReviewPhaseRail(targetId='agendaL') {
  const el = document.getElementById(targetId);
  if (!el) return;
  if (reviewTaskId && !usesOverlayDisclosurePattern()) {
    const queue = reviewAssessmentQueueIds();
    el.innerHTML = `<div class="review-l1-rail-head"><button onclick="closeReviewTask()">← Back to Review</button><span>${queue.length} remaining</span></div><div class="spy-nav">${queue.map(id=>`<button class="spy-item${id===reviewTaskId?' spy-active':''}" onclick="focusReviewAssessment('${id}')">${assessmentStatusIcon(assessmentStateForId(id))}<span class="spy-label"><span class="spy-label-name">${escapeHTML(ITEMS[id]?.label||id)}</span><span class="spy-label-sub">${escapeHTML(unresolvedReason(id))}</span></span></button>`).join('')}</div>`;
    return;
  }
  // sign panel open: fall through to normal review nav so assessments list stays visible
  if (signedState) {
    el.innerHTML = `<div class="spy-nav"><button class="spy-item spy-active spy-done"><span class="review-summary-icon">${assessmentStatusIcon('done')}</span><span class="spy-label"><span class="spy-label-name">Visit signed</span><span class="spy-label-sub">Submitted and closed</span></span></button></div>`;
    return;
  }
  const ICD_MAP = {hfref:'I50.22',ckd:'N18.4',htn:'I10',dm:'E11.9',eye:'Z01.00',mamm:'Z12.31',afib:'I48.91',close:'',
                   mdd:'F33.2',cirrhosis:'K70.30',aud:'F10.21'};
  // Clinical assessments (individual, gatekeep sign CTA)
  const clinIds = clinicalIds();
  const reqIds = requiredIds(); // ['htn','dm','ckd','copd'] — excludes auto items like hfref
  const clinUnresolved = reqIds.filter(id => !isResolved(id));  // only required items
  const clinDone = clinIds.filter(id => isResolved(id));  // all resolved clinical (incl auto) for Completed section
  // Reconfirm tasks (individual in review, also gatekeep sign CTA)
  const reconUnresolved = RECON_TASKS.filter(t => !reconStatus[t.id]);
  const reconDone = RECON_TASKS.filter(t => !!reconStatus[t.id]);
  const totalCount = reqIds.length + RECON_TASKS.length; // 4+3=7 required
  const doneCount = reqIds.filter(id => isResolved(id)).length + reconDone.length;
  function rvRow(id, resolved) {
    const item = ITEMS[id] || {label:id};
    const icd = ICD_MAP[id] || '';
    const iconState = resolved ? 'done' : assessmentStateForId(id);
    const isActive = selectedAssessmentId === id && canvasMode === 'assessment-task';
    const clickFn = resolved ? `openAssessmentInReview('${id}')` : `focusReviewAssessment('${id}')`;
    return `<button class="rv-assess-row${resolved?' rv-done':''}${isActive?' rv-active':''}" onclick="${clickFn}">
      ${assessmentStatusIcon(iconState)}
      <span class="rv-assess-name">${escapeHTML(item.label||id)}</span>
      ${resolved && icd ? `<span class="rv-icd-badge">${icd}</span>` : ''}
    </button>`;
  }
  function rvReconRow(task, resolved) {
    const icd = ICD_MAP[task.id] || '';
    const iconState = resolved ? 'done' : 'q';
    const clickFn = resolved ? '' : `canvasMode='reconfirm';reconfirmEditId='${task.id}';renderAll();`;
    return `<button class="rv-assess-row${resolved?' rv-done':''}" ${clickFn?`onclick="${clickFn}"`:''}>
      ${assessmentStatusIcon(iconState)}
      <span class="rv-assess-name">${escapeHTML(task.name)}</span>
      ${resolved && icd ? `<span class="rv-icd-badge">${icd}</span>` : ''}
    </button>`;
  }
  const emptyDashed = (msg) => `<div style="padding:10px 14px;background:#f9f9fb;border-radius:9px;border:1.5px dashed #D1D5DB;margin:4px 16px 8px;">
    <div style="font-size:11.5px;color:#9CA3AF;line-height:1.5;">${msg}</div>
  </div>`;
  let html = '';
  const hasUnresolved = clinUnresolved.length > 0 || reconUnresolved.length > 0;
  if (hasUnresolved) {
    html += `<div class="rv-section-label">Needs review</div>`;
    html += clinUnresolved.map(id => rvRow(id, false)).join('');
    html += reconUnresolved.map(t => rvReconRow(t, false)).join('');
  }
  // Additional topics rollup (always shown; no status icon since no CTA)
  if (ADHOC_ITEMS.length > 0 && lifecycleState !== 'ready') {
    const adhocRollupSub = ADHOC_ITEMS.length + ' item' + (ADHOC_ITEMS.length === 1 ? '' : 's');
    html += `<button class="rv-assess-row" onclick="canvasMode='additional-topics';renderAll();" style="cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round" flex-shrink="0" style="flex-shrink:0;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="rv-assess-name">Additional topics</span>
    </button>`;
  }
  if (doneCount > 0) {
    html += `<div class="rv-section-label" style="margin-top:8px;">Completed</div>`;
    html += clinDone.map(id => rvRow(id, true)).join('');
    html += reconDone.map(t => rvReconRow(t, true)).join('');
  }
  // Follow-up actions — patient instructions is the only optional item; referral details live in the canvas default view
  const piAvailable = lifecycleState !== 'ready';
  const piActive = selectedAssessmentId==='close'&&canvasMode==='assessment-task';
  html += `<div class="rv-section-label" style="margin-top:8px;">Follow-up and actions</div>`;
  if (piAvailable) {
    const piPreviewText = (patientInstructionsText || '').trim();
    const piPreview2 = piPreviewText ? piPreviewText.split('\n').slice(0, 2).join('\n') : '';
    html += `<button class="rv-assess-row${piActive?' rv-active':''}" onclick="selectAssessment('close')" title="Optional" style="flex-direction:column;align-items:flex-start;gap:5px;padding:10px 12px;">
      <div style="display:flex;align-items:center;gap:9px;width:100%;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${piActive?'var(--accent)':'#9CA3AF'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="rv-assess-name">Patient instructions</span>
      </div>
      ${piPreview2 ? `<div style="font-size:11.5px;color:#6B7280;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;text-align:left;">${escapeHTML(piPreview2)}</div>` : ''}
    </button>`;
  } else {
    html += emptyDashed('Patient instructions will appear here once scribing begins');
  }
  // Visit note — shown after scribing begins
  const hasNote = lifecycleState !== 'ready';
  const visitNoteActive = canvasMode === 'visit-note';
  html += `<div class="rv-section-label" style="margin-top:8px;">Visit note</div>`;
  if (hasNote) {
    const notePreview = 'Reason for visit: Follow-up visit for hypertension, diabetes, and CKD management. History of present illness: Sarah Johnson is a 62-year-old female presenting for chronic care follow-up.';
    const copyIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>`;
    html += `<div style="margin:0 0 4px;">
      <button class="rv-assess-row${visitNoteActive?' rv-active':''}" onclick="canvasMode='visit-note';renderAll();" style="flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px;">
        <div style="display:flex;align-items:center;gap:6px;width:100%;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${visitNoteActive?'var(--accent)':'#9CA3AF'}" stroke-width="1.8" stroke-linecap="round" style="flex-shrink:0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span style="font-size:12.5px;font-weight:600;color:${visitNoteActive?'var(--accent)':'#111827'};">Visit note</span>
          <span style="margin-left:auto;font-size:10.5px;color:#9CA3AF;font-weight:500;">${visitNoteDisposition==='sent'?'Sent to EHR':visitNoteDisposition==='reviewed'?'Reviewed':''}</span>
        </div>
        <div style="font-size:11.5px;color:#6B7280;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;text-align:left;">${escapeHTML(notePreview)}</div>
      </button>
    </div>`;
  } else {
    html += emptyDashed('Visit note will appear here once scribing begins');
  }
  const canSign = clinUnresolved.length === 0 && reconUnresolved.length === 0;
  const nextClin = clinUnresolved[0];
  const nextRecon = reconUnresolved[0];
  const ctaLabel = canSign ? 'Sign visit' : nextClin ? (ITEMS[nextClin]?.label || nextClin) : nextRecon ? nextRecon.name.split(',')[0] : 'Sign visit';
  const ctaClick = canSign ? 'openSignaturePanel()' : nextClin ? `focusReviewAssessment('${nextClin}')` : nextRecon ? `canvasMode='reconfirm';reconfirmEditId='${nextRecon.id}';renderAll();` : 'openSignWorkspace()';
  // Hide CTA while an assessment, note, or reconfirm is open — its own footer drives the flow
  const canvasTaskOpen = (canvasMode === 'assessment-task' && !!selectedAssessmentId)
    || canvasMode === 'visit-note'
    || canvasMode === 'reconfirm';
  const signFooter = `<div class="vc-review-section" style="margin-top:auto;flex-shrink:0;">
    <div class="vc-progress-row">
      <div class="vc-progress-track"><div class="vc-progress-fill" style="width:${totalCount > 0 ? Math.round(doneCount/totalCount*100) : 0}%"></div></div>
      <span class="vc-progress-label">${doneCount} of ${totalCount} required</span>
    </div>
    ${!canvasTaskOpen ? `<button class="vc-review-btn" onclick="${ctaClick}">${escapeHTML(ctaLabel)}</button>` : ''}
  </div>`;
  el.innerHTML = `<div class="rv-assess-list">${html}${signFooter}</div>`;
}

// Match each assessment's minimum height to the actual visible canvas rather
// than a capped approximation. Padding and card spacing are removed so the
// next assessment begins exactly at the following viewport.
function syncAssessmentViewportHeight() {
  const canvasScroll = document.querySelector('.canvas-scroll');
  if (!canvasScroll) return;
  const available = Math.max(420, canvasScroll.clientHeight - 28);
  canvasScroll.style.setProperty('--assessment-viewport-height', `${available}px`);
}

// Native proximity snapping lands too abruptly in this dense canvas. Instead,
// settle to a nearby assessment boundary with a cancellable eased glide. The
// small activation radius leaves normal reading/scrolling inside long cards.
function setupAssessmentGlide() {
  if (assessmentGlideCleanup) { assessmentGlideCleanup(); assessmentGlideCleanup = null; }
  if (assessmentGlideTimer) { clearTimeout(assessmentGlideTimer); assessmentGlideTimer = null; }
  if (assessmentGlideFrame) { cancelAnimationFrame(assessmentGlideFrame); assessmentGlideFrame = null; }
  assessmentGliding = false;

  const canvasScroll = document.querySelector('.canvas-scroll');
  // Visit and Review share the same gentle assessment handoff. The Brief owns
  // its separate deliberate phase boundary below.
  const phaseSupportsGlide = desktopPhase === 'brief' || desktopPhase === 'visit' || desktopPhase === 'review' || finalNoteOpen;
  if (!canvasScroll || !scrollDocMode || !phaseSupportsGlide || scribeState !== 'idle') return;

  const stopGlide = () => {
    if (assessmentGlideFrame) cancelAnimationFrame(assessmentGlideFrame);
    assessmentGlideFrame = null;
    assessmentGliding = false;
  };

  // Normal reading scroll remains native. At the end of the active Visit
  // card, a continued downward flick becomes an intentional handoff to the
  // next assessment.
  let endFlickIntent = 0;
  let endFlickTimer = null;
  let pointerInteracting = false;
  const onWheel = event => {
    stopGlide();
    const reviewMode = desktopPhase === 'review' || finalNoteOpen;
    const reviewL1 = reviewMode && !!reviewTaskId && !usesOverlayDisclosurePattern();
    if ((!reviewMode && desktopPhase !== 'visit') || event.deltaY <= 4 || Date.now() < phaseScrollCooldownUntil) {
      endFlickIntent = 0;
      return;
    }
    const selector = reviewL1 ? '.review-l1-document .doc-section.review-assessment' : reviewMode ? '.review-needs-section .review-inline-assessment' : '.doc-section.visit-assessment';
    const sections = Array.from(canvasScroll.querySelectorAll(selector));
    const viewport = canvasScroll.getBoundingClientRect();
    const currentIndex = reviewL1
      ? sections.findIndex(section=>section.dataset.assessmentId === reviewTaskId)
      : reviewMode
      ? sections.reduce((best,section,index)=>section.getBoundingClientRect().top <= viewport.top + 72 ? index : best,-1)
      : sections.findIndex(section => section.dataset.assessmentId === activeSpySection);
    const current = sections[currentIndex];
    const next = sections[currentIndex + 1];
    if (!current || !next) return;
    const card = current.getBoundingClientRect();
    const cardScroller = current.querySelector(reviewMode && !reviewL1 ? '.review-inline-card-scroll' : '.assessment-card-scroll');
    const contentAtEnd = !cardScroller
      || cardScroller.scrollTop + cardScroller.clientHeight >= cardScroller.scrollHeight - 3;
    const atCardEnd = card.bottom <= viewport.bottom + 42 && card.bottom > viewport.top + 40;
    if (!contentAtEnd || !atCardEnd) { endFlickIntent = 0; return; }
    event.preventDefault();
    endFlickIntent += Math.abs(event.deltaY);
    if (endFlickTimer) clearTimeout(endFlickTimer);
    endFlickTimer = setTimeout(()=>{ endFlickIntent = 0; }, 220);
    if (endFlickIntent < 58) return;
    endFlickIntent = 0;
    phaseScrollCooldownUntil = Date.now() + 520;
    if (reviewL1) {
      focusReviewAssessment(next.dataset.assessmentId);
    } else if (reviewMode) {
      reviewInlineTaskId = next.dataset.reviewAssessmentId;
      activeSpySection = 'review-needs';
      renderAgendaPanel();
      scrollReviewAssessmentIntoView(reviewInlineTaskId);
    } else {
      activeSpySection = next.dataset.assessmentId;
      renderAgendaPanel();
      renderScribeZone();
      renderCanvasFooter();
      scrollToSection(activeSpySection);
    }
  };

  const glideToNearest = () => {
    assessmentGlideTimer = null;
    if (assessmentGliding || pointerInteracting || Date.now() < scrollSpySuppressUntil) return;
    const reviewMode = desktopPhase === 'review' || finalNoteOpen;
    const reviewL1 = reviewMode && !!reviewTaskId && !usesOverlayDisclosurePattern();
    const sectionSelector = reviewL1
      ? '.review-l1-document .doc-section.review-assessment'
      : reviewMode
      ? '.review-needs-section .review-inline-assessment'
      : '.doc-section.visit-assessment';
    const sections = Array.from(canvasScroll.querySelectorAll(sectionSelector));
    if (!sections.length) return;
    const canvasTop = canvasScroll.getBoundingClientRect().top;
    let nearest = null;
    let distance = Infinity;
    sections.forEach(section => {
      const delta = section.getBoundingClientRect().top - canvasTop - 14;
      if (Math.abs(delta) < Math.abs(distance)) { nearest = section; distance = delta; }
    });
    const activationRadius = Math.min(96, canvasScroll.clientHeight * .18);
    if (!nearest || Math.abs(distance) < 3 || Math.abs(distance) > activationRadius) return;

    // Do not pull the first assessment back into place while the clinician is
    // deliberately scrolling upward toward the Brief. The phase boundary is
    // the one place where normal document navigation takes priority over snap.
    const firstVisitSection = reviewMode ? null : canvasScroll.querySelector('.doc-section.visit-assessment');
    if (firstVisitSection && nearest === firstVisitSection && distance > 0
      && canvasScroll.scrollTop < firstVisitSection.offsetTop - 14) return;

    const start = canvasScroll.scrollTop;
    const target = start + distance;
    if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) {
      canvasScroll.scrollTop = target;
      return;
    }
    const duration = Math.min(620, Math.max(440, 390 + Math.abs(distance) * 1.1));
    const startedAt = performance.now();
    assessmentGliding = true;
    const frame = now => {
      const progress = Math.min(1, (now - startedAt) / duration);
      const eased = progress < .5
        ? 4 * progress * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 3) / 2;
      canvasScroll.scrollTop = start + (target - start) * eased;
      if (progress < 1) {
        assessmentGlideFrame = requestAnimationFrame(frame);
      } else {
        assessmentGlideFrame = null;
        assessmentGliding = false;
      }
    };
    assessmentGlideFrame = requestAnimationFrame(frame);
  };

  const onScroll = () => {
    if (assessmentGliding || pointerInteracting) return;
    if (assessmentGlideTimer) clearTimeout(assessmentGlideTimer);
    assessmentGlideTimer = setTimeout(glideToNearest, 240);
  };
  const onPointerDown = () => { pointerInteracting = true; stopGlide(); };
  const onPointerUp = () => {
    if (!pointerInteracting) return;
    pointerInteracting = false;
    if (assessmentGlideTimer) clearTimeout(assessmentGlideTimer);
    assessmentGlideTimer = setTimeout(glideToNearest, 280);
  };
  canvasScroll.addEventListener('scroll', onScroll, {passive:true});
  canvasScroll.addEventListener('wheel', onWheel, {passive:false});
  canvasScroll.addEventListener('pointerdown', onPointerDown, {passive:true});
  window.addEventListener('pointerup', onPointerUp, {passive:true});
  window.addEventListener('pointercancel', onPointerUp, {passive:true});
  assessmentGlideCleanup = () => {
    canvasScroll.removeEventListener('scroll', onScroll);
    canvasScroll.removeEventListener('wheel', onWheel);
    canvasScroll.removeEventListener('pointerdown', onPointerDown);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);
    if (endFlickTimer) clearTimeout(endFlickTimer);
    if (assessmentGlideTimer) clearTimeout(assessmentGlideTimer);
    if (assessmentGlideFrame) cancelAnimationFrame(assessmentGlideFrame);
    assessmentGlideTimer = null; assessmentGlideFrame = null; assessmentGliding = false;
  };
}

// Attach a scroll listener to the canvas-scroll container that updates the spy highlight.
function setupScrollSpy() {
  if (scrollSpyObserver) { scrollSpyObserver.disconnect(); scrollSpyObserver = null; }
  if (!scrollDocMode) return;
  const canvasScroll = document.querySelector('.canvas-scroll');
  if (!canvasScroll) return;

  function onScroll() {
    if (programmaticScrollTarget || Date.now() < scrollSpySuppressUntil) return;
    const sections = Array.from(canvasScroll.querySelectorAll('.doc-section'));
    if (!sections.length) return;
    const containerTop = canvasScroll.getBoundingClientRect().top;
    const triggerY     = containerTop + canvasScroll.clientHeight * 0.30;
    let current = sections[0].id.replace('doc-section-', '');
    for (const sec of sections) {
      if (sec.getBoundingClientRect().top <= triggerY) {
        current = sec.id.replace('doc-section-', '');
      }
    }
    if (current !== activeSpySection) {
      activeSpySection = current;
      if (reviewTaskId && !usesOverlayDisclosurePattern() && desktopPhase === 'review') {
        reviewTaskId = current;
        selectedAssessmentId = current;
        sections.forEach(sec=>{
          if (!sec.classList.contains('review-assessment')) return;
          const active = sec.dataset.assessmentId === current;
          sec.classList.toggle('assessment-expanded', active);
          sec.classList.toggle('assessment-condensed', !active);
        });
      }
      if (!finalNoteOpen && ['brief','visit'].includes(desktopPhase)) {
        const nextPhase = current === 'brief' ? 'brief' : 'visit';
        if (nextPhase !== desktopPhase) {
          const phaseMotion = capturePhaseRailTransition(nextPhase);
          desktopPhase = nextPhase;
          const workspace = document.querySelector('.visit-workspace');
          workspace?.classList.toggle('phase-brief', desktopPhase === 'brief');
          workspace?.classList.toggle('phase-visit', desktopPhase === 'visit');
          renderPhaseSpine();
          renderAgendaPanel();
          setupPhaseScrollHandoff();
          schedulePhaseRailTransition(phaseMotion);
        }
      }
      if (desktopPhase === 'visit') {
        sections.forEach(sec=>{
          const id = sec.id.replace('doc-section-', '');
          if (!sec.classList.contains('visit-assessment')) return;
          sec.classList.toggle('assessment-expanded', id === current);
          sec.classList.toggle('assessment-condensed', id !== current);
        });
      }
      renderAgendaPanel();
      renderScribeZone();
      renderCanvasFooter();
      renderCanvasPositionNav();
    }
  }

  canvasScroll.addEventListener('scroll', onScroll, { passive: true });
  scrollSpyObserver = { disconnect: () => canvasScroll.removeEventListener('scroll', onScroll) };
}

// Phase scrolling is bidirectional and deliberately resistant to accidental
// trackpad gestures. It works from either the canvas or the active rail body.
function setupPhaseScrollHandoff() {
  if (phaseScrollCleanup) { phaseScrollCleanup(); phaseScrollCleanup = null; }
  if (phaseScrollIntentTimer) { clearTimeout(phaseScrollIntentTimer); phaseScrollIntentTimer = null; }
  phaseScrollIntent = 0; phaseScrollDirection = 0;
  const canvasScroll = document.querySelector('.canvas-scroll');
  if (!canvasScroll) return;
  const onWheel = event => {
    if (Date.now() < phaseScrollCooldownUntil || Math.abs(event.deltaY) < 2) return;
    const direction = event.deltaY > 0 ? 1 : -1;
    const firstVisitId = orderedAssessmentIds()[0] || 'close';
    const firstVisitSection = document.getElementById('doc-section-' + firstVisitId);

    // Let the whole Brief read naturally before handing off to Visit.
    if (desktopPhase === 'brief' && direction > 0 && firstVisitSection) {
      const handoffScroller = canvasScroll;
      const holdTop = Math.max(0, firstVisitSection.offsetTop - canvasScroll.clientHeight);
      const alreadyHolding = handoffScroller.scrollTop >= holdTop - 3;
      const crossingHold = handoffScroller.scrollTop + event.deltaY >= holdTop;
      if (alreadyHolding || crossingHold) {
        event.preventDefault();
        handoffScroller.scrollTop = holdTop;
        if (!alreadyHolding) { phaseScrollIntent = 0; phaseScrollDirection = 0; return; }
        phaseScrollIntent = 0; phaseScrollDirection = 0; phaseScrollCooldownUntil = Date.now() + 650;
        goToCanvasPosition(firstVisitId);
        return;
      }
    }

    const briefPaneScroller = event.target.closest?.('.brief-master-scroll,.brief-detail-body');
    const scroller = briefPaneScroller || canvasScroll;
    const atTop = scroller.scrollTop <= 3;
    const atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 3;
    // Don't advance phase via canvas wheel when an assessment task is open — the card
    // has its own inner scroll, so canvas-scroll.overflow:hidden makes atBottom always true.
    const taskIsOpen = canvasMode === 'assessment-task' && !!selectedAssessmentId;
    const canMoveBack = direction < 0 && atTop
      && (desktopPhase === 'visit' || desktopPhase === 'review')
      && !taskIsOpen;
    const canMoveForward = direction > 0 && atBottom
      && desktopPhase === 'visit'
      && !taskIsOpen;
    if (!canMoveBack && !canMoveForward) { phaseScrollIntent = 0;phaseScrollDirection = 0;return; }
    event.preventDefault();
    if (phaseScrollDirection !== direction) phaseScrollIntent = 0;
    phaseScrollDirection = direction;
    phaseScrollIntent += Math.abs(event.deltaY);
    if (phaseScrollIntentTimer) clearTimeout(phaseScrollIntentTimer);
    phaseScrollIntentTimer = setTimeout(()=>{ phaseScrollIntent = 0;phaseScrollDirection = 0; }, 420);
    const handoffThreshold = 280;
    if (phaseScrollIntent < handoffThreshold) return;
    phaseScrollIntent = 0; phaseScrollDirection = 0; phaseScrollCooldownUntil = Date.now() + 760;
    if (direction < 0) {
      if (desktopPhase === 'review') returnToVisitBottomFromReview();
      else if (desktopPhase === 'visit') setDesktopPhase('brief');
    } else {
      if (desktopPhase === 'visit') setDesktopPhase('review');
    }
  };
  canvasScroll.addEventListener('wheel', onWheel, {passive:false});
  // Nav-slice wheel: full scroll ladder brief ↔ visit ↔ review
  const navSlice = document.querySelector('.nav-slice');
  const onNavWheel = event => {
    if (Date.now() < phaseScrollCooldownUntil || Math.abs(event.deltaY) < 2) return;
    const inReview = desktopPhase === 'review' || finalNoteOpen;
    const inVisit  = desktopPhase === 'visit';
    const inBrief  = desktopPhase === 'brief' && !finalNoteOpen;
    // Accumulate intent for a directional scroll and fire action at threshold
    const navIntent = (dir, threshold, action) => {
      if (phaseScrollDirection !== dir) phaseScrollIntent = 0;
      phaseScrollDirection = dir;
      phaseScrollIntent += Math.abs(event.deltaY);
      if (phaseScrollIntentTimer) clearTimeout(phaseScrollIntentTimer);
      phaseScrollIntentTimer = setTimeout(()=>{ phaseScrollIntent = 0; phaseScrollDirection = 0; }, 420);
      if (phaseScrollIntent < threshold) return;
      phaseScrollIntent = 0; phaseScrollDirection = 0; phaseScrollCooldownUntil = Date.now() + 760;
      action();
    };
    // Scroll DOWN at bottom of brief → visit
    if (inBrief && event.deltaY > 0) {
      const briefList = document.querySelector('.nav-brief-list');
      const atBottom = !briefList || briefList.scrollTop + briefList.clientHeight >= briefList.scrollHeight - 10;
      if (!atBottom) return;
      event.preventDefault();
      navIntent(1, 80, () => setDesktopPhase('visit'));
      return;
    }
    // Scroll DOWN at bottom of visit agenda → review
    if (inVisit && event.deltaY > 0) {
      const alList = document.querySelector('.al-list');
      const atBottom = !alList || alList.scrollTop + alList.clientHeight >= alList.scrollHeight - 10;
      if (!atBottom) return;
      event.preventDefault();
      navIntent(1, 120, () => setDesktopPhase('review'));
      return;
    }
    // Scroll UP at top of visit agenda → brief
    if (inVisit && event.deltaY < 0) {
      const alList = document.querySelector('.al-list');
      const atTop = !alList || alList.scrollTop <= 3;
      if (!atTop) return;
      event.preventDefault();
      navIntent(-1, 120, () => setDesktopPhase('brief'));
      return;
    }
    // Scroll UP at top of review nav → visit
    if (inReview && event.deltaY < 0) {
      const rvList = document.querySelector('.rv-assess-list');
      const atTop = !rvList || rvList.scrollTop <= 3;
      if (!atTop) return;
      event.preventDefault();
      navIntent(-1, 120, () => returnToVisitBottomFromReview());
    }
  };
  if (navSlice) navSlice.addEventListener('wheel', onNavWheel, {passive:false});
  phaseScrollCleanup = () => {
    canvasScroll.removeEventListener('wheel', onWheel);
    if (navSlice) navSlice.removeEventListener('wheel', onNavWheel);
  };
}

// Brief and Visit share one continuous document. Review is mounted as the next
// phase, with boundary handoffs preserving the sense of one vertical journey.
function briefAgendaLabel(id) {
  const labels = {
    hfref:'HF decompensation',
    hf_stability:'HF stability',
    ckd:'CKD',
    dm:'Diabetes',
    htn:'Hypertension',
    copd:'COPD',
    afib:'Atrial fibrillation'
  };
  return labels[id] || ITEMS[id]?.label || id;
}

function renderBriefVisitAgenda() {
  const gaps = gapIds();
  const clinical = orderedAssessmentIds().filter(id => !gaps.includes(id));
  const cards = clinical.map(id => {
    const state = assessmentStateForId(id);
    return `<button class="brief-visit-card ${state}" onclick="activateAssessmentSection('${id}')" aria-label="Open ${escapeHTML(briefAgendaLabel(id))} in Visit">
      ${assessmentStatusIcon(state)}
      <span class="brief-visit-card-copy">
        <span class="brief-visit-card-name">${escapeHTML(briefAgendaLabel(id))}</span>
        <span class="brief-visit-card-detail">${escapeHTML(ITEMS[id]?.detail || '')}</span>
      </span>
      <span class="brief-visit-card-arrow" aria-hidden="true">›</span>
    </button>`;
  }).join('');
  const gapLabels = gaps.map(id => briefAgendaLabel(id));
  const gapRollup = gaps.length ? `<button class="brief-care-gap-rollup" onclick="activateAssessmentSection('${gaps[0]}')" aria-label="Open ${gaps.length} care gaps in Visit">
    <strong>${gaps.length} care gap${gaps.length===1?'':'s'}</strong><span> · ${gapLabels.map(escapeHTML).join(' · ')}</span>
  </button>` : '';
  return `<aside class="brief-visit-agenda" aria-label="This visit assessment agenda">
    <div class="brief-visit-kicker">This visit</div>
    <div class="brief-visit-count">${clinical.length} assessment${clinical.length===1?'':'s'}</div>
    <div class="brief-visit-copy">Select an assessment to continue in the Visit section.</div>
    <div class="brief-visit-cards">${cards}</div>
    ${gapRollup}
  </aside>`;
}

function renderScrollDocument() {
  if (desktopPhase === 'brief' && briefDetailId) return renderBriefSplitDocument();
  const ids = ['brief', ...orderedAssessmentIds(), 'close'];
  const firstVisitId = orderedAssessmentIds()[0] || 'close';
  const activeVisitId = ids.includes(activeSpySection) ? activeSpySection : firstVisitId;
  renderingDocSection = true;
  const sectionsHTML = ids.map(id => {
    const isFirst  = id === 'brief';
    const isClose  = id === 'close';
    const item     = ITEMS[id];
    const title    = isFirst ? 'Brief'
                   : isClose ? 'Patient instructions'
                   : (item?.label || id);
    const sub      = isFirst ? currentVisitOption().meta
                   : isClose ? 'Review, edit, and share instructions'
                   : (item?.detail || '');
    const resolved = !isFirst && isResolved(id);
    const badge    = resolved
      ? `<span class="doc-sec-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg> Done</span>`
      : '';

    const stepEl = !isFirst
      ? `<div class="doc-sec-step assessment-state" aria-label="${assessmentStateForId(id)}">${assessmentStatusIcon(assessmentStateForId(id))}</div>`
      : '';

    let body = '';
    if (isFirst) {
      body = `<div class="brief-review-aligned" onclick="handleBriefCardClick(event)">${renderBriefDocSection()}</div>`;
    } else {
      body = `<div class="assessment-card-scroll">${renderAssessmentTask(id)}</div>${renderTaskActionBar(id)}`;
    }

    const isOpen = !isFirst && id === activeVisitId;
    const assessmentClass = isFirst ? ' brief-card' : ` visit-assessment ${isOpen?'assessment-expanded':'assessment-condensed'}`;
    const phaseHeading = isFirst
      ? renderCanvasPhaseHeading('brief')
      : id === firstVisitId ? renderCanvasPhaseHeading('visit') : '';
    return `${phaseHeading}<section class="doc-section${assessmentClass}" id="doc-section-${id}" ${!isFirst?`data-assessment-id="${id}"`:''}>
      ${isFirst ? '' : `<div class="doc-sec-head" onclick="activateAssessmentSection('${id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();activateAssessmentSection('${id}')}">
        ${stepEl}
        <div class="doc-sec-titles">
          <div class="doc-sec-title">${title}</div>
          ${sub ? `<div class="doc-sec-sub">${sub}</div>` : ''}
        </div>
        ${badge}
      </div>`}
      <div class="doc-sec-body">${body}</div>
    </section>`;
  }).join('');
  renderingDocSection = false;
  return `<div class="phase-visit-document v11-continuous-visit-document">${sectionsHTML}</div>`;
}

function buildFollowUpItems() {
  const d = decisions;
  const items = [];
  if (d.eye && d.eye.action === 'refer') items.push({label:'Referral placed', detail:'Valley Eye Center · Diabetic retinopathy screening'});
  if (d.mamm && d.mamm.action === 'refer') items.push({label:'Referral placed', detail:'Mammogram screening · Breast Health Center'});
  if (isResolved('ckd') && d.ckd?.ref) items.push({label:'Nephrology referral', detail:'CKD management · post-hospitalization'});
  return items;
}

function renderReviewDocument() {
  const st = computeSignStatus();
  if (signedState) return `<div class="phase-review-document is-takeover">${renderSignedVisitCanvas()}</div>`;
  const reviewSections = docSectionIds();
  if (!reviewSections.includes(activeSpySection)) activeSpySection = 'review';
  const completedItems = [...st.workflowResolved, ...st.optional.filter(item=>item.resolved)];
  const remainingRows = st.unresolved.map(item=>`<button class="spy-item" onclick="openFromSign('${item.id}')">
    ${assessmentStatusIcon(assessmentStateForId(item.id)==='idle'?'partial':assessmentStateForId(item.id))}
    <span class="spy-label"><span class="spy-label-name">${escapeHTML(ITEMS[item.id]?.label||item.id)}</span><span class="spy-label-sub">${escapeHTML(unresolvedReason(item.id))}</span></span>
  </button>`).join('');
  const completedRows = completedItems.map(item=>{
    const outcome = outcomeForId(item.id);
    return `<button class="spy-item spy-done" onclick="editFromSign('${item.id}')">
      ${assessmentStatusIcon('done')}
      <span class="spy-label"><span class="spy-label-name">${escapeHTML(ITEMS[item.id]?.label||item.id)}</span><span class="spy-label-sub">${escapeHTML(outcome.label)}</span></span>
    </button>`;
  }).join('');
  const optionalOpen = st.optional.filter(item=>!item.resolved).length;
  const requiredDone = st.resolved.length;
  const requiredTotal = st.required.length;
  const progress = Math.round((requiredDone / Math.max(requiredTotal,1)) * 100);
  const remainingCard = `<section class="review-flex-card" id="doc-section-review-needs" aria-label="Work to finish">
    <div class="review-flex-card-head"><div><div class="review-flex-card-title">${st.unresolved.length?'Work to finish':'Ready to sign'}</div><div class="review-flex-card-sub">${st.unresolved.length?'Finish the required decisions below.':'All required assessment work is complete.'}</div></div><span class="review-flex-card-count${st.unresolved.length?' remaining':' complete'}">${st.unresolved.length?`${st.unresolved.length} remaining`:'Complete'}</span></div>
    <div class="review-work-progress"><div class="review-work-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><span style="width:${progress}%"></span></div><div class="review-work-progress-copy">${requiredDone} of ${requiredTotal} required assessments complete</div></div>
    <div class="review-flex-list"><div class="spy-nav">${remainingRows || `<div class="review-flex-empty"><strong>Required work is complete</strong><span>Use Sign &amp; submit when you are ready.</span></div>`}</div></div>
    ${optionalOpen?`<div class="review-flex-meta">${optionalOpen} optional care gap${optionalOpen===1?' remains':'s remain'} open and will not block signing.</div>`:''}
  </section>`;
  const completedCard = `<section class="review-flex-card" id="doc-section-review-completed" aria-label="Completed assessments">
    <div class="review-flex-card-head"><div><div class="review-flex-card-title">Completed assessments</div><div class="review-flex-card-sub">Confirmed determinations remain available to reopen.</div></div><span class="review-flex-card-count complete">${completedItems.length} complete</span></div>
    <div class="review-flex-list"><div class="spy-nav">${completedRows || `<div class="review-flex-empty"><strong>No completed assessments yet</strong><span>Completed work will collect here as decisions are confirmed.</span></div>`}</div></div>
  </section>`;
  return `<div class="phase-review-document review-flex-document">
    <div class="review-flex-grid">
      <aside class="review-flex-note" id="doc-section-review" aria-label="Visit note">${renderReviewVisitNote()}</aside>
      <main class="review-flex-stack">${remainingCard}${completedCard}</main>
    </div>
  </div>`;
}

function reviewAssessmentQueueIds() {
  const unresolvedRequired = orderedAssessmentIds().filter(id=>requiredIds().includes(id) && !isResolved(id));
  if (reviewTaskId && !unresolvedRequired.includes(reviewTaskId)) unresolvedRequired.unshift(reviewTaskId);
  return unresolvedRequired;
}

function renderReviewAssessmentDocument() {
  const queue = reviewAssessmentQueueIds();
  const current = queue.includes(reviewTaskId) ? reviewTaskId : queue[0];
  if (!current) return renderReviewDocument();
  reviewTaskId = current;
  selectedAssessmentId = current;
  activeSpySection = current;
  renderingDocSection = true;
  const sections = queue.map(id=>{
    const item = ITEMS[id] || {};
    const state = assessmentStateForId(id);
    const expanded = id === current;
    return `<section class="doc-section review-assessment ${expanded?'assessment-expanded':'assessment-condensed'}" id="doc-section-${id}" data-assessment-id="${id}">
      <div class="doc-sec-head" onclick="focusReviewAssessment('${id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();focusReviewAssessment('${id}')}">
        <div class="doc-sec-step assessment-state" aria-label="${state}">${assessmentStatusIcon(state)}</div>
        <div class="doc-sec-titles"><div class="doc-sec-title">${escapeHTML(item.label||id)}</div><div class="doc-sec-sub">${escapeHTML(unresolvedReason(id))}</div></div>
        <span class="review-l1-position">${queue.indexOf(id)+1} of ${queue.length}</span>
      </div>
      <div class="doc-sec-body"><div class="assessment-card-scroll">${renderAssessmentTask(id)}</div>${renderTaskActionBar(id)}</div>
    </section>`;
  }).join('');
  renderingDocSection = false;
  return `<div class="phase-review-document review-l1-document">
    <div class="review-l1-sequence">${sections}</div>
  </div>`;
}

function focusReviewAssessment(id) {
  if (id === 'hfref') { openAskToEncounter('enc-hosp-hf'); return; }
  reviewTaskId = null;
  // Toggle: clicking the same assessment in review closes it back to the default canvas
  if (selectedAssessmentId === id && (desktopPhase === 'review' || finalNoteOpen)) {
    selectedAssessmentId = null; canvasMode = 'live-conversation';
  } else {
    selectedAssessmentId = id; activeSpySection = id; canvasMode = 'assessment-task';
  }
  renderAll();
}

function openAssessmentInReview(id) {
  if (id === 'hfref') { openAskToEncounter('enc-hosp-hf'); return; }
  // Re-open for editing: un-confirm so the full task form renders (not the done-rollup card)
  if (decisions[id]?.confirmed) {
    decisions[id] = { ...decisions[id], confirmed: false, partial: true };
  }
  selectedAssessmentId = id; activeSpySection = id; canvasMode = 'assessment-task'; taskStep = 1;
  renderAll();
}

function activateAssessmentSection(id) {
  desktopPhase = 'visit'; briefDetailId = null; activeSpySection = id; selectedAssessmentId = null; canvasMode = 'live-conversation';
  scrollSpySuppressUntil = Date.now() + 520;
  renderCanvas(); renderAgendaPanel(); setupScrollSpy();
  requestAnimationFrame(()=>scrollToSection(id));
}

function activateReviewSection(id) {
  activeSpySection = id; selectedAssessmentId = null; canvasMode = 'live-conversation';
  scrollSpySuppressUntil = Date.now() + 520;
  renderCanvas(); renderAgendaPanel(); setupScrollSpy();
  requestAnimationFrame(()=>{
    scrollToSection(id);
    if (id === 'review-needs' && reviewInlineTaskId) scrollReviewAssessmentIntoView(reviewInlineTaskId);
  });
}

function goToReviewRailSection(id) {
  if (desktopPhase !== 'review' || !finalNoteOpen) {
    openSignWorkspace();
    requestAnimationFrame(()=>activateReviewSection(id));
    return;
  }
  activateReviewSection(id);
}

function scrollReviewAssessmentIntoView(id, instant=false) {
  const canvasScroll = document.querySelector('.canvas-scroll');
  const card = document.getElementById('review-inline-' + id);
  if (!canvasScroll || !card) return;
  const delta = card.getBoundingClientRect().top - canvasScroll.getBoundingClientRect().top - 14;
  const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  canvasScroll.scrollBy({top:delta,behavior:instant||reducedMotion?'auto':'smooth'});
}

function expandReviewAssessment(id) {
  if (reviewInlineTaskId === id) return;
  reviewInlineTaskId = id;
  activeSpySection = 'review-needs';
  selectedAssessmentId = null; canvasMode = 'live-conversation';
  renderAll();
  requestAnimationFrame(()=>{
    scrollToSection('review-needs', true);
    scrollReviewAssessmentIntoView(id);
  });
}

function copyReviewVisitNote(button) {
  navigator.clipboard?.writeText(reviewVisitNotePlainText());
  const original = button.innerHTML;
  button.textContent = '✓';
  button.setAttribute('aria-label', 'Copied');
  window.setTimeout(()=>{ button.innerHTML = original; button.setAttribute('aria-label', 'Copy note'); }, 1400);
}

function toggleReviewVisitNote() {
  reviewNoteCollapsed = !reviewNoteCollapsed;
  renderCanvas(); renderCanvasFooter(); setupScrollSpy(); setupAssessmentGlide();
  requestAnimationFrame(()=>scrollToSection('review', true));
}

function completeVisitNoteReview(disposition) {
  visitNoteDisposition = disposition === 'sent' ? 'sent' : 'reviewed';
  noteNeedsUpdate = false;
  signValidation = false;
  renderAll();
  requestAnimationFrame(()=>scrollToSection('review', true));
}

function sendVisitNoteToEhr() { completeVisitNoteReview('sent'); }

function renderUnifiedReviewSection() {
  return `<div class="review-overview">${renderReviewVisitNote()}</div>`;
}

function renderReviewProgressBlock() {
  const st = computeSignStatus();
  const requiredTotal = st.required.length;
  const requiredDone = st.resolved.length;
  const pct = Math.round((requiredDone / Math.max(requiredTotal,1)) * 100);
  const remaining = st.unresolved.length;
  const statusTitle = signedState ? 'Visit signed and closed' : st.canSign ? 'Ready to close' : 'Still working';
  const statusCopy = signedState
    ? 'Documentation and attestation are complete. This visit is now closed.'
    : st.canSign
      ? 'All required work is complete. Review the attestation, then sign and close the visit.'
      : `${requiredDone} of ${requiredTotal} required items complete`;
  const statusPill = signedState ? 'Closed' : st.canSign ? 'Ready' : `${remaining} remaining`;
  return `<div class="review-progress-block"><div class="review-modern-status"><div class="review-modern-top"><div><div class="review-modern-title">${statusTitle}</div><div class="review-modern-copy">${statusCopy}</div></div><span class="review-modern-pill${st.canSign||signedState?' ready':''}">${statusPill}</span></div><div class="review-modern-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${signedState?100:pct}"><span style="width:${signedState?100:pct}%"></span></div></div>
    ${st.canSign&&!signedState?`<div class="review-progress-action"><button class="btn-p" onclick="attemptSign()">Review and sign</button></div>`:''}</div>`;
}

function renderReviewSigningState() {
  const st = computeSignStatus();
  const content = `${signaturePanelOpen && st.canSign && !signedState ? renderSignaturePanel() : ''}${signedState ? `<div class="signing-success"><span>✓</span><span><strong>Visit signed and closed</strong><small>Dr. Emily Carter · Jun 26, 2026 at 10:30 AM</small></span></div>` : ''}`;
  return content ? `<div class="review-signing-zone">${content}</div>` : '';
}

}

function bcChild(opts) {
  // opts: { id, dot, name, detail, value, delta, deltaDir, time, hi, tag, tagCls }
  const right = [];
  if (opts.hi) right.push(`<span class="bc-hi">${opts.hi}</span>`);
  if (opts.value || opts.delta) {
    right.push(`<span class="bc-child-value-wrap">${opts.value?`<span class="bc-child-value">${opts.value}</span>`:''}${opts.delta?`<span class="bc-child-delta ${opts.deltaDir||''}">${opts.delta}</span>`:''}</span>`);
  }
  if (opts.time) right.push(`<span class="bc-child-time">${opts.time}</span>`);
  if (opts.tag) right.push(`<span class="bc-tag ${opts.tagCls||''}">${opts.tag}</span>`);
  return `<button class="bc-child${bcActiveCls(opts.id)}" onclick="openBriefDetail('${opts.id}')" aria-expanded="${bcExpanded(opts.id)}">
    <span class="bc-child-dot">·</span>
    ${opts.name?`<span class="bc-child-name">${opts.name}</span>`:''}
    ${opts.detail?`<span class="bc-child-detail">${opts.name?'— ':''}${opts.detail}</span>`:''}
    ${right.length?`<span class="bc-child-right">${right.join('')}</span>`:''}
  </button>`;
}

// ── renderWsSign ───────────────────────────────────────────
// Full-workspace Visit review takeover. A compact, scalable progress header and
// the unresolved work replace the visit canvas so the fastest path is also the
// intended path.
function renderWsSign() {
  const el = document.getElementById('wsSign');
  if (!el) return;
  // Review now stays inline in the normal canvas with the left rail intact.
  el.innerHTML = '';
  return;
  if (!finalNoteOpen || !scrollDocMode) { el.innerHTML = ''; return; }

  const st = computeSignStatus();
  const workflow = [
    ...st.workflow.map(a=>({
      id:a.id,resolved:a.resolved,
      label:ASSESS_META[a.id]?.n || ITEMS[a.id]?.label || a.id,
      detail:a.resolved ? outcomeForId(a.id).label : unresolvedReason(a.id),
    })),
    {id:'close',resolved:st.wrapDone,label:'Patient instructions',detail:st.wrapDone?'Reviewed with patient':'Review, edit, and share instructions'},
  ];
  const remaining = workflow.filter(item=>!item.resolved);
  const completedCount = workflow.length - remaining.length;
  const progressPct = Math.round((completedCount / Math.max(workflow.length, 1)) * 100);
  const next = remaining[0] || null;
  const optionalOpen = st.optional.filter(item=>!item.resolved);

  renderingDocSection = true;
  const reviewCards = remaining.map(item=>{
    const stepNumber = workflow.findIndex(step=>step.id===item.id)+1;
    return `<section class="doc-section review-doc-section" id="review-section-${item.id}">
      <div class="doc-sec-head"><div class="doc-sec-step">${stepNumber}</div><div class="doc-sec-titles"><div class="doc-sec-title">${item.label}</div><div class="doc-sec-sub">${item.detail}</div></div><span class="doc-sec-badge" style="color:var(--warn)">Needs review</span></div>
      <div class="doc-sec-body">${renderAssessmentTask(item.id)}${renderTaskActionBar(item.id)}</div>
    </section>`;
  }).join('');
  renderingDocSection = false;

  const headline = signedState ? 'Visit signed'
    : st.canSign ? 'Everything required is complete'
    : `${remaining.length} item${remaining.length===1?'':'s'} left before signing`;
  const supporting = signedState ? 'The visit note has been signed and submitted.'
    : st.canSign ? 'Review the assembled note, then sign the visit.'
    : 'Complete the remaining work below. Each decision returns here and advances the next item.';

  el.innerHTML = `<div class="review-takeover">
    <div class="review-takeover-head">
      <div class="review-takeover-top"><button class="ws-sign-return" onclick="closeFinalNote()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
        Back to visit
      </button><div class="ws-sign-title">Visit review</div></div>
      <div class="review-takeover-title">${headline}</div>
      <div class="review-takeover-sub">${supporting}</div>
      <div class="review-phase-progress" aria-label="${completedCount} of ${workflow.length} required steps complete">
        <div class="review-phase-track"><span style="width:${signedState?100:progressPct}%"></span></div>
        <div class="review-phase-count">${completedCount} of ${workflow.length} required complete</div>
      </div>
    </div>
    <div class="review-takeover-body">
      <main class="review-assessment-stack"><div class="review-assessment-intro"><div><div class="review-work-heading">${remaining.length?'Work that needs to be done':'Ready for final review'}</div>
        <div class="review-work-caption">${remaining.length?'Review the remaining assessments inline, then continue directly to signing.':'All blocking work is complete.'}</div></div>
        <div class="review-assessment-count">${remaining.length} required remaining · ${optionalOpen.length} optional open</div></div>
        ${remaining.length ? reviewCards : `<div class="review-ready-card"><div class="review-ready-title">Visit note assembled</div><div class="review-ready-copy">HFrEF, CKD, diabetes, hypertension, and patient instructions are ready for a final read. Optional care gaps can remain open without blocking signature.</div></div>`}
      </main>
    </div>
    <div class="review-takeover-footer"><div class="review-footer-status"><strong>${completedCount} of ${workflow.length}</strong> required steps complete</div>
      ${signedState
        ? `<button class="btn-p" disabled>Visit signed</button>`
        : next
          ? `<button class="btn-p" onclick="scrollReviewToItem('${next.id}')">Continue: ${next.label} ${I.arr}</button>`
          : `<button class="btn-p" onclick="attemptSign()">Sign visit ${I.arr}</button>`}
    </div>
  </div>`;
}

function scribeChartId(topicId, metricKey) { return `${topicId}::${metricKey}`; }

function lookupScribeChart(id) {
  const [topicId, metricKey] = id.split('::');
  const sig = SIGNALS[topicId];
  const metric = sig?.metrics?.find(item=>item.key===metricKey);
  return metric ? {topicId,metric} : null;
}

function toggleScribeChart(topicId, metricKey) {
  const id = scribeChartId(topicId, metricKey);
  if (pinnedScribeCharts.has(id)) pinnedScribeCharts.delete(id);
  else pinnedScribeCharts.add(id);
  renderScribeZone();
}

function renderScribeChartCard(topicId, metric) {
  const id = scribeChartId(topicId, metric.key);
  const pinned = pinnedScribeCharts.has(id);
  const color = metric.status === 'warn' ? '#d9091c' : '#007f61';
  return `<article class="scribe-chart-card${pinned?' is-pinned':''}"><div class="scribe-chart-head"><div><div class="scribe-chart-topic">${ITEMS[topicId]?.label||topicId}</div><div class="scribe-chart-key">${metric.key}</div></div><button class="scribe-chart-pin${pinned?' pinned':''}" aria-pressed="${pinned}" title="Keep this chart visible while Scribe continues listening" onclick="toggleScribeChart('${topicId}','${metric.key}')">${pinned?'Pinned':'Keep visible'}</button></div><div class="scribe-chart-value"><strong style="color:${color}">${metric.val}</strong><span>${metric.unit}</span></div><div class="scribe-chart-svg">${sparkSVG(metric.spark,260,82,color,metric.goalMax,metric.goalMin)}</div>${pinned?`<div class="scribe-chart-listening">Pinned · Scribe is still listening</div>`:''}</article>`;
}

function openConditionContext(id) {
  const scroll = document.querySelector('.canvas-scroll');
  conditionReturnScrollTop = scroll ? scroll.scrollTop : 0;
  conditionReturnReviewTaskId = reviewTaskId;
  reviewTaskId = null; conditionContextId = id; closeRecord(); renderAll();
}

function openHospitalizationContext() {
  desktopPhase = 'brief';
  openBriefDetail('hospitalization');
}

function openBriefDetail(id) {
  const master = document.querySelector('.brief-master-scroll');
  const outer = document.querySelector('.canvas-scroll');
  briefMasterScrollTop = master ? master.scrollTop : (outer?.scrollTop || briefMasterScrollTop);
  if (usesTabletDisclosurePattern()) { closeRecord();reviewTaskId = null; }
  briefDetailId = id;
  conditionContextId = null;
  desktopPhase = 'brief';
  activeSpySection = 'brief';
  renderAll();
  requestAnimationFrame(()=>{
    const nextMaster = document.querySelector('.brief-master-scroll');
    if (nextMaster) nextMaster.scrollTop = briefMasterScrollTop;
    document.querySelector('.brief-detail-pane')?.focus?.({preventScroll:true});
  });
}

function closeBriefDetail() {
  const master = document.querySelector('.brief-master-scroll');
  if (master) briefMasterScrollTop = master.scrollTop;
  briefDetailId = null;
  renderAll();
  requestAnimationFrame(()=>{
    const outer = document.querySelector('.canvas-scroll');
    if (outer) outer.scrollTop = briefMasterScrollTop;
  });
}

function askHospitalizationContext() {
  conditionContextId = null;
  recordDraft = 'What changed after the hospitalization?';
  recordOpen = true;
  renderAll();
  focusRecordComposer();
}

function closeConditionContext() {
  const returnTask = conditionReturnReviewTaskId;
  conditionContextId = null; conditionReturnReviewTaskId = null;
  if (returnTask) { reviewTaskId = returnTask; selectedAssessmentId = returnTask; canvasMode='assessment-task'; }
  renderAll();
  if (!returnTask) requestAnimationFrame(()=>{ const s=document.querySelector('.canvas-scroll'); if(s)s.scrollTop=conditionReturnScrollTop; });
}

function renderScribeFocusCanvas() {

  const hasDisplayableTopic = scribeHasDisplayableTopic(contentReady,liveTopicId,sig);
  const paused = scribeState === 'paused';
  const wrapped = visitCloseReached && !liveTopicId;
  const topicTitle = wrapped
    ? 'Visit wrap-up'
    : hasDisplayableTopic
      ? (ITEMS[liveTopicId]?.label || liveTopicId)
      : '';
  const canvasStatus = paused ? 'Paused' : 'Scribe listening';
  const chartMap = new Map();
  if (hasDisplayableTopic && sig?.metrics) sig.metrics.forEach(metric=>chartMap.set(scribeChartId(liveTopicId,metric.key),{topicId:liveTopicId,metric}));
  pinnedScribeCharts.forEach(id=>{ const found=lookupScribeChart(id); if(found) chartMap.set(id,found); });

  const remainingRequired = requiredIds().filter(id=>!isResolved(id)).length;

  const liveContent = wrapped
    ? `<p class="scribe-idle-sentence">Almost there — hypertension, reconfirm diagnoses, and patient instructions still need a look before signing.</p>`
    : !hasDisplayableTopic
      ? `<p class="scribe-idle-sentence">Scribe is active — speak naturally. Topics will be captured as the conversation unfolds.</p>`
      : `<div class="scribe-now-discussing-content"><div class="scribe-smart-visualizations" aria-label="Smart data visualizations">${renderScribeSmartDataDisplay(liveTopicId,chartItems)}</div>${scribeContentReady ? renderScribeNowSummary(tc?.synthesis||sig?.interpretation||'Conversation content will appear here as it is detected.',fmt(secs)) : ''}</div>`;
