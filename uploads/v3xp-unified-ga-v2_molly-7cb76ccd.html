/* ── Compact Brief layout (2026-08-20 redesign) ─────────────────────────── */
.brief-compact { padding: 22px 32px 28px; display: flex; flex-direction: column; gap: 16px; }
.bc-hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.bc-hdr-l { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.bc-title { font-size: 22px; font-weight: 800; color: var(--fg); letter-spacing: -.01em; line-height: 1.1; }
.bc-patient { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.bc-hdr-r { font-size: 13px; color: var(--fg-3); white-space: nowrap; padding-top: 5px; }
.bc-hdr-r a { color: var(--ok); text-decoration: none; border-bottom: 1px solid var(--ok); font-weight: 500; }
.bc-hdr-r a:hover { opacity: .85; }

.bc-since { background: #f2f3f6; border-radius: 8px; padding: 11px 14px; font-size: 13px; color: var(--fg); line-height: 1.5; }
.bc-since strong { font-weight: 700; margin-right: 2px; }
.bc-since .bc-dx { color: var(--danger); font-weight: 600; }
.bc-since .bc-sep { color: var(--fg-4); margin: 0 6px; }
.bc-since .bc-arrow-up { color: var(--danger); font-weight: 700; }

.bc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; }
.bc-row { grid-column: span 1; padding: 12px 0 10px; border-top: 1px solid var(--border); }
.bc-row.bc-full { grid-column: 1 / -1; }

.bc-row-hdr {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; background: none; border: none; padding: 3px 6px;
  margin: -3px -6px 0; width: calc(100% + 12px);
  font-family: inherit; text-align: left;
  border-radius: 6px;
  transition: background .12s ease;
}
.bc-row-hdr:hover { background: var(--accent-soft); }
.bc-row-hdr.active { background: var(--accent-mid); }

.bc-badge {
  width: 22px; height: 22px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.bc-badge.hosp { background: rgba(217,119,6,.15); color: #b45309; }
.bc-badge.visit { background: rgba(37,99,235,.12); color: #2563eb; }
.bc-badge.lab { background: rgba(220,38,38,.12); color: #dc2626; }
.bc-badge.med { background: rgba(5,150,105,.15); color: #047857; }

.bc-row-title { font-size: 15px; font-weight: 700; color: var(--fg); flex: 1; }
.bc-row-count { font-size: 13px; color: var(--fg-3); white-space: nowrap; }
.bc-row-count.none { color: var(--fg-4); }
.bc-row-count.warn { color: var(--danger); }

.bc-children { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 0 30px; }
.bc-child {
  display: flex; align-items: baseline; gap: 8px;
  background: none; border: none; padding: 3px 6px; margin: 0 -6px;
  border-radius: 5px; cursor: pointer; text-align: left; font-family: inherit;
  transition: background .12s ease;
}
.bc-child:hover { background: var(--accent-soft); }
.bc-child.active { background: var(--accent-mid); }
.bc-child-dot { color: var(--fg-4); font-size: 14px; line-height: 1; flex-shrink: 0; align-self: center; }
.bc-child-name { font-size: 14px; font-weight: 700; color: var(--fg); }
.bc-child-detail { font-size: 13px; color: var(--fg-3); flex: 1; min-width: 0; }
.bc-child-right { display: flex; align-items: center; gap: 8px; margin-left: auto; text-align: right; }
.bc-child-value-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.bc-child-value { font-size: 14px; font-weight: 700; color: var(--fg); white-space: nowrap; }
.bc-child-delta { font-size: 12px; color: var(--danger); font-weight: 500; white-space: nowrap; }
.bc-child-delta.up::before { content: "↑ "; }
.bc-child-delta.down::before { content: "↓ "; }
.bc-child-time { font-size: 13px; color: var(--fg-3); white-space: nowrap; }
/* Brief card in chat: compact, left-aligned, narrower fonts */
.brief-chat-card .bc-row { padding: 8px 0 6px; }
.brief-chat-card .bc-row-hdr { padding: 2px 0; border-radius: 4px; }
.brief-chat-card .bc-row-title { font-size: 12.5px; font-weight: 700; }
.brief-chat-card .bc-row-count { font-size: 11px; }
.brief-chat-card .bc-badge { width: 16px; height: 16px; font-size: 8.5px; }
.brief-chat-card .bc-children { margin-left: 22px; gap: 2px; }
.brief-chat-card .bc-child { padding: 2px 4px; margin: 0 -4px; align-items: center; }
.brief-chat-card .bc-child-name { font-size: 12px; }
.brief-chat-card .bc-child-detail { font-size: 11px; }
.brief-chat-card .bc-child-time { font-size: 11px; }
.brief-chat-card .bc-tag { font-size: 9px; padding: 1px 5px; }
.bc-hi { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 4px; background: rgba(220,38,38,.12); color: #dc2626; font-size: 10.5px; font-weight: 700; }
.bc-tag {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 2px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  flex-shrink: 0; align-self: center;
}
.bc-tag.new { background: rgba(5,150,105,.13); color: #047857; }
.bc-tag.dose { background: rgba(217,119,6,.15); color: #b45309; }
.bc-tag.held { background: #f2f3f6; color: var(--fg-3); }
.bc-tag.cont { background: #f2f3f6; color: var(--fg-3); }

/* Tighten inside brief split (detail-open) */
.brief-split-active .brief-compact { padding: 20px 22px 24px; }
.brief-split-active .bc-grid { grid-template-columns: 1fr; gap: 0; }
.brief-split-active .bc-title { font-size: 20px; }

@container (max-width: 900px) {
  .brief-compact { padding: 20px 22px 24px; }
  .bc-grid { grid-template-columns: 1fr; gap: 0; }
}
/* Brief canvas grid: 2-col by default, 1-col when viewport narrows */
.bc-grid-brief { grid-template-columns: 1fr 1fr; column-gap: 40px; }
@media (max-width: 860px) { .bc-grid-brief { grid-template-columns: 1fr; column-gap: 0; } }

/* ── Responsive collapsing behavior ─────────────────────────────────────────
   Breakpoints:
     ≥1100px  Desktop  — nav + canvas + optional record panel
     768–1099px Tablet — nav + canvas; Ask replaces canvas area
     ≤767px   Mobile  — nav fills workspace; assessment details as sheets
   ─────────────────────────────────────────────────────────────────────── */

/* Extend ctx-sheet bottom-sheet treatment to all mobile widths (≤767px).
   The <430px block already defines it; this catches 431–767px. */
@media (min-width:431px) and (max-width:767px) {
  .ctx-resizer { display:none !important; }
  .ctx-sheet:not(.is-closed) {
    position:absolute;z-index:100;left:0;right:0;top:auto;bottom:0;
    width:auto;flex-basis:auto;height:50%;min-height:120px;max-height:90%;
    border:0;border-radius:24px 24px 0 0;
    box-shadow:0 -16px 42px rgba(25,32,44,.2);
    animation:mobileSheetIn .38s cubic-bezier(.2,.75,.2,1) both;
  }
  .ctx-sheet.detent-full:not(.is-closed) { height:90%; }
  .ctx-drag-handle { display:flex; }
  .ctx-width-btn { display:none; }
}

/* Push layout override: when Patient data panel is open (record-open),
   it is always an inline flex sibling — never a bottom sheet, at any width.
   Higher specificity than the bottom-sheet rules above (3 classes vs 2). */
.outer.record-open .ctx-sheet:not(.is-closed) {
  position: static !important;
  height: auto !important; min-height: 0 !important; max-height: none !important;
  border-radius: var(--radius, 12px) !important;
  border: 1px solid #e2e8ee !important;
  box-shadow: 0 2px 4px rgba(15,23,42,.035), 0 8px 22px rgba(15,23,42,.045) !important;
  animation: patientDataPanelIn 280ms var(--ease) both !important;
}
/* At ≤430px there's no room to show inline — hide it */
@media (max-width:430px) {
  .outer.record-open .ctx-sheet { display: none !important; }
}

/* mobile-sheet-mode (applied by JS at ≤767px):
   nav expands to fill workspace; canvas is always hidden. */
.visit-workspace.mobile-sheet-mode .nav-slice {
  width:auto !important; flex:1 !important;
}
.visit-workspace.mobile-sheet-mode .phase-section-name { font-size:12.5px !important; font-weight:700 !important; }
.visit-workspace.mobile-sheet-mode .phase-section-summary,
.visit-workspace.mobile-sheet-mode .phase-section-count { display:block !important; }
.visit-workspace.mobile-sheet-mode .phase-section-body .spy-label-sub,
.visit-workspace.mobile-sheet-mode .phase-section-body .al-note { display:block !important; }
.visit-workspace.mobile-sheet-mode .ns-brief { display:block !important; }
.visit-workspace.mobile-sheet-mode .phase-section-body .spy-item,
.visit-workspace.mobile-sheet-mode .phase-section-body .al-row { padding:8px 10px !important; }
.visit-workspace.mobile-sheet-mode .phase-section-header { min-height:52px !important; }
.visit-workspace.mobile-sheet-mode .phase-section.phase-brief .phase-section-header { min-height:80px !important; }

/* ── Assessment bottom sheet (shared by mobile + tablet-left) ─────────── */
@keyframes assessSheetUp {
  from { transform:translateY(100%); }
  to   { transform:translateY(0); }
}
@keyframes assessSheetRight {
  from { transform:translateX(100%); }
  to   { transform:translateX(0); }
}
/* Layer: transparent, pointer-events:none so taps above the sheet fall
   through to agenda items. Only the sheet itself captures interaction. */
.mobile-assess-layer,
.tablet-assess-left-layer {
  display:none; position:absolute; inset:0; z-index:70;
  pointer-events:none;
}
.mobile-assess-layer.is-open,
.tablet-assess-left-layer.is-open { display:block; }
.mobile-assess-sheet,
.tablet-assess-left-sheet {
  position:absolute; bottom:0; left:0; right:0; max-height:78%;
  background:#fff; border-radius:20px 20px 0 0;
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 -3px 16px 2px rgba(0,0,0,.05),0 -5px 6px -3px rgba(0,0,0,.045),0 -9px 12px 1px rgba(0,0,0,.04);
  animation:assessSheetUp .3s cubic-bezier(.4,0,.15,1) both;
  pointer-events:auto;
}
/* Mobile assess sheet — patient header bar */
.mobile-assess-phbar { display:flex;align-items:center;gap:8px;padding:10px 12px 10px;border-bottom:1px solid #edf0f2;flex-shrink:0; }
.mobile-assess-phbar-menu { width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:#374151;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0; }
.mobile-assess-phbar-menu:hover { background:#f3f4f6; }
.mobile-assess-phbar-patient { flex:1;min-width:0; }
.mobile-assess-phbar-name { font-size:14px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.mobile-assess-phbar-meta { font-size:10.5px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3; }
.mobile-assess-phbar-actions { display:flex;align-items:center;gap:4px;flex-shrink:0; }
/* Mobile scribe status card in agenda (recording state) */
.mobile-scribe-bar { display:flex;align-items:center;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid #edf0f2;flex-shrink:0; }
.mobile-scribe-bar-status { font:750 10px/1 Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--danger);white-space:nowrap; }
.mobile-scribe-bar-topic { font:600 13px/1.3 Inter,sans-serif;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0; }
.narrow-scribe-slot { padding:0; }
.narrow-scribe-content-well { overflow:hidden; }
.narrow-scribe-content-well .scribe-now-section { margin:0; }
.narrow-scribe-content-well .scribe-now-body { padding:0 16px; height:140px; }
/* Hide scribe button text label on narrow mobile — icon only */
@media (max-width: 599px) { .gnav-scribe-label { display: none !important; } }
/* Hide gnav scribe+ask icons when the assess sheet is open — they're redundant */
body.assess-sheet-open .gnav-mobile-btn { display: none !important; }
/* Handle — 80px pill, matches showcase */
.mobile-assess-handle {
  width:80px; height:4px;
  background:#DADADA; border-radius:16px;
  margin:10px auto 0; flex-shrink:0;
  cursor:ns-resize; touch-action:none;
}
.mobile-assess-head {
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:8px 16px; min-height:44px; border-bottom:1px solid var(--border);
}
.mobile-assess-head-copy { flex:1; min-width:0; }
.mobile-assess-eyebrow {
  font-size:10px; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; color:#aaa; line-height:1.3;
}
.mobile-assess-title {
  font-size:16px; font-weight:700; letter-spacing:-.3px; color:var(--fg);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mobile-assess-close {
  display:inline-flex; align-items:center; justify-content:center;
  width:32px; height:32px; border-radius:50%; border:none;
  background:#F3F4F6; color:#6b7280; cursor:pointer; flex-shrink:0;
  transition:background .1s;
}
.mobile-assess-close:hover { background:#E5E7EB; }
.mobile-assess-body {
  flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column;
}
.mobile-assess-body .assessment-card-scroll { flex:1; min-height:0; overflow-y:auto; scrollbar-width:none; }
.mobile-assess-body .assessment-card-scroll::-webkit-scrollbar { display:none; }
.mobile-assess-body .task-actions,
.mobile-assess-body .elders-sheet-footer {
  flex-shrink:0;
  box-shadow:0 -1px 0 #ebebeb, 0 -4px 12px rgba(0,0,0,.05);
}

/* Tablet-ask-open class is no longer used; Ask panel is now absolute-right at all widths ≥431px. */

/* ── Scribe waiting / listening state ───────────────────────────── */
.scribe-waiting-full { display:flex; flex-direction:column; align-items:center; text-align:center; padding:40px 32px; }
.scribe-waiting-listen-label { margin-top:14px; font-size:14px; font-weight:650; color:var(--fg-2); }
.scribe-waiting-desc { margin-top:8px; font-size:13px; color:var(--fg-3); line-height:1.5; max-width:38ch; }
.scribe-waiting-topics { margin-top:24px; }
.scribe-waiting-topics-label { font-size:10px; font-weight:750; text-transform:uppercase; letter-spacing:.07em; color:var(--fg-4); margin-bottom:10px; }
.scribe-waiting-chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.scribe-waiting-chip { padding:5px 13px; border-radius:999px; background:var(--surface-2,#f1f3f6); font-size:12px; color:var(--fg-2); font-weight:500; }

/* ── Scribe + assessment combined canvas (desktop, recording) ────── */
/* When scribe is active and the user opens an assessment, show both stacked */
.scribe-assess-combo { display:flex; flex-direction:column; min-height:100%; }
.scribe-assess-combo-top .scribe-canvas-takeover { min-height:0; border-radius:16px 16px 0 0; }
.scribe-assess-combo-card {
  margin:0 22px 22px; border-radius:0 0 14px 14px; background:#fff;
  box-shadow:0 2px 8px rgba(25,32,44,.05),0 8px 24px rgba(25,32,44,.065);
  overflow:hidden; flex-shrink:0;
}
.scribe-assess-combo-head {
  display:flex; align-items:center; gap:8px;
  padding:10px 16px; border-bottom:1px solid var(--border-soft); min-height:44px;
}
.scribe-assess-combo-eyebrow {
  font-size:10.5px; font-weight:700; color:var(--fg-3);
  text-transform:uppercase; letter-spacing:.05em; flex-shrink:0;
}
.scribe-assess-combo-title { flex:1; font-size:14px; font-weight:650; color:var(--fg); min-width:0; }
.scribe-assess-combo-close {
  width:28px; height:28px; border:none; border-radius:7px; background:transparent;
  cursor:pointer; color:var(--fg-3); display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.scribe-assess-combo-close:hover { background:#f0f0f5; color:var(--fg); }

/* ── Scribe island: pinned to bottom of nav-slice ─────────────────── */
/* Scribe-frame at top of canvas-col is suppressed — controls now live in the nav island */
.scribe-frame { display:none !important; }

/* Island floats over the agenda list (positioned like showcase AlphaIsland).
   Agenda-l bottom padding prevents the last items from hiding behind it. */
/* Nav-scribe-island: gradient fade at bottom of nav, no buttons (moved to header/float bar) */
.nav-scribe-island {
  position:absolute; bottom:0; left:0; right:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:40px 16px 16px;
  background:linear-gradient(to bottom, rgba(248,250,252,0) 0%, #f8fafc 48%);
  pointer-events:none;
}
.nav-scribe-island > * { pointer-events:auto; }
/* padding-bottom removed — nav-scribe-island renders empty; no space needed */
/* Patient-header scribe slot: Start Scribe pill or compact recording state (≥768px only) */
.ph-start-scribe { display:none; flex-shrink:0; }
@media (min-width:480px) {
  .ph-start-scribe { display:flex; align-items:center; }
}
/* Below 480px: patient name overtakes — Ask moves to gnav; float bar suppressed by gnav redesign */
@media (max-width:479px) {
  #recordTrigger { display:none !important; }
}
/* ── Mobile floating action bar: Start Scribe + Ask, centered at bottom of .outer ── */
.mobile-float-bar {
  display:none;
}
@media (max-width:767px) {
  .mobile-float-bar {
    display:flex; align-items:center; gap:8px;
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    z-index:90; /* above content, below sheets (z-index:100) */
    pointer-events:auto; white-space:nowrap;
  }
}


/* ════════════════════════════════════════════════════════════
   GLOBAL NAV REDESIGN — light header, responsive
   Runs last; overrides all prior .gnav* rules
   ════════════════════════════════════════════════════════════ */
.gnav {
  flex-shrink: 0; height: 54px;
  background: #fff;
  box-shadow: 0 1px 0 var(--border);
  border-bottom: none;
  display: flex; align-items: center; gap: 0;
  padding: 0 16px 0 4px; position: relative; z-index: 100;
}
/* Visit surface: restore gradient gnav */
.gnav-hamburger {
  width: 40px; height: 40px; border-radius: 8px; border: none;
  background: transparent; color: #374151; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.gnav-hamburger:hover, .gnav-hamburger.active { background: #f3f4f6; color: #111827; }
.gnav-logo-mark {
  width: 26px; height: 26px; flex-shrink: 0; margin: 0 2px 0 0;
  display: flex; align-items: center; justify-content: center;
}
.gnav-wordmark-text {
  font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600;
  color: #1c1b1f; white-space: nowrap; flex-shrink: 0; letter-spacing: -0.01em;
}
.gnav-page-title {
  font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600;
  color: #111827; flex-shrink: 0; margin-left: 2px;
}
.gnav-actions-spacer { flex: 1; min-width: 8px; }
.gnav-action-btn {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: transparent; color: #6b7280; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.gnav-action-btn:hover { background: #f3f4f6; color: #111827; }
.gnav-username-label {
  font-size: 13px; font-weight: 500; color: #374151;
  white-space: nowrap; flex-shrink: 0;
}
.gnav-right-actions { display: flex; align-items: center; gap: 2px; }
.gnav-user-btn {
  width: auto; border-radius: 8px;
  padding: 0 8px 0 6px; gap: 4px;
}

/* ── Breakpoint visibility ── */
/* Wordmark text span never shows — 600-899px uses icon-only, ≥900px uses full SVG lockup */
.gnav-wordmark-text { display: none !important; }
/* At mobile: no logo at all. At 600-899px: icon only. At ≥900px: full lockup. */
@media (max-width: 599px)  { .gnav-logo-mark, .gnav-wordmark-text { display: none; } }
@media (max-width: 899px)  { .gnav-username-label { display: none; } }
/* At ≤599px: gnav absorbs patient header — hide right action group */
@media (max-width: 599px)  { .gnav-right-actions { display: none !important; } }

/* ── Patient block — shown in gnav at ≤599px when gnav absorbs .ph ── */
.gnav-patient-block { display: none; flex-direction: column; gap: 1px; min-width: 0; overflow: hidden; flex: 1; }
@media (max-width: 599px) { .gnav-patient-block { display: flex; } }
.gnav-page-title {
  font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600;
  color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gnav-ph-meta {
  font-size: 10.5px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
}

/* ── Mobile merged nav: gnav absorbs patient header ── */
/* Round icon buttons (scribe + ask) — hidden at ≥600px, shown at mobile */
.gnav-mobile-btn {
  display: none; width: 36px; height: 36px; border-radius: 50%; border: none;
  background: transparent; color: #444ad3; flex-shrink: 0;
  align-items: center; justify-content: center; cursor: pointer;
}
.gnav-mobile-btn:hover { background: #f0f0fd; }
.gnav-mobile-scribe.recording { background: #ef4444; color: #fff; }
.gnav-mobile-scribe.recording:hover { background: #dc2626; }
.gnav-mobile-scribe.paused { background: #f59e0b; color: #fff; }
.gnav-mobile-scribe.paused:hover { background: #d97706; }
.gnav-mobile-ask.active { background: #444ad3; color: #fff; }
/* gnav scribe+ask icon buttons: shown at ≤599px (where gnav absorbs the patient header) */
@media (max-width: 599px) {
  .gnav-mobile-btn { display: flex; }
  /* Absorb patient header into gnav — hide .ph, hide float bar */
  .ph { display: none !important; }
  .mobile-float-bar { display: none !important; }
  /* Full-width nav by default — canvas hidden, all content via sheets */
  .outer { padding: 0 !important; }
  .visit-workspace { border-radius: 0 !important; box-shadow: none !important; gap: 0 !important; }
  .ws-body { border-radius: 0 !important; box-shadow: none !important; }
  .nav-slice { width: 100% !important; flex: 1 1 auto !important; border-right: none !important; }
  .canvas-col { display: none !important; }
  /* Agenda list: edge-to-edge, full-width tap targets */
  .phase-section-body .al-row { padding:10px 14px !important; }
  .phase-section-body .al-name { font-size:13px !important; line-height:1.35 !important; }
  .phase-section-body .al-note { display:block !important; font-size:11px !important; }
  /* Visit nav header: hide at narrow — gnav absorbs patient context, no date/type header needed */
  #nsBrief { display: none !important; }
  /* Mobile scribe bar */
  .mobile-scribe-bar { padding:10px 14px !important; }
  /* Assessment sheet: full-screen at narrow mobile — slides in from the right */
  .mobile-assess-layer.is-open { position:fixed !important; inset:0 !important; z-index:1000 !important; display:flex !important; flex-direction:column; pointer-events:auto; background:transparent; }
  .mobile-assess-sheet { position:static !important; max-height:100% !important; flex:1; min-height:0; border-radius:0 !important; box-shadow:none !important; animation:assessSheetRight .28s cubic-bezier(.4,0,.2,1) both; }
  /* Hide drag handle on full-screen sheet */
  .mobile-assess-sheet .mobile-assess-handle { display:none; }
}
/* Scribe label: never shown (icon-only buttons in gnav) */
.gnav-scribe-label { display: none !important; }

/* ── Full logo lockup (≥900px) — make white SVG text dark for white gnav ── */
.gnav-logo-full {
  display: none; align-items: center; flex-shrink: 0; margin: 0 8px 0 4px;
}
.gnav-logo-full svg { height: 24px; width: auto; }
/* SVG wordmark paths use fill="white" — override to dark on white gnav */
.gnav-logo-full path[fill="white"] { fill: #1c2027; }
@media (min-width: 900px) {
  .gnav-logo-full { display: flex; }
  .gnav-logo-mark, .gnav-wordmark-text { display: none !important; }
}

/* ── Inline search (fills all available space between logo and action buttons) ── */
.gnav-search-inline {
  display: none; align-items: center; gap: 6px;
  flex: 1; min-width: 0;
}
.gnav-search-inline-input {
  flex: 1; min-width: 0; height: 34px;
  border: 1.5px solid #d1d5db; border-radius: 8px;
  padding: 0 12px; font-size: 13px; font-family: inherit;
  background: #f9fafb; outline: none; color: #111827;
}
.gnav-search-inline-input:focus {
  border-color: #6366f1; background: #fff;
  box-shadow: 0 0 0 3px rgba(99,102,241,.1);
}
.gnav-search-inline-input::placeholder { color: #9ca3af; }
.gnav-search-close-btn {
  width: 30px; height: 30px; border-radius: 50%; border: none;
  background: transparent; color: #6b7280; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.gnav-search-close-btn:hover { background: #f3f4f6; color: #374151; }

/* When search is open: show inline field; hide spacer so it fills to action buttons. Logo stays. */
.gnav.search-open .gnav-search-inline { display: flex; }
.gnav.search-open .gnav-patient-block,
.gnav.search-open .gnav-actions-spacer,
.gnav.search-open #gnavSearchTrigger { display: none !important; }

/* ── Account section in nav menu: hidden at ≥900px (visible in header) ── */
@media (min-width: 900px) {
  .gnav-account-section { display: none; }
}

/* ── Visit panel date header ── */
.al-visit-head {
  padding: 10px 14px 4px; display: flex; flex-direction: column; gap: 1px; flex-shrink: 0;
}
.al-visit-eyebrow {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
  color: var(--fg-3, #9ca3af);
}
.al-visit-date {
  font-size: 14px; font-weight: 700; letter-spacing: -.015em; color: var(--fg, #111827);
}
@media (max-width: 599px) {
  .al-visit-head { padding: 14px 16px 6px; }
  .al-visit-date { font-size: 19px; }
  .al-visit-eyebrow { font-size: 11px; }
}

/* ── Nav menu panel ── */
.gnav-nav-overlay {
  display: none; position: fixed; inset: 0; z-index: 149;
  background: rgba(0,0,0,0.4);
}
.gnav-nav-overlay.open { display: block; }
.gnav-nav-panel {
  position: fixed; z-index: 200; left: 0;
  background: #fff; border: 1px solid #e5e7eb;
  display: none; flex-direction: column;
  box-shadow: 0 8px 24px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
}
.gnav-nav-panel.open { display: flex; }

/* Mobile ≤599px: full-height left drawer */
@media (max-width: 599px) {
  .gnav-nav-panel {
    top: 0; bottom: 0; width: 272px;
    border-radius: 0; border: none; border-right: 1px solid #e5e7eb;
    box-shadow: 4px 0 24px rgba(0,0,0,.14);
    transform: translateX(-100%); transition: transform 0.22s ease;
  }
  .gnav-nav-panel.open { transform: translateX(0); }
}
/* ≥600px: flyout dropdown (top set by JS) */
@media (min-width: 600px) {
  .gnav-nav-panel { width: 244px; border-radius: 0 0 10px 10px; border-top: none; }
  .gnav-nav-overlay { display: none !important; }
}

/* Drawer header (mobile only) */
.gnav-drawer-header {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px; border-bottom: 1px solid #f0f0f3; flex-shrink: 0;
}
.gnav-drawer-logo { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; }
.gnav-drawer-title {
  font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600;
  color: #111827; flex: 1; letter-spacing: -0.01em;
}
.gnav-drawer-close-btn {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: transparent; color: #6b7280;
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
}
.gnav-drawer-close-btn:hover { background: #f3f4f6; color: #374151; }
@media (min-width: 600px) { .gnav-drawer-header { display: none; } }

/* Drawer search (mobile only) */
.gnav-drawer-search {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid #f0f0f3; flex-shrink: 0;
}
.gnav-drawer-search-icon { color: #9ca3af; display: flex; align-items: center; flex-shrink: 0; }
.gnav-drawer-search-input {
  flex: 1; border: none; outline: none; font-size: 14px;
  color: #111827; background: transparent; font-family: inherit;
}
.gnav-drawer-search-input::placeholder { color: #9ca3af; }
@media (min-width: 600px) { .gnav-drawer-search { display: none; } }

/* Nav items */
.gnav-nav-items { flex: 1; overflow-y: auto; padding: 6px 0; }
.gnav-nav-link {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 16px; font-size: 14px; font-weight: 500;
  color: #374151; cursor: pointer; border: none; background: transparent;
  width: 100%; text-align: left; font-family: inherit; line-height: 1.4;
}
.gnav-nav-link:hover { background: #f9fafb; color: #111827; }
.gnav-nav-link:hover .gnav-nav-link-icon { color: #444ad3; }
.gnav-nav-link-icon {
  width: 18px; height: 18px; color: #9ca3af; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}

/* Account section */
.gnav-account-section { border-top: 1px solid #f0f0f3; padding: 6px 0; flex-shrink: 0; }
.gnav-account-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
  color: #9ca3af; padding: 6px 16px 4px; display: block;
}

/* ── Schedule surface ──────────────────────────────────────────────── */
/* Schedule surface uses indigo accent to match Figma, scoped so the visit doesn't inherit it */
#sched { --accent: #4c52c6; --accent-soft: #f2f5fd; --fg-3: #726d83; --border: #d6d6e1; }
.sched-shell {
  display: flex; flex: 1; min-height: 0; overflow: hidden;
}
.sched-list-pane {
  width: 62%; min-width: 0; display: flex; flex-direction: column;
  border-right: 1px solid var(--border); background: var(--surface); overflow: hidden;
}
.sched-detail-pane {
  flex: 1; display: flex; flex-direction: column; background: var(--surface);
  overflow-y: auto;
}
.sched-list-header {
  display: flex; flex-direction: column; gap: 4px;
  padding: 8px 16px; background: #fff;
  flex-shrink: 0;
}
.sched-header-row1 { display: flex; align-items: center; justify-content: space-between; }
.sched-header-row2 { display: flex; align-items: center; justify-content: space-between; }
/* Left group: no gap — date picker wrapper provides its own padding */
.sched-title { font-size: 17px; font-weight: 700; color: #2b2933; display: flex; align-items: center; gap: 0; line-height: 21px; }
.sched-date-label { color: #4c52c6; font-size: 17px; font-weight: 400; cursor: pointer; line-height: 21px; }
/* Date picker wrapper: date text + 4px gap + calendar icon, 40px height, 8px L/R padding */
.sched-date-wrapper {
  display: flex; align-items: center; gap: 4px;
  height: 40px; padding: 0 8px; box-sizing: border-box;
}
.sched-cal-btn {
  width: 24px; height: 24px; padding: 0; flex-shrink: 0;
  background: none; border: none; cursor: pointer; color: #4c52c6;
  display: flex; align-items: center; justify-content: center;
}
.sched-header-actions { display: flex; align-items: center; gap: 8px; }
.sched-icon-btn {
  width: 36px; height: 36px; box-sizing: border-box;
  background: none; border: none; cursor: pointer; color: #2b2933;
  padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.sched-icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
.sched-scribe-header-btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 12px; border-radius: 8px; border: none;
  background: #4c52c6; color: #fff;
  font-size: 13px; font-weight: 500; line-height: 17px; cursor: pointer; white-space: nowrap;
}

.elders-radio-contained { display:flex; align-items:center; gap:8px; padding:12px; border:1px solid #ACA9BE; border-radius:12px; background:#FFFFFF; width:100%; text-align:left; cursor:pointer; box-sizing:border-box; }

.elders-radio-selected .elders-radio-circle { border-color:#444AD3; }
.elders-radio-inner { width:10px; height:10px; border-radius:50%; background:#444AD3; }
.dm-check-group { display:flex; flex-direction:column; gap:6px; padding-bottom:8px; }
.dm-radio-group { display:flex; flex-direction:column; gap:8px; }

/* ── Sched gnav block: "Visits Today [cal]" — merges into gnav at ≤599px ── */
.gnav-sched-block {
  display: none; align-items: center; gap: 4px; flex: 1; min-width: 0; overflow: hidden;
}
.gnav-sched-title {
  font-size: 15px; font-weight: 700; color: #111827; white-space: nowrap;
}
.gnav-sched-date {
  font-size: 15px; font-weight: 400; color: #4c52c6; white-space: nowrap; cursor: pointer;
}
.gnav-sched-cal-btn {
  width: 24px; height: 24px; border: none; background: transparent;
  color: #4c52c6; cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border-radius: 6px;
}
.gnav-sched-cal-btn:hover { background: #f3f4f6; }
/* Sched gnav action buttons */
.gnav-sched-actions {
  display: none; align-items: center; gap: 2px; flex-shrink: 0;
}
.gnav-sched-action-btn {
  width: 34px; height: 34px; border: none; background: transparent;
  color: #374151; cursor: pointer; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; flex-shrink: 0;
}
.gnav-sched-action-btn:hover { background: #f3f4f6; }
.gnav-sched-scribe-btn { background: #444ad3; border-radius: 50%; color: #fff; width: 38px !important; height: 38px !important; }
.gnav-sched-scribe-btn:hover { background: #3b41bb !important; }
.gnav-sched-add-btn { background: #eef0fd; border-radius: 50%; color: #4c52c6; }
/* At ≤599px with sched surface active: show sched gnav elements, hide visit ones */
@media (max-width: 599px) {
  body.sched-active .gnav-sched-block { display: flex; }
  body.sched-active .gnav-sched-actions { display: flex; }
  body.sched-active .gnav-patient-block { display: none !important; }
  body.sched-active .gnav-mobile-btn { display: none !important; }
  /* Spacer would push sched-block right — hide it so it stays left like patient-block on visit */
  body.sched-active .gnav-actions-spacer { display: none; }
  /* Header row1 moves into gnav — hide it at narrow sched */
  body.sched-active .sched-header-row1 { display: none !important; }
}

/* ── Mobile assess sheet: title block inside scroll body ──────────────── */
.mobile-assess-sheet-title {
  padding: 16px 20px 12px;
  border-bottom: 1px solid #f0f0f3;
  flex-shrink: 0;
}
/* Pill footer for mobile assess sheet (≤599px): full-width Back + Next */
@media (max-width: 599px) {
  .mobile-assess-body .elders-sheet-footer {
    padding: 12px 16px;
    gap: 8px;
  }
  .mobile-assess-body .elders-btn-primary,
  .mobile-assess-body .elders-btn-secondary {
    flex: 1; border-radius: 999px; text-align: center;
    padding: 11px 16px; font-size: 15px;
  }
  .mobile-assess-phbar {
    padding: 10px 12px !important;
    align-items: center;
  }
  .mobile-assess-phbar .mobile-assess-phbar-patient {
    display: flex; align-items: baseline; gap: 0;
    overflow: hidden;
  }
}

/* ── Responsive: grey-space elimination ───────────────────────────────────
   Default nav-only layout centers the workspace at 50% max-width, leaving
   grey space on both sides. Below 1100px, let the workspace fill the outer
   so side margins shrink to zero before the nav panel starts narrowing.    */
@media (max-width: 1100px) {
  .outer .visit-workspace {
    flex: 1 1 auto !important;
    max-width: 100% !important;
  }
}

/* ── gnav-mobile-btn fill circles (visit surface) ─────────────────────────
   Scribe: purple fill + white icon. Ask: light purple fill + purple icon.    */
.gnav-mobile-scribe { background: #444ad3 !important; color: #fff !important; }
.gnav-mobile-scribe:hover { background: #3b41bb !important; }
.gnav-mobile-scribe.recording { background: #ef4444 !important; color: #fff !important; }
.gnav-mobile-scribe.recording:hover { background: #dc2626 !important; }
.gnav-mobile-scribe.paused { background: #f59e0b !important; color: #fff !important; }
.gnav-mobile-scribe.paused:hover { background: #d97706 !important; }
.gnav-mobile-ask { background: #eef0fd !important; color: #444ad3 !important; }
.gnav-mobile-ask:hover { background: #dde1fc !important; }
.gnav-mobile-btn + .gnav-mobile-btn { margin-left: 6px; }
/* Ask selected: subtle border highlight, not filled primary-CTA */
.gnav-mobile-ask.active { background: #eef0fd !important; color: #444ad3 !important; box-shadow: inset 0 0 0 1.5px #444ad3 !important; }
.gnav-mobile-visit:hover { background: #e5e7eb !important; }
.gnav-mobile-visit { background: #f3f4f6 !important; color: #374151 !important; display: none; }
@media (max-width: 767px) { body.visit-active .gnav-mobile-visit { display: flex !important; margin-left: 10px !important; } }

/* Scribe/Ask label spans — hidden everywhere by default */
.gnav-scribe-label, .gnav-ask-label { display: none !important; }

/* 400–767px: pill-shaped labeled buttons for Scribe and Ask (circles only at ≤399px) */
@media (min-width: 400px) and (max-width: 767px) {
  .gnav-mobile-scribe, .gnav-mobile-ask {
    width: auto !important;
    border-radius: 20px !important;
    padding: 0 12px !important;
    height: 34px !important;
    gap: 5px !important;
    font-size: 12px !important;
    font-weight: 600 !important;
  }
  .gnav-scribe-label, .gnav-ask-label {
    display: inline !important;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
}

/* Signature panel + signed canvas: override the ≤599px canvas-col blanket-hide so they render
   as a fixed full-screen takeover (same pattern as mobile-assess-layer). */
@media (max-width: 599px) {
  body.visit-active .canvas-col:has(#signaturePanel),
  body.visit-active .canvas-col:has(.visit-signed-takeover) {
    display: flex !important;
    position: fixed !important;
    inset: 0 !important;
    z-index: 900 !important;
  }
}

/* Visit-switcher dropdown (fixed below gnav at ≤599px) */
.gnav-visit-popup {
  position: fixed;
  top: 52px; /* gnav height */
  right: 12px;
  z-index: 9999;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  min-width: 220px;
  padding: 6px 0;
  overflow: hidden;
}
.gnav-visit-popup-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  font-size: 13px;
  color: #111827;
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.gnav-visit-popup-item:hover { background: #f9fafb; }
.gnav-visit-popup-item.current { color: #444ad3; font-weight: 600; }
.gnav-visit-popup-date { font-size: 12px; color: #6b7280; }

/* ── Visit-active: narrow behavior (≤767px) ────────────────────────────────
   Triggers when outer padding drops to 2px — no visible space above the panel.
   Workspace goes edge-to-edge. ph header drops. Gnav absorbs patient context
   and shows scribe + ask circles. Actions also live in the hamburger menu.   */
@media (max-width: 767px) {
  /* Edge-to-edge workspace */
  body.visit-active .visit-workspace {
    border-radius: 0 !important;
    border-left: none !important;
    border-right: none !important;
    border-top: none !important;
    box-shadow: none !important;
  }
  /* Hide visit header — gnav takes over identity */
  body.visit-active .ph { display: none !important; }
  /* Show patient name + meta in gnav (like mobile already does at ≤599px) */
  body.visit-active .gnav-patient-block { display: flex; }
  body.visit-active .gnav-logo-mark { display: none !important; }
  body.visit-active .gnav-wordmark-text { display: none !important; }
  body.visit-active .gnav-logo-full { display: none !important; }
  /* Move right-action buttons out of gnav bar; scribe+ask circles take their slot */
  body.visit-active .gnav-right-actions { display: none !important; }
  body.visit-active .gnav-mobile-btn { display: flex; }
  /* Float bar replaced by gnav buttons — hide it */
  body.visit-active .mobile-float-bar { display: none !important; }
  /* Visit date/type header not needed once gnav absorbs patient context */
  body.visit-active #nsBrief { display: none !important; }
  /* Canvas-sheet at this width: full-width overlay (no partial-width split) */
  body.visit-active .outer.canvas-sheet .canvas-col { width: 100% !important; left: 0 !important; right: 0 !important; }
  /* Ask (ctx-sheet) at this width: proper bottom sheet, not inline split */
  body.visit-active .outer.record-open .ctx-sheet:not(.is-closed) {
    position: absolute !important;
    left: 0 !important; right: 0 !important;
    top: auto !important; bottom: 0 !important;
    height: 90% !important; max-height: 90% !important;
    border-radius: 24px 24px 0 0 !important;
    border: 0 !important;
    box-shadow: 0 -16px 42px rgba(25,32,44,.2) !important;
    flex: none !important; width: auto !important; min-width: 0 !important; max-width: none !important;
  }
}

/* ── Gnav-visit-actions: divider + actions in hamburger menu ───────────────*/
.gnav-visit-actions { display: none; padding: 0 0 8px; }
body.visit-active .gnav-visit-actions { display: block; }
.gnav-drawer-divider { border: none; border-top: 1px solid #e5e7eb; margin: 8px 0; }
.gnav-nav-action-row { display: flex; gap: 8px; padding: 4px 16px; }
.gnav-nav-action-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; border-radius: 10px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 600;
}
.gnav-nav-scribe-btn { background: #444ad3; color: #fff; }
.gnav-nav-scribe-btn:hover { background: #3a3fb8; }
.gnav-nav-ask-btn { background: #eef0fd; color: #444ad3; }
.gnav-nav-ask-btn:hover { background: #e0e2fb; }

/* ── Medium sched-row (600–899px): stack visit column ─────────────────────
   Time+date on top row, provider+type on bottom row within the visit cell. */
@media (max-width: 899px) {
  .sched-row-time-date { display: flex; gap: 6px; align-items: baseline; }
  /* In wide mode (detail closed), override horizontal to vertical; reset flex ratio */
  .sched-list--wide .sched-row-visit {
    flex: 1 !important;
    flex-direction: column !important;
    gap: 3px !important;
    align-items: flex-start !important;
  }
  /* Top row: time + date — same emphasized style */
  .sched-list--wide .sched-row-time { font-size: 12.5px !important; font-weight: 500; color: #2b2933; white-space: nowrap; }
  .sched-list--wide .sched-row-date { font-size: 12.5px; color: #2b2933; }
  /* Bottom row: provider + type — same de-emphasized style */
  .sched-list--wide .sched-row-visit-meta {
    display: flex !important;
    gap: 6px;
    margin-top: 0 !important;
    font-size: 11px;
    color: #726d83;
  }
  .sched-list--wide .sched-row-provider { font-size: 11px; color: #726d83; }
  .sched-list--wide .sched-row-type { font-size: 11px; color: #726d83; }
}

/* ── Narrow sched-row wrapping (≤599px) ───────────────────────────────────
   3-column row → 2-column grid: all patient info stacks left,
   actions pin right spanning both rows.                                    */
@media (max-width: 599px) {
  /* List pane fills full width; detail pane stays JS-hidden */
  .sched-list-pane { width: 100% !important; border-right: none !important; }
  /* Compact header: hide print/search icon pair and non-essential header buttons */
  .sched-icon-pair { display: none !important; }
  .sched-row {
    display: grid !important;
    grid-template-columns: 1fr auto;
    grid-template-areas: "patient actions" "visit actions";
    align-items: center;
    padding: 10px 14px !important;
    gap: 0 10px;
  }
  .sched-row-patient { grid-area: patient; }
  .sched-row-visit {
    grid-area: visit;
    min-width: 0 !important; flex: none !important;
    flex-direction: row !important; align-items: center !important;
    gap: 4px; margin-left: 0 !important; margin-top: 1px;
    display: flex; overflow: hidden;
  }
  /* Higher-specificity override so ≤899px column rule doesn't win at ≤599px */
  .sched-list--wide .sched-row-visit {
    flex-direction: row !important;
    align-items: center !important;
    gap: 4px !important;
  }
  .sched-list--wide .sched-row-visit-meta {
    display: inline-flex !important;
    margin-top: 0 !important;
  }
  /* Color hierarchy: name (darkest/bold) > dob/age > time+provider */
  .sched-row-sub { color: #4b5563 !important; }
  /* Visit info row: time-date block + provider side by side */
  .sched-row-time-date { display: inline-flex; gap: 5px; align-items: baseline; font-size: 11px; color: #9ca3af; }
  .sched-row-time { font-size: 11px !important; color: #9ca3af; font-weight: 400 !important; line-height: 15px; }
  .sched-row-date { font-size: 11px !important; color: #9ca3af; }
  .sched-row-visit-meta { display: inline-flex !important; margin-top: 0 !important; font-size: 11px; color: #9ca3af; white-space: nowrap; }
  .sched-row-type { display: none !important; }
  .sched-row-actions { grid-area: actions; margin-left: 0 !important; align-self: center; }
  .sched-mbi { display: none !important; }
  /* "  " gap between time-date and provider */
  .sched-row-visit-meta::before { content: '\00a0\00a0'; }
  /* Sort button hides at narrowest; filter becomes icon-only with count badge */
  .sched-sort-btn { display: none !important; }
  .sched-filter-label { display: none !important; }
  .sched-filter-count { display: flex !important; }
  /* At narrowest, time-date must not flex-grow — otherwise Emily Carter (provider) gets pushed out */
  .sched-list--wide .sched-row-time-date { flex: 0 0 auto !important; }
  /* At narrowest with canvas open, nav must stay full-width (canvas-col is hidden anyway) */
  .outer.canvas-open .nav-slice { flex: 1 1 auto !important; width: 100% !important; border-right: none !important; }
}
/* ── Scribe control button icon sizing ── */
.sz-control-btn svg { width: 16px !important; height: 16px !important; }
.ph-scribe-bar button svg { width: 16px !important; height: 16px !important; }
</style>

  e.stopPropagation();

  const popup = document.getElementById('gnavVisitPopup');
  const btn = document.getElementById('gnavMobileVisit');
  if (!popup) return;
  if (!_gnavVisitPopupOpen) { popup.style.display = 'none'; return; }
  // Build contents from PRIOR_VISITS data
  const option = currentVisitOption();
  const visitDate = option.label.split(' · ')[0] || 'Jun 26, 2026';
  const currentItem = `<button class="gnav-visit-popup-item current" onclick="_gnavVisitPopupOpen=false;document.getElementById('gnavVisitPopup').style.display='none';">
    <span style="flex:1;">
      <span style="display:block;">${visitDate}</span>

    </span>
  </button>`;
  const priorItems = PRIOR_VISITS.map(v => `<button class="gnav-visit-popup-item" onclick="_gnavVisitPopupOpen=false;document.getElementById('gnavVisitPopup').style.display='none';">
    <span style="flex:1;">
      <span style="display:block;">${v.date}</span>
      <span class="gnav-visit-popup-date">${v.type} · ${v.provider}</span>
    </span>
  </button>`).join('');
  popup.innerHTML = `<div style="padding:5px 12px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;">Visits</div>${currentItem}${priorItems ? '<hr style="border:none;border-top:1px solid #f3f4f6;margin:4px 0;">' + priorItems : ''}`;
  // Position: align right edge to gnav right, below gnav
  if (btn) {
    const rect = btn.getBoundingClientRect();
    popup.style.top = (rect.bottom + 6) + 'px';
    popup.style.right = (window.innerWidth - rect.right) + 'px';
    popup.style.left = 'auto';
  }
  popup.style.display = 'block';
  const dismiss = (ev) => {
    if (!popup.contains(ev.target) && ev.target !== btn) {
      _gnavVisitPopupOpen = false;
      popup.style.display = 'none';
      document.removeEventListener('click', dismiss);
    }
  };
  requestAnimationFrame(() => document.addEventListener('click', dismiss));
}

}

function usesMobileDisclosurePattern() {
  return window.innerWidth < 430;
}

function usesTabletDisclosurePattern() {
  return window.innerWidth < 768;
}

function usesOverlayDisclosurePattern() {
  return usesTabletDisclosurePattern() || usesMobileDisclosurePattern();
}
// Mobile sheet mode: nav fills workspace, assessment details open as bottom sheets.
function usesMobileSheetPattern() { return window.innerWidth <= 599; }
// Tablet Ask mode: Ask panel replaces canvas area (768–1099px).
function usesTabletAskPattern() { return window.innerWidth >= 768 && window.innerWidth <= 1099; }
// At ≥768px the longitudinal panel is always pinned as a right column.
function isAlwaysOpenPanel() { return !usesMobileSheetPattern(); }

function focusRecordComposer() {
  requestAnimationFrame(() => document.getElementById('recordQueryInput')?.focus());
}
function openRecord() {
  recordReturnFocus = document.activeElement;
  if (usesTabletDisclosurePattern()) { briefDetailId = null;reviewTaskId = null; }
  if (recordFilter) recordQuery = '';
  recordFilter = null;
  recordSheetDetent = usesMobileSheetPattern() ? 'full' : 'half';
  recordOpen = true;
  renderAll();
  focusRecordComposer();
}
function openFilteredRecord(id) {
  recordReturnFocus = document.activeElement;
  if (usesTabletDisclosurePattern()) { briefDetailId = null;reviewTaskId = null; }
  const aliases = {diabetes:'dm',t2dm:'dm',heart:'hfref',heart_failure:'hfref',kidney:'ckd',hospital:'hospitalization'};
  recordFilter = aliases[id] || id;
  recordQuery = '';
  recordDraft = '';
  recordAttachment = '';
  recordMessages = [];
  recordSheetDetent = 'full';
  recordOpen = true;
  renderAll();
  requestAnimationFrame(() => document.getElementById('ctxDragHandle')?.focus({preventScroll:true}));
}
function openLastVisit() {
  openFilteredRecord('last-visit');
}
function clearRecordFilter() {
  recordFilter = null;
  recordQuery = '';
  renderCtxSheet();
}
function closeRecord() {
  recordOpen = false;
  recordFullWidth = false;
  renderAll();
  const returnTarget = recordReturnFocus;
  recordReturnFocus = null;
  requestAnimationFrame(() => returnTarget?.focus?.({preventScroll:true}));
}
function requestCloseRecord() {
  const dirty = recordDraft.trim() || recordAttachment;
  if (dirty && !window.confirm('Leave without saving?')) return;
  closeRecord();
}
function toggleRecord() { recordOpen ? requestCloseRecord() : openRecord(); }
function openAsk() {
  if (!recordOpen) openRecord();
  else focusRecordComposer();
}

function briefChatOpenMed(idx) { recordMessages = []; askMedDetailId = idx; renderCtxSheet(); }

function openBriefAsk() {
  recordMessages = [];

}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
  })[c]);
}

function recordContextLabel() {
  if (selectedAssessmentId) return (ITEMS[selectedAssessmentId]||{label:selectedAssessmentId}).label;
  if (liveTopicId) return (ITEMS[liveTopicId]||{label:liveTopicId}).label;
  return 'this patient';
}

function recordSuggestions() {
  return ['Summary since last visit','Post-HF decompensation watch-outs','Cardiology follow-up priorities','Carvedilol — new med counseling points','Basal insulin decision (A1c 7.8%)'];
}

function matchingRecordSuggestions(value) {
  const q = value.trim().toLowerCase();
  if (!q) return recordSuggestions().slice(0,4);
  if (/(interact|furosemide|lasix|jardiance|sglt2|dapagliflozin|empagli)/.test(q)) return ['Furosemide + SGLT2 interaction — diuretic risk','Which medications need renal monitoring?','Cardiology follow-up priorities'];
  if (/(beta.block|carvedilol|metoprolol|insulin.*mask|mask.*hypo|hypoglyc)/.test(q)) return ['Carvedilol — new med counseling points','Beta-blockade and hypoglycemia masking','Basal insulin decision (A1c 7.8%)'];
  if (/(watch.out|post.dis|hf.watch|chf.watch|weight|edema|sob)/.test(q)) return ['Post-CHF watch-outs','Cardiology follow-up priorities'];
  if (/(a1c|hba1c|glyc|esrd|dialysis|diabet)/.test(q)) return ['Basal insulin decision (A1c 7.8%)','A1c interpretation in CKD Stage 4','HTN treatment options given current meds'];
  if (/(insulin|basal|start.*ins)/.test(q)) return ['Basal insulin decision (A1c 7.8%)','A1c interpretation in CKD Stage 4'];
  if (/(kidney|renal|egfr|creatin|ckd)/.test(q)) return ['Show evidence for Stage 4 CKD','Which medications need renal monitoring?','Furosemide + SGLT2 interaction — diuretic risk'];
  if (/(hospital|discharge|admission)/.test(q)) return ['Post-CHF watch-outs','Cardiology follow-up priorities','What changed after the hospitalization?'];
  if (/(heart|cardio|bnp)/.test(q)) return ['Cardiology follow-up priorities','Post-CHF watch-outs'];
  if (/(mammo|screen|breast|preventive)/.test(q)) return ['Mammogram — evidence and counseling'];
  if (/(htn|blood.press|hypertens)/.test(q)) return ['HTN treatment options given current meds','Cardiology follow-up priorities'];
  const words = q.split(/\s+/).filter(Boolean);
  const matches = recordSuggestions().filter(s => words.some(w => s.toLowerCase().includes(w)));
  return (matches.length ? matches : recordSuggestions()).slice(0,4);
}

function typeaheadHTML(value) {
  return matchingRecordSuggestions(value).map(s=>
    `<button class="ctx-suggestion-chip" onclick='useRecordSuggestion(${JSON.stringify(s)})'>${escapeHTML(s)}</button>`
  ).join('');
}

function setRecordDraft(value) {
  recordDraft = value;
  const el = document.getElementById('recordTypeahead');
  if (el) el.innerHTML = typeaheadHTML(value);
}

function useRecordSuggestion(text) {
  recordDraft = text;
  renderCtxSheet();
  const el = document.getElementById('recordQueryInput');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

      <button class="ctx-query-btn primary" onclick="askPatientRecord()">Ask</button>
    </div>
    ${recordAttachment ? `<div class="ctx-attachment">Attached: ${escapeHTML(recordAttachment)}</div>` : ''}

}

      </div>`;
    }
    return '';
  }).join('');
}

function answerPatientQuestion(question) {
  const q = question.toLowerCase();
  let sections = [];
  if (/summary.*last.*visit|since.*last.*visit|what.*changed|brief.*summary|visit.*summary/i.test(question)) {
    sections.push({type:'brief-card'});
  } else if (/interact|furosemide|lasix|jardiance|sglt2/i.test(question)) {
    sections.push({type:'answer',label:'Drug Interaction',body:'Furosemide (loop diuretic) and empagliflozin/SGLT2 inhibitors have additive diuretic effects. Combined use increases risk of volume depletion, hypotension, and AKI — particularly relevant in patients with HFrEF or CKD.'});
    sections.push({type:'bullets',label:'Watch for',items:['Orthostatic hypotension or dizziness','Creatinine rise (&gt;0.3 mg/dL from baseline)','Weight drop &gt;2 lb/day suggesting over-diuresis','Electrolyte depletion (K+, Na+, Mg2+)']});
    sections.push({type:'bullets',label:'Clinical action',items:['Check electrolytes and renal function if both active','Reduce Furosemide dose if eGFR dropping','Hold SGLT2i if acute illness or planned contrast']});
  } else if (/beta.block|carvedilol|metoprolol|insulin.*mask|mask.*hypo/i.test(question)) {
    sections.push({type:'answer',label:'Beta-Blockade &amp; Hypoglycemia',body:'Beta-blockers blunt the tachycardic response to hypoglycemia, masking a key warning sign. Non-selective beta-blockers (e.g. carvedilol) also impair glycogenolysis, potentially prolonging hypoglycemic episodes.'});
    sections.push({type:'bullets',label:'Symptoms that still occur despite beta-blockade',items:['Diaphoresis (sweating) — preserved adrenergic response','Tremor and pallor','Hunger and confusion']});
    sections.push({type:'bullets',label:'Counseling points for this patient',items:['Review non-adrenergic hypoglycemia symptoms','Keep glucose tabs or fast-acting carbs accessible','Frequency of fasting glucose checks while on both agents','Target glucose range and when to call']});
  } else if (/post.chf|post.hosp|watch.out|post.*hf|decompens|re.admiss/i.test(question)) {
    sections.push({type:'answer',label:'Post-Discharge Red Flags',body:'Patients discharged after HF decompensation are at highest readmission risk in the first 2 weeks. Early decompensation can be subtle. BNP at discharge was 680 pg/mL.'});
    sections.push({type:'bullets',label:'Warn patient to call if',items:['Weight gain &gt;3 lb in 2 days or &gt;5 lb in a week','Increasing leg swelling, SOB lying flat, or waking at night with breathlessness','New or worsening cough','Dizziness or near-syncope (volume depletion vs. over-diuresis)']});
    sections.push({type:'bullets',label:'Today — confirm before they leave',items:['Daily weight log in place (scale at home?)','Sodium restriction &lt;2g/day understood','Follow-up appointments scheduled: PCP + cardiology','Medication changes from discharge understood']});
  } else if (/hba1c|a1c|glycat|hemoglobin.*a1/i.test(question)) {
    sections.push({type:'answer',label:'HbA1c Context',body:'Current HbA1c: 7.8% (at goal range for this patient).'});
    sections.push({type:'bullets',label:'Interpret in context',items:['Standard T2DM target: &lt;7.0% (ADA), or &lt;8.0% in older/complex patients','CKD Stage 4: HbA1c may be falsely low due to shortened RBC survival — fructosamine more reliable','Rapid normalization in high-risk cardiac patients increases hypoglycemia risk']});
    sections.push({type:'bullets',label:'Next steps to consider',items:['Fasting glucose log review at this visit','Confirm insulin titration plan if on glargine','Retinal exam referral if not done in 12 months','Renal-safe medication options: insulin, DPP-4i (dose-adjusted); avoid SGLT2i if eGFR &lt;30, metformin if CKD4+']});
  } else if (/ckd|egfr|creatinine|renal|kidney|staging/i.test(question)) {
    sections.push({type:'answer',label:'CKD Staging',body:'CKD is staged by eGFR and albuminuria. Current data: eGFR 29 mL/min/1.73m² (down from 46 in March). Stage 3a=45–59, 3b=30–44, Stage 4=15–29, Stage 5=&lt;15 mL/min/1.73m².'});
    sections.push({type:'bullets',label:'Stage 4 implications (eGFR 15–29)',items:['Nephrology co-management — essential','Prepare for renal replacement therapy (HD, PD, transplant referral)','Avoid NSAIDs, nephrotoxic contrast unless essential','Medication dose adjustments: metformin hold at eGFR &lt;30, many antibiotics need dose reduction','Potassium and phosphorus restrictions']});
    sections.push({type:'bullets',label:'Monitor at each visit',items:['BMP: creatinine, BUN, K+, HCO3','BP target &lt;130/80 mmHg','Urine ACR (if not recent)','Anemia: Hgb, iron studies','Referral to nephrology if not yet established']});
  } else if (/basal|insulin|glargine|titrat|diabetes.*insulin|dm.*insulin/i.test(question)) {
    sections.push({type:'answer',label:'Basal Insulin Decision',body:'Basal insulin (glargine, detemir, degludec) is the preferred add-on when A1c remains above target on oral agents, or when oral agents are contraindicated. Current A1c: 7.8%.'});
    sections.push({type:'bullets',label:'Starting dose guidance',items:['Start: 10 units qHS (or 0.1–0.2 u/kg/day)','Titrate: +2 units every 3 days if fasting BG &gt;130 mg/dL','Target fasting BG: 80–130 mg/dL','Hold or reduce if fasting BG &lt;80 on 2+ occasions']});
    sections.push({type:'bullets',label:'Special considerations for this patient',items:['CKD Stage 4: insulin clearance reduced — lower starting dose, closer monitoring','Beta-blockade (carvedilol) masks tachycardia; counsel on sweating/tremor as hypo signs','Document home glucose monitoring frequency at this visit']});
  } else if (/htn|hypertens|blood.*press|bp.*target|uptitrat/i.test(question)) {
    sections.push({type:'answer',label:'Hypertension in HFrEF / CKD',body:'BP target for this patient is &lt;130/80 mmHg (AHA/ACC for HFrEF + CKD). Current BP 138/86 — above target. Current medications may already have synergistic BP-lowering effects.'});
    sections.push({type:'bullets',label:'Preferred agents in HFrEF + CKD',items:['ACE inhibitor or ARB — first-line, renoprotective; monitor K+ and Cr','Beta-blocker (carvedilol, metoprolol succinate) — mortality benefit in HFrEF','Loop diuretic (Furosemide) — volume-mediated BP reduction','Spironolactone/eplerenone — add-on for resistant HTN; monitor K+ carefully in CKD']});
    sections.push({type:'bullets',label:'Avoid or use with caution',items:['Dihydropyridine CCBs (amlodipine) — may worsen edema in HF','NSAIDs — raise BP and blunt diuretic effect','Combination ACE+ARB — increased AKI and hyperkalemia risk']});
  } else if (/eye|retina|retinop|ophthal|vision|diabetic.*eye/i.test(question)) {
    sections.push({type:'answer',label:'Diabetic Eye Exam',body:'Annual dilated fundus exam is recommended for all patients with diabetes. With A1c above goal, the risk of diabetic retinopathy and macular edema is elevated.'});
    sections.push({type:'bullets',label:'Why this matters now',items:['Diabetic retinopathy is the leading cause of preventable blindness in working-age adults','Early detection allows laser or anti-VEGF treatment before vision loss','A1c &gt;8% substantially increases annual progression risk']});
    sections.push({type:'bullets',label:'Referral pathway',items:['Order dilated fundus exam with ophthalmology or optometry','Specify "diabetic eye exam" on referral — not routine vision check','Document last exam date in chart','Return sooner if any visual changes in the interim']});
  } else if (/mammogram|breast.*screen|colorectal|colonoscopy|fit.*test|stool/i.test(question)) {
    sections.push({type:'answer',label:'Mammogram Screening',body:'USPSTF recommends biennial mammography for average-risk women ages 40–74. ACR and ACOG recommend annual screening starting at 40. Last documented screening is overdue.'});
    sections.push({type:'bullets',label:'At this visit',items:['Confirm last mammogram date in chart','Order bilateral screening mammogram if overdue','Note: dense breast tissue on prior reports warrants supplemental imaging discussion','Referral to breast center if any palpable abnormality']});
  } else if (/cardiology.*follow|follow.*cardiol/i.test(question)) {
    sections.push({type:'answer',label:'Cardiology Follow-Up',body:'Last cardiology visit: Jun 16, 2026 (Dr. Priya Mehta). BNP 780 (down from 1,240 at admission). Volume stable. Continue Furosemide 40mg, Carvedilol 12.5mg, Lisinopril 10mg. Cardiology f/u in 6 weeks.'});
    sections.push({type:'bullets',label:'Key questions for cardiology',items:['Echocardiogram interval (EF reassessment)','Uptitration of GDMT (ACE/ARB, beta-blocker, MRA, SGLT2i if eGFR allows)','Device evaluation if EF ≤35% (CRT-D candidacy)','BNP trend — target downtrending from admission value']});
  }
  if (!sections.length) {
    sections.push({type:'answer',label:'Clinical Summary',body:'Based on the available chart data, here is what\'s relevant for this visit.'});
    sections.push({type:'bullets',label:'Key active conditions',items:['HF decompensation — BNP 780, post-discharge day 15','Hypertension — BP 138/86','Diabetes — A1c 7.8%','CKD Stage 4 — eGFR 29']});
    sections.push({type:'note',body:'Ask a more specific question for medication details, lab trends, or clinical decision support.'});
  }
  return { text: sectionsToHTML(sections), citations: [] };
}

function getRecordSheetMax() {
  const outer = document.querySelector('.outer');
  const nav = document.querySelector('.nav-slice');
  const resizer = document.getElementById('ctxResizer');
  if (!outer || !nav) return 520;
  // The visit surface initializes while hidden behind the schedule. Do not let a
  // zero-width measurement collapse the preferred sheet width.
  if (outer.clientWidth < 800) return Math.max(RECORD_SHEET_DEFAULT, recordSheetWidth);
  // 50/50 is calculated between active canvas and patient record; agenda is excluded.
  const styles = getComputedStyle(outer);
  const horizontalPadding = parseFloat(styles.paddingLeft) + parseFloat(styles.paddingRight);
  const remaining = outer.clientWidth - horizontalPadding - nav.offsetWidth - (resizer ? resizer.offsetWidth : 10);
  return Math.max(RECORD_SHEET_MIN, Math.floor(remaining / 2));
}

function applyRecordSheetWidth(width, announce=false) {
  const max = getRecordSheetMax();
  recordSheetWidth = Math.max(RECORD_SHEET_MIN, Math.min(max, Math.round(width)));
  const outer = document.querySelector('.outer');
  const resizer = document.getElementById('ctxResizer');
  if (outer) outer.style.setProperty('--record-sheet-width', `${recordSheetWidth}px`);
  if (resizer) {
    resizer.setAttribute('aria-valuemin', String(RECORD_SHEET_MIN));
    resizer.setAttribute('aria-valuemax', String(max));
    resizer.setAttribute('aria-valuenow', String(recordSheetWidth));
    resizer.setAttribute('aria-valuetext', `${recordSheetWidth} pixels`);
    if (announce) resizer.focus();
  }
}

function toggleRecordSheetWidth() {
  recordFullWidth = !recordFullWidth;
  renderAll();
  renderCtxSheet();
}

function initRecordResizer() {
  const handle = document.getElementById('ctxResizer');
  if (!handle || handle.dataset.ready) return;
  handle.dataset.ready = 'true';
  let dragging = false;
  const move = event => {
    if (!dragging) return;
    const outer = document.querySelector('.outer');
    if (!outer) return;
    applyRecordSheetWidth(outer.getBoundingClientRect().right - event.clientX);
  };
  const end = event => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    try { handle.releasePointerCapture(event.pointerId); } catch (_) {}
  };
  handle.addEventListener('pointerdown', event => {
    dragging = true;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', move);
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
  handle.addEventListener('dblclick', toggleRecordSheetWidth);
  handle.addEventListener('keydown', event => {
    const step = event.shiftKey ? 48 : 16;
    if (event.key === 'ArrowLeft') { event.preventDefault(); applyRecordSheetWidth(recordSheetWidth + step); }
    if (event.key === 'ArrowRight') { event.preventDefault(); applyRecordSheetWidth(recordSheetWidth - step); }
    if (event.key === 'Home') { event.preventDefault(); applyRecordSheetWidth(RECORD_SHEET_MIN); }
    if (event.key === 'End') { event.preventDefault(); applyRecordSheetWidth(getRecordSheetMax()); }
  });
  window.addEventListener('resize', () => applyRecordSheetWidth(recordSheetWidth));
  applyRecordSheetWidth(recordSheetWidth);
}

function initMobileRecordSheetDrag() {
  const handle = document.getElementById('ctxDragHandle');
  const sheet = document.getElementById('ctxSheet');
  if (!handle || !sheet || handle.dataset.ready) return;
  handle.dataset.ready = 'true';
  let startY = 0;
  let deltaY = 0;
  const settle = event => {
    sheet.style.transition = 'transform .22s cubic-bezier(.2,.75,.2,1)';
    sheet.style.transform = '';
    window.setTimeout(() => { sheet.style.transition = ''; }, 240);
    if (deltaY > 72) requestCloseRecord();
    else if (deltaY < -54 && recordSheetDetent !== 'full') {
      recordSheetDetent = 'full';
      renderCtxSheet();
    }
    deltaY = 0;
    try { handle.releasePointerCapture(event.pointerId); } catch (_) {}
  };
  handle.addEventListener('pointerdown', event => {
    if (!usesMobileDisclosurePattern()) return;
    startY = event.clientY;deltaY = 0;
    sheet.style.transition = 'none';
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', event => {
    if (!handle.hasPointerCapture(event.pointerId)) return;
    deltaY = event.clientY - startY;
    sheet.style.transform = `translateY(${Math.max(-36, deltaY)}px)`;
  });
  handle.addEventListener('pointerup', settle);
  handle.addEventListener('pointercancel', settle);
  handle.addEventListener('keydown', event => {
    if (event.key === 'ArrowUp') { event.preventDefault();recordSheetDetent='full';renderCtxSheet(); }
    if (event.key === 'ArrowDown') { event.preventDefault();requestCloseRecord(); }
  });
}

function trapFocusIn(container, event) {
  if (event.key !== 'Tab' || !container) return;
  const focusable = [...container.querySelectorAll('button,[href],input,textarea,select,[tabindex]:not([tabindex="-1"])')]
    .filter(node => !node.disabled && node.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault();last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault();first.focus(); }
}

  if (lifecycleState !== 'ready' && !isResolved('close')) {

    return `<div style="padding:16px 16px 0;">
      <div style="font-size:10.5px;font-weight:600;color:#9CA3AF;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;">SUMMARY</div>
      ${rows}
    </div>`;
  }

  if (tab === 'medications') {
    return renderMedsTable();
  }

  if (tab === 'labs') {
    return renderNewLabsList();
  }

  if (tab === 'encounters') {
    return renderNewEncountersList();
  }

  // Legacy fallback for conditions / old tabs (used by openAskWithFilter)
  if (tab === 'conditions') {
    const sf = askSubFilter[tab] || 'active';
    const filtered = sf === 'flagged' ? ASK_CONDITIONS.filter(c => c.status === 'FLAGGED')
      : sf === 'chronic' ? ASK_CONDITIONS.filter(c => c.status === 'CHRONIC')
      : ASK_CONDITIONS;
    const hdr = sf === 'flagged' ? 'FLAGGED CONDITIONS' : sf === 'chronic' ? 'CHRONIC CONDITIONS' : 'ACTIVE CONDITIONS';
    return renderAskConditionsList(filtered, hdr);
  }
  return '';
}

  const label = statusLabels[m.changeType] || m.changeType.toUpperCase();
  const medName = m.medName.replace(/\n\[/g,' (').replace(/\]/g,')');
  const cleanDose = m.dosage.replace(/\s+PO\s+(BID|Daily|TID|QID|QD|PRN).*/i, '').trim();
  const doseDisplay = d.form ? `${cleanDose} · ${d.form}` : m.dosage;
  const fill = d.fill || {};
  const pharmacy = d.pharmacy || {};
  const history = d.history || [];
  const secHdr = t => `<div class="med-tbl-sec-hdr" style="border-bottom:1px solid #EAEBEF;">${t}</div>`;
  const infoRow = (lbl, val, sub) => `<div style="display:flex;justify-content:space-between;align-items:${sub?'flex-start':'center'};padding:10px 16px;border-bottom:1px solid #EAEBEF;">
    <span style="font-size:13px;color:#6B7280;">${lbl}</span>
    <div style="text-align:right;"><div style="font-size:13px;font-weight:500;color:#2B2933;">${escapeHTML(String(val))}</div>${sub?`<div style="font-size:11px;color:#9CA3AF;">${escapeHTML(String(sub))}</div>`:''}</div>
  </div>`;
  const historyRows = history.map((h, i, arr) => {
    const isFirst = i === 0, isLast = i === arr.length - 1;
    return `<div style="display:flex;align-items:stretch;">
      <div style="width:12px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;margin-right:10px;">
        <div style="width:2px;${isFirst?'height:4px;background:transparent;':'flex:1;min-height:6px;background:#D6D6E1;'}"></div>
        <div style="width:8px;height:8px;border-radius:50%;background:#726D83;border:2px solid #fff;flex-shrink:0;outline:1px solid #726D83;"></div>
        <div style="width:2px;${isLast?'height:4px;background:transparent;':'flex:1;min-height:6px;background:#D6D6E1;'}"></div>
      </div>
      <div style="flex:1;padding-bottom:${isLast?'4':'16'}px;">
        <div style="font-size:13px;color:#2B2933;line-height:18px;">${escapeHTML(h.dose)} ${escapeHTML(h.event)}</div>
        <div style="font-size:11px;color:#9CA3AF;margin-top:2px;">${escapeHTML(h.date)}</div>
      </div>
    </div>`;
  }).join('');
  return `<div style="display:flex;flex-direction:column;flex:1;min-height:0;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid #EAEBEF;flex-shrink:0;">
      <button onclick="closeMedDetail()" style="display:flex;align-items:center;gap:3px;border:none;background:none;cursor:pointer;padding:0;font-family:inherit;font-size:13px;font-weight:500;color:var(--accent);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="m15 18-6-6 6-6"/></svg>
        All meds
      </button>
      <button class="elders-round-btn" onclick="requestCloseRecord()" aria-label="Close" title="Close" style="margin:0;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div style="padding:12px 16px 10px;border-bottom:1px solid #EAEBEF;flex-shrink:0;">
      <div class="elders-sheethead-titles">
        <span class="elders-sheethead-eyebrow" style="color:${color};">${label}</span>
        <span class="elders-sheethead-title">${escapeHTML(medName)}</span>
        <span class="elders-sheethead-sub">${escapeHTML(doseDisplay)}</span>
        <span class="elders-sheethead-sub">Last filled ${escapeHTML(m.lastFilled)} · First filled ${escapeHTML(d.firstFilled||'—')}</span>
      </div>
    </div>
    <div style="flex:1;overflow-y:auto;scrollbar-width:none;">
      ${secHdr('Fill info')}
      ${infoRow('Prescriber', fill.prescriber||'—', fill.specialty)}
      ${infoRow('Tablet number', fill.tablets!==undefined?fill.tablets:'—')}
      ${infoRow('Refills remaining', fill.refills!==undefined?fill.refills:'—')}
      ${secHdr('Pharmacy')}
      ${infoRow('Name', pharmacy.name||'—')}
      ${infoRow('Address', pharmacy.address||'—')}
      ${infoRow('Phone number', pharmacy.phone||'—')}
      ${history.length?`${secHdr('History')}<div style="padding:8px 16px 12px;">${historyRows}</div>`:''}
    </div>
  </div>`;
}

function renderMedsTable() {
  const searchIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#726D83" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;
  const sortIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3F45C4" stroke-width="2"><path d="M3 6h18M7 12h10M11 18h2"/></svg>`;
  const chevron = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#726D83" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>`;
  const medRow = (m, idx) => `<div class="med-tbl-row" style="cursor:pointer;" onclick="openMedDetail(${idx})" onmouseenter="this.style.background='#FAF9FC'" onmouseleave="this.style.background=''">
    <div class="med-tbl-row-name" style="white-space:pre-line;">${escapeHTML(m.medName)}</div>
    <div class="med-tbl-row-dosage">${escapeHTML(m.dosage)}</div>
    <div class="med-tbl-row-date">${escapeHTML(m.lastFilled)}</div>
    <div style="flex-shrink:0;margin-left:4px;">${chevron}</div>
  </div>`;

  const subsecDef = [
    {type:'started',        color:'#444AD3', label:'STARTED'},
    {type:'changed',        color:'#A06131', label:'CHANGED'},
    {type:'adherence-risk', color:'#E00D1A', label:'ADHERENCE RISK'},
    {type:'stopped',        color:'#726D83', label:'STOPPED'},
  ];
  const sf = askSubFilter.medications || 'all';
  const allMeds = ASK_MEDS.filter(m => m.changeType !== 'active');
  const activeMeds = sf === 'inactive'
    ? ASK_MEDS.filter(m => m.changeType === 'stopped')
    : ASK_MEDS.filter(m => m.changeType === 'active');
  const updateMeds = sf === 'inactive'
    ? ASK_MEDS.filter(m => m.changeType === 'stopped')
    : allMeds.filter(m => sf === 'all' || sf === 'updates' ? true : false);

  const subsections = subsecDef.map(s => {
    const pool = (sf === 'inactive') ? [] : updateMeds;
    const rows = pool.filter(m => m.changeType === s.type)
      .map(m => medRow(m, ASK_MEDS.indexOf(m))).join('');
    if (!rows) return '';
    return `<div class="med-tbl-subsec">
      <div class="med-tbl-subsec-label-row">
        <div class="med-tbl-subsec-bar" style="background:${s.color};"></div>
        <span class="med-tbl-subsec-text" style="color:${s.color};">${s.label}</span>
      </div>
      ${rows}
    </div>`;
  }).join('');

  const showUpdates = sf === 'all' || sf === 'updates';
  const showActive  = sf === 'all' || sf === 'active';
  const showInactive = sf === 'inactive';
  const inactiveMeds = ASK_MEDS.filter(m => m.changeType === 'stopped');

  const updatesSection = showUpdates && allMeds.length ? `
    <div class="med-tbl-sec-hdr">UPDATES (${allMeds.length})</div>
    ${subsections}` : '';
  const inactiveSection = showInactive ? `
    <div class="med-tbl-sec-hdr">INACTIVE</div>
    <div class="med-tbl-active-sec">${inactiveMeds.map(m => medRow(m, ASK_MEDS.indexOf(m))).join('')}</div>` : '';
  const activeSection = showActive && activeMeds.length ? `
    <div class="med-tbl-sec-hdr" style="border-top:1px solid #D6D6E1;margin-top:4px;">ACTIVE</div>
    <div class="med-tbl-active-sec">${activeMeds.map(m => medRow(m, ASK_MEDS.indexOf(m))).join('')}</div>` : '';

  return `<div class="med-tbl">
    <div class="med-tbl-search-area">
      <div class="med-tbl-search">${searchIcon}<input type="search" placeholder="Search medications" readonly/></div>
      <div style="display:flex;align-items:center;gap:6px;">
        <div style="display:flex;gap:6px;">
          ${[['all','All'],['updates','Updates'],['active','Active'],['inactive','Inactive']].map(([val,lbl]) => {
            const on = (askSubFilter.medications || 'all') === val;
            return `<button onclick="setAskSubFilter('medications','${val}')" class="med-f-pill${on?' on':''}">${lbl}</button>`;
          }).join('')}
        </div>
        <button style="flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid #D6D6E1;border-radius:8px;padding:4px 6px;background:none;cursor:pointer;color:#726D83;margin-left:auto;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
        </button>
      </div>
    </div>
    <div class="med-tbl-col-hdr">
      <div class="med-tbl-col-name">Medication</div>
      <div class="med-tbl-col-dosage">Dosage</div>
      <div class="med-tbl-col-date">Last Filled</div>
      <div class="med-tbl-col-spacer"></div>
    </div>
    ${updatesSection}${inactiveSection}${activeSection}
  </div>`;
}
